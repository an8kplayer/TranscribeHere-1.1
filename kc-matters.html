  { name: "Transcription No: 99", text: "The Textile Enquiry Committee says that we are getting much less cloth than we had even under a foreign Government in the year 1938-39. Only one conclusion can be drawn from this statement of the Textile Enquiry Committee in its report. I have great respect for his intelligence and I know that the meaning of the report will not have been lost on him. What I was saying was that Indo-Pakistan trade is very important. In the entire scheme of our import-export trade, that does not feature much. The market that we lose there is being taken by the foreigners, especially the U.S.A. and U.K., and the market Pakistan loses in our country is being taken up to a great extent by these two countries, and if you see the line of trade, the fall in the Indo-Pakistan trade has given rise to our trade with one or other of the foreign countries with regard to certain commodities. Our import and export policy does not take initiative to see as to how the trade could be developed with Pakistan. I am aware of the political difficulties that are in the way of the Ministry. At the same time, it is the duty of the Ministry to take initiative and bring home the fact that unless and until we put our trade between these two countries, where normal and natural economic ties have been disrupted, on a proper footing, there will always be disadvantages on our side and certain other interlopers will come in and take advantage of that situation in order to ruin our economy and that precisely is what is happening today if you carefully look into the developments in that connection. There is yet another problem of our relations with U.K. that calls for a separate treatment. In the old days the hon. Ministers and their leaders and their camp followers were all complaining against the preferential treatment that was then called Imperial Preference, the various agreements that were arrived at unilaterally for fleecing India's economy. Times have changed and no longer are we supposed to be in the British Empire; we are a Commonwealth country and a Republic. But what about those preferences? Have they all been abolished? Who are deriving all the benefits out of them? That is a point which needs clarification. Whenever we raise that point, we are told that we are deriving more benefits because of these preferences than the United Kingdom but whenever we read their papers, their London Times, Economic Section and all other papers emanating from the city of London, we find that they tell their own people that they are happy, that they are having this kind of relationship with us and they are gaining by such preferences. Now, are we to understand that we are both gaining as a result of these preferences? I don't think so. The position is not at all so. On the contrary, as a result of these preferences, India stands to lose. That position, I think, has not been altered to the satisfaction of our country and the hon. Minister will perhaps clarify that position when he speaks. If these preferences work to the detriment of our economy, the time has come when we must give them up. We need not go in for such preferences, and I am sure that the policy which is required has got to be adopted in the interests of our entire economy, not merely in the interests of our foreign sector and not merely in the interests of any particular sector. Reference has been made to sterling balances. I don't know how much of the sterling balances is left at the moment. It would not exceed 740 crores. It may be much less. A large part of our sterling balances had been expended with a view to meeting the deficit in the balance of payments. It was thought at the end of the war that these balances which had accumulated there would be utilized for financing certain developments in our country, for developing the economy in our country, in particular for importing machinery that we directly required. After the termination of the war, the reverse process took place. I would only mention what Sir Winston Churchill, the Prime Minister at that moment, has written in his War Memoirs. He is very bitter about India's claims on sterling balances. He says that he does not like at all that India should make demands on the sterling balances. He thought that he had saved India and, therefore, India had no right to claim the sterling balances. This is how he has written, although he does not use the same blunt words but he makes it very clear. Here is the British Prime Minister who would not like a penny out of the sterling balances to be paid to India but circumstances have compelled him to do so many things. Similarly he has been forced to accept a position where sterling balances had to be paid under certain agreements in instalments and we all know that. But you see that large chunks of the sterling balances had been spent for meeting the deficit in the balance of trade. A much bigger amount has been spent for meeting the deficit in the balance of payments including such items as pensions. You know we have a tapering annuity, out of which the pensions are paid, and that money is paid from the sterling balances. Therefore, it is a scandalous thing that these balances had been spent not for the development of the economy of our country but for meeting certain liabilities which we might have just as well avoided and liabilities which we should not even recognise, for instance, the liabilities with regard to pensions and all that. It is no use trying to explain the position in great details regarding the sterling balances in our country."},
  { name: "Transcription No: 100", text: "Sir, it is usual in all parliamentary systems of Government for the President, at the opening of a session, to address both Houses of Parliament. It has been criticised as being merely a narration of facts which have happened during the past year. But that is the usual thing, as hon. Members know, which happens in most of the Parliaments which work under parliamentary systems of Government. I am sure that the hon. Members are aware that India has always stood for peace, and ever since her independence, has done what she could to preserve peace in the world. Both in Korea and in Indo-China, our efforts led to a cease-fire, and for the first time, with the settlement of the Indo-China problem, there was no shooting war anywhere in the world. But now again there are war clouds, especially in the Far East. As has been emphasised by the Prime Minister time and again, patience and tolerance are necessary to solve the tangle in Formosa. Our Government has recognised the Chinese People's Republic as the Government of China and have recognised the Chinese claim to the Cairo Declaration. If the Cairo Declaration is to have any value, then it is fairly certain that Formosa is part of China. But at the same time, one cannot forget the fact that things have got to be tackled patiently, if this problem of Formosa is to be solved in a peaceful manner. That will take time, and it is towards that end, I am sure, that our Prime Minister is working so that there will be no clash in the Far East with regard to the question of Formosa. This has been prominently mentioned in the Address of the President. We hope that patience will be exercised by both the sides to solve this question, and there will be no incident which might lead to serious consequences. Our agreement with China on Tibet, which formed the basis of the joint statement by China's and our Prime Ministers regarding Panch Shila, must form the main principle through which international tension can be eased and finally peace established. I am glad, Sir, that recently the King of Laos has accepted the idea of the five principles put forward in this declaration. It is usual in the present time of atomic age, to talk about the dangers of the use of atom for warlike purposes. The question is whether the new instrument in the hands of men is going to be used for the benefit of humanity or for the destruction of humanity and human civilisation, as we know it today. Both the United States and the Union of Soviet Socialist Republics possess atomic weapons, and the United Kingdom Government has now planned to manufacture hydrogen bombs for their security. As the Prime Minister has pointed out time and again, our country is not interested in the production of atomic weapons, but we are immensely interested in the use of atomic energy for peaceful purposes. There is no doubt whatever that in the interests of human civilisation these weapons should not only be banned, but destroyed. The question is, who is going to take the risk? There have been appeals, that as the U.S.A. was the first nation to manufacture these dangerous weapons and use them, therefore, they should set an example by destroying the bombs in their possession. Stock-piling of atomic weapons would lead to a dangerous situation and somebody, therefore, ought to make a start in the matter of the destruction of these weapons. If moral standards are to be the guiding factor, it will be a great help to humanity. If this step can be taken, if only there is courage to do so, the U.S.S.R. will have to follow suit, but unfortunately there is the complex. Most nations want to protect themselves and want to guard themselves against any surprise attacks by the other side. So, the armaments race goes on. They forget that this mentality will eventually lead to war. They think that negotiations can take place only when one can speak from strength, but they forget that two can play at this game. So long as this view is held, the armaments race will go on and tension must certainly increase. The Conference which meets in London in a few days' time on disarmament, I hope, will find a solution. The complete banning of nuclear weapons must be the first step that any conference should strive at and I hope that under proper international supervision this step will be taken. But connected with this, is the question of the reduction of conventional armaments. There must be a realistic approach to this problem. The U.S.S.R. today possesses so much strength that it should be the first to agree to reduce its land army in the interests of the good relations that should exist between nations. One hopes that it will understand this position and take steps to get this done. I am glad that the Atomic Energy Commission of the United Nations has recognised that India has a part to play in this field and has asked our leading nuclear scientist, Dr. Bhabha, to preside over the conference proposed to be held at Geneva. The U.S.S.R. has promised to show how she has been able to set up a nuclear plant producing electric power, but great steps have been taken in this connection also in the U.K., and the recent report on atomic power, placed as a White Paper before the House of Commons, shows that by about 1980 there will be about 12 to 13 stations working in various parts of that country to produce electricity and power for peaceful purposes. This is a great step, and our country will benefit by the steps that are being taken, because our intention is to use atomic power for peaceful purposes."},
  { name: "Transcription No: 101", text: "Mr. Deputy Chairman, there is no dispute in regard to the question that the working journalists had been suffering for long and that they need legal protection in their profession. As they were suffering, Government appointed the Press Commission and as a result of the recommendations of the Press Commission we are here discussing this Bill today to safeguard their interest. Now our aim is to protect them from their employers. This Bill gives them protection under the Industrial Disputes Act. As the operation for so many years of this Act was in the hands of the Labour Department or the Labour Ministry, that department and that Ministry are fully aware how it should be operated as there have been lot of difficulties and lot of differences of opinion between one court in one State and the other court in the other State in regard to one item and one interpretation. The interpretation is required to be incorporated in this Bill, as to what is meant by a 'workman'. The Industrial Disputes Act has given the definition of the term 'workman', but it has been interpreted by different courts in different States in different ways. Now again, we are dealing with two parties, and one party is the employer. In the definition of the 'employer' also, we do not find if we can properly put the directors or the managers as the employers. Now, this Bill has tried to exclude certain staff and certain people doing certain jobs. Sir, the intention of this measure is to safeguard the interests of the working journalists by bringing them under the purview of the Industrial Disputes Act by which they will be provided with certain machinery where they can go for the redress of their grievances. Sir, we must make sure that working journalists may not be defined as 'employers' instead of as 'workmen'. If, as we say here, an employer is one who is employed in a managerial or administrative capacity, there is bound to be difficulty. I will cite an example. Now, a working journalist might get two typists in his office and he may have three peons. He may be actually a supervisor acting on behalf of the Manager also. Now, he is performing two jobs; he himself is working and he is also performing the work entrusted to him by the Manager or the Managing Director. If such a person has got any grievance, he goes to this machinery that is to be appointed under this Bill and he is entitled to get relief. But as he is partially employed as Manager, he may be denied that right. Therefore, I am afraid that whatever we may try to do, we must be very specific in this matter. I think we should say that the working journalist means a person whose principal avocation is that of a journalist, etc. etc., and then they are also termed as workmen under the Industrial Disputes Act. Otherwise, we will be faced with that sort of difficulty, as other trade unions are experiencing in their day-to-day work in the Appellate Tribunal or the Industrial Tribunal or in other courts. I hope that the Minister in charge of this Bill will consult the Labour Minister who is an expert in this matter as to how to safeguard really the interests of these people by putting a proper definition for the working journalists. Now, I have got another point. Really this should have been brought forward by the Labour Department as they have been operating the Industrial Disputes Act. Under the Industrial Disputes Act, we have got some machinery which has got to come into being when there is a dispute. Now, under the existing Industrial Disputes Act the appropriate Government has got to order in writing to this machinery. As the working journalists are spread over throughout the country, I am not clear in my mind whether for the purpose of the working journalists this Industrial Disputes Act will be operated by the Central Government or by the State Governments. Both the Central and the State Governments have their own machinery. From the Chief Labour Commission to the Reconciliation Officer, the Government of India has got a set of machinery throughout the country and again the State Governments have got their own Labour Commissioner and other officers. I want that that also must be specifically provided in this Bill as to whether they have got to go to the Central Government or to the State Governments for the redress of their grievances. Now, the tribunals are not permitted to undertake any case as soon as it is referred by either of the parties unless it is specifically ordered by the appropriate Government. Now, my own opinion is this that for the time being it should be operated by the Labour Ministry of the Central Government. Neither the Information and Broadcasting Ministry nor the State Governments should operate this because it is a new thing incorporated by the Central Government and the Government of India knows what for they are coming forward with this piece of legislation. I want that the Information Ministry should hand over this business to the Labour Ministry which should operate this through its own machinery. Sir, anyone who knows anything of journalism in this country will welcome the protection that this Bill gives to working journalists. There is no doubt that their present lot is a hard one and that it is difficult sometimes even for the best of them to discharge their duties honestly, but the remarks made by my hon. friend make me anxious to understand the scope of the Bill. My hon. friend spoke of the protection given to editors who expressed their views freely even though they may be unpalatable to the proprietors of their papers. Sir, is it really the object of the Bill to make the working journalists to decide the policy of the paper to which they are now attached?"},
  { name: "Transcription No: 102", text: "Madam, I rise to support the Railway Budget presented by Shri George Fernandes for the year 1990-91. Shri George Fernandes has his association with the Railways for the last 40 years as a labour leader. As a labour leader, most of his energy was concentrated in making demands on behalf of the workers of the Railways. Now he has been put in a position to look after the affairs of the Railways as also the well-being of the workers who are working with the Railways. Since he is at the helm of affairs, since he was a labour leader and his words carry weight with the workers, I hope, under his stewardship the workers of the Railways would perform better, would do their jobs better and would see that the Railways perform better. In this way, not only would the Railways satisfy the people who travel, but also the functioning of the Railways in general would improve. The Indian Railways are the biggest network in the whole of Asia and the second largest in the world. Not only the Indian Railways are big in size, but their problems are also big in proportion to their size and the things that the people want the Indian Railways to do for them are also big. Sir, Mr. Fernandes, on the 2nd of February, has come out with a Status Paper wherein he has given the current position of the Indian Railways, the problems that the Indian Railways are facing and also the innumerable demands, including the demand for providing employment on a large scale in the Railways to the unemployed. I hope that in this discussion on the Railway Budget, the participants would offer some constructive, useful and practical suggestions. Mr. George Fernandes when he had to prepare and present this Budget, had very little time to do that probably less than a hundred days. But even within that short period, Sir, he has come out with some new ideas, with a new approach, with regard to the functioning of the Railways. He has laid emphasis in the Budget on modernisation, on energy conservation and on computerisation, wherever it is necessary. Though he has expressed his helplessness in providing more jobs to the unemployed in the Railways, he has tried to generate jobs outside the Railways with the help of the Railways. It may relate to afforestation and things like that. He has extended the computerisation of booking from the present four metropolitan cities to five more cities among which Bangalore is included. Whenever an air accident takes place, the compensation that is paid is very high. What Mr Fernandes has done is that in the case of the railway accident also, he has raised the amount of compensation from the present rate of one lakh rupees to two lakhs of rupees. In accidents, whether it is the rail accident or air accident, the loss of life is the same and any life lost can never be recovered. Another thing that is to be welcomed is that he is going to provide more accommodation and more seats to the Second Class passengers by gradually withdrawing the First Class A.C. coaches and the First Class coaches. I hope while withdrawing these facilities and extending them to the second class passengers, the existing comforts and facilities of the second class would further improve. I hope in all second class carriages, cushion seats are going to be provided. Socialism is not levelling down but socialism is levelling up. When we withdraw facilities from the higher level, the facilities for the lower level should be improved so that the travelling comforts for the lower level improve. Another innovative idea that Shri George Fernandes has thought of amidst the constraint of resources is financing the West Coast railway line which is popularly called the Konkan Railway line. This railway line was initiated when Prof. Madhu Dandavate was the Railway Minister about 12 years ago. Once that Government went out of power, this scheme got put into cold storage. Of course, in the last year's Budget, Shri Madhavrao Scindia had made some provision for construction of the line from Mangalore to Udipi, but the construction work did not start. Now, Shri George Fernandes has come out with a novel idea of associating the States which are going to benefit out of it, viz., Maharashtra, Goa and Karnataka by raising certain contributions from these three States, by raising certain contributions from the public and certain contributions from the Railways as well as from the General Exchequer. If this scheme had not been thought of and if this had not been taken up in the normal course and under the normal procedure, this railway construction would have taken 15 years to complete. Now that a new method of financing this project has been initiated, the Railway Minister has promised that construction of this railway line is going to be completed within five years. I wish that this scheme succeeds; not that it succeeds for the sake of the Konkan Railway, but this would open up a new era for taking up other essential constructions where those projects could not be taken up because of shortage of funds. I hope the Railway Minister who is a person of many ideas, many innovative ideas, would also think in terms of, if possible, self-financing schemes. Every year costs go up. Any project that is done today is cheaper than it would be tomorrow. He, in his Status Paper, has asked whether the money should come from the Central Government or whether it should come from the Railway Finance Corporation or from market borrowings where it is going to cost a little more. In any case, I personally feel that these projects, important projects, should not lag behind on the ground of funds not coming from the Central Government or State Governments. Even if it is costly, the money should be borrowed from the Railway Finance Corporation."},
  { name: "Transcription No: 103", text: "Mr. Deputy Chairman, I think that it will be generally agreed that a Bill of this type is almost unavoidable at the present stage. There may be differences about some measures and also about the extent to which the Government proposes to go. That some fiscal control would be necessary at this stage when we are having development programmes on a very large scale, a good part of which would be financed through deficit financing, will, I hope, be uncontested. I think the fact that in the Second Five Year Plan the greatest emphasis has been placed on heavy industries, especially on the production of certain types of capital goods, lends further force to an argument of this type. I am aware that the Second Five Year Plan has also provided that there will be an expansion in consumption, but I have no doubt that the greater emphasis on capital goods will result in at least a temporary shortage in consumer goods and this may lead to further inflationary pressures. To a certain extent, such pressures have already been felt. The recent rise in prices is a kind of warning of the kind of situation that may develop, unless we are careful from the very beginning. Therefore, I would say that this measure of the Government, in so far as I can understand it, has a two-fold aim—on the one hand, to increase the capacity of the Reserve Bank for creating money by note issue and, on the other hand, to put restrictions on the creation of credit by private banks. The first aim is intended to ensure that the money that is required for the economic development of the country will not be lacking. The second is to see that unregulated creation of credit by private scheduled banks will not create a situation whereby inflationary pressures would become too great. To that extent, everybody would agree that a Bill of this type is unavoidable. I have, however, a few questions to ask of the hon. the Finance Minister, and I have no doubt he will be able to meet the doubts which I have in my mind. My first doubt is whether there is not an undue measure of fear about these inflationary pressures. In the Second Plan, there is an uncovered gap of Rs. 400 crores, and there is also a proposal to have Rs. 1200 crores of deficit financing, and so we may say that deficit financing would be of the order of Rs. 1600 crores, because after all the uncovered portion has to be met somehow or the other. I do not know whether sufficient credit has been taken of a possible adverse trade balance which is bound to develop during the first two or three years of the Second Five Year Plan. We are going to industrialise on a fairly heavy scale, and as we import machinery on a large scale, an adverse balance of trade is bound to develop. This adverse balance of trade will, to a certain extent, act as a check against any inflationary pressures. Then again, there is the question of production of foodgrains and other materials within the country. Our economy is an expanding economy at the moment, and I think that by the end of the first year of the Second Plan or some time during the second year of the Second Plan, many of the measures which were undertaken during the First Plan will start yielding results. Many of the major irrigation projects will give full dividends, and the production of foodgrains in the country is bound to go up. As the production of foodgrains goes up within the country, it will again be a check on inflationary pressures. Also, some of the industries which were established during the First Plan will start yielding results. From this point of view, I would also like the hon. Finance Minister to consider whether the pattern of deficit financing which has been adopted in the Second Five Year Plan is sound or may require some modification. To my mind, it appears that the decision to put the maximum amount of deficit financing in the first year of the Second Five Year Plan is not appropriate. Perhaps, it would be a wiser thing to put the maximum amount in the second year of the Second Five Year Plan because by that time the factors which I have mentioned just now will have come into operation. There will be more production of foodgrains within the country. Some of the results of industrialisation during the First Five Year Plan will begin to be felt and as there will be a larger volume of commodities of every type in the country, a larger dose of deficit financing in the second year of the Second Five Year Plan may prove a more salutary measure than the decision to have the largest dose in the first year. There is another reason why I am a little apprehensive of having the biggest dose of deficit financing in the first year of the Second Five Year Plan. If once the inflationary process starts, if once there is any disturbance in the psychology of the market, the results are difficult to foresee. If, therefore, in the first year of the Second Plan, we proceed a little more cautiously and have the biggest dose in the second year and perhaps a little less in the third, and then start tightening up and reduce the deficit financing, you will have three years, the third, fourth and the fifth of the Second Plan both to watch and to take such remedial measures as may be necessary. This is a suggestion which I would like the hon. Finance Minister to consider. I am mentioning it here because I think it has a definite relevance to the proposal he has made for currency expansion by doing away with the ratio between the gold bullion and the securities."},
  { name: "Transcription No: 358", text: "Sir, this is a very simple measure. On 23rd March, 1950, as the House is aware, there was a Proclamation by the President and accordingly, the President took over the administration of that State, and as the House is also aware, the legislature was dissolved. According to the Constitution, the power of legislation naturally vests in Parliament, unless Parliament delegates that power to the President. Article 357 of the Constitution enables Parliament to confer the powers of legislation on the President and, therefore, this Bill has been brought forward for the purpose of giving to the President the power of making laws for that State. It has been found necessary that this power should be conferred on the President, because there has been considerable congestion of work before both the Houses of Parliament, while so far as the work of legislation before the Kerala Legislature was concerned, there was very heavy work there. In fact, as many as 23 Bills were pending before the Kerala Legislature when it was dissolved. I may point out to the House that there were as many as 16 official Bills and seven non-official Bills. Out of these 16 official Bills, in respect of five, the Select Committee has submitted its Report in the Legislature, in respect of nine Bills, the matter was pending with the Select Committee and the remaining two Bills had been taken up for consideration, but before they became law, the Legislature was dissolved. So far as the non-official Bills were concerned, three Bills were pending with the Select Committee and four Bills had been introduced before the dissolution of the Kerala Legislature. Out of these Bills, there are certain which have to be immediately legislated, because they are of considerable importance. We have received advice that, so far as two Bills are concerned, they are of a very urgent nature and they are the Kerala Irrigation Bill and the Kerala State Aid to Industrial (Amendment) Bill. Both of these have to be attended to immediately. There are also four land reform Bills and the Government of India will have to consider to what extent the provisions of these Bills have to be taken up. Certain rights are to be conferred on certain classes of persons and the sooner these questions are considered, the better. As I already stated, there has been congestion or over-congestion of work before both the Houses of Parliament and when this Bill was drafted, two important considerations were taken into account. So far as President-made laws in States were concerned, what the President had to do was to consult an advisory committee. So far as this committee was concerned, originally, the idea was that the Members ought to be ten from the other House and five from this House, but it was found that hon. Members from Kerala were much more than this number. It was also felt advisable that on this advisory committee, there ought to be Members from other parts of India as well as those Members who would take interest in matters relating to legislation in Kerala. Therefore, the Government accepted an hon. Member's view in the other House and the strength has been increased from 10 to 14 so far as the other House is concerned, and from 5 to 7 so far as this House is concerned. The total number of Members from Kerala in both the Houses is 12 plus 6. It is possible, therefore, to appoint some other Members also, and this power has been given to the Speaker in the other House and to the Chairman in this House. Therefore, you will find that we shall have an advisory committee of 21 hon. Members of both Houses of Parliament, who will be ordinarily consulted, except when the matter is of a very urgent nature, calling upon the President to make a law absolutely immediately. So, barring such instances, which may not be many, ordinarily you will find that the President will consult the advisory committee, before he undertakes the work of making laws for the State. This is one safeguard according to which the wishes of the hon. Members on this committee will be taken into account. Secondly, there is another safeguard that has been introduced. After the President has made the laws, copies of such enactments will have to be placed on the Table of both the Houses of Parliament, and thereafter, it would be open to the Parliament to consider them and suggest any amendments. If, for example, one House suggests certain amendments and then those amendments are accepted by the other House, then naturally it is incumbent on the President to issue another Ordinance, accepting the modifications or the amendments suggested jointly by both the Houses of Parliament. Thus, you will find that though the President is to be armed with legislative powers, these safeguards have been purposely introduced."},
  { name: "Transcription No: 359", text: "Sir, I have very great pleasure in bringing forward this Bill before the House. The creation of an All-India Institute of this nature was first mooted by what is known as the Bhore Committee in their Report. That Committee toured all over India, went into the question of the health services in India, the means that provided those health services, ways of combating the lack of those services and also how best we could maintain high standards of medical education and thereby promote the scientific knowledge of modern medicine in our own land with all the experience and all the clinical material available to us in our own country, in the background of our own country, including the villages, rather than send a few of our students abroad to go in for further post-graduate study. Now, this Institute is going to lay primary emphasis on post-graduate studies. As I have just said, it is said that today, up till now we have had to depend on scholarships, whether Governmental or from abroad, such as the Rockefeller Foundation is good enough to give us, to send a few chosen representatives of the medical profession to outside countries to get their post-graduate studies in the various limbs of the medical profession. I have always felt that it would be even much better for us if we could give the same knowledge as these young men and women acquire by going abroad in our own country. Further, if we have an Institute of this nature, we shall thereby be able to control the standard of education; we shall be even able to make changes in the curriculum of our medical education and thereby give not only to this country but also, through our country, to the world, something different, something that we from our rare experiences will be able to find as we go along this exploratory path of progress. As I have often said, it has been one of my cherished dreams that an Institute of this nature should come into being and that through it we may be able to serve our own people better, especially the people who live in our villages. Our educational institutions have up till now been always located in the cities. This is also being located in Delhi, you may say a city, but we are going to have village hospitals. When I refer to medical education, I refer to modern medical education. At the very outset, I would like to say that perhaps there might be a little confusion in the minds of some Members of this House, as there certainly was in the minds of the Members of the Lok Sabha, that because this Institute is called the All India Institute of Medical Sciences, it should also include sciences other than modern medicine. I have to say that if I had not been given a very large sum of money, a million and a quarter pounds, by the New Zealand Government under the Colombo Plan, to start an Institute of modern medicine, I should probably never have been able to get our Government to give me that amount of money to start with. This is not a new scheme. It has been before both Houses because money for it has been budgeted over the last four years. There have been some delays in starting it but there was no question ever of this Institute being anything except one for developing sciences which are allied to modern medicine. Now, modern medicine includes ever so many sciences which, with the dynamic progress which this science makes, are increasing in number every day. I go further and say that what modern medicine constitutes today, is the sum total of all the knowledge gleaned through all the long years lived on this earth, as far as we can know, and just as I have no doubt that in the old days the Arab world called their science Unani, that is to say, they took it from Greece and probably ancient Greece and ancient India had contacts too. I have no doubt either that modern medicine in the initial stages took a great deal from Ayurveda or that science of life as propounded by our ancients. But there is no doubt also that Ayurveda remained static. We should do all in our power now to revive Ayurveda and through Ayurveda give what it has to give to enrich the broad stream of modern medicine, which we have accepted as the basic means of giving relief to our people in this country. We cannot in this one vital science go backward or remain static or say that we will not progress with the rest of the world. Even when we were discussing the Red Cross Bill one Member said that it was too modern, it was too Western. But surely in the world in which we live, we must take everything that is good from every part of the world. We cannot live to ourselves."},
  { name: "Transcription No: 360", text: "Sir, almost all the newspapers in the country have spoken rather strongly against the reckless imposition of sales tax. But we find that the Government have not paid any heed to the criticism made against the sales tax. On the contrary, the Government have been issuing circular after circular calling upon the State Governments to raise additional money by taxation, especially by imposing the sales tax. Now, as you know, even in the meeting of the National Development Council, which was held sometime back, the State Chief Ministers pointed out that they were not in a position to raise more than Rs. 300 crores by way of taxation, while the Central Government demanded that they should raise Rs. 225 crores by way of additional taxation in their respective States, leaving aside the Central taxes. Almost all the Chief Ministers objected to this proposal, and they said that their capacity, as far as taxation was concerned in their States, had reached the saturation point, and that it would not be possible for them at all to go beyond the limit of Rs. 300 crores. We thought that these opinions of the State Chief Ministers would be seriously taken into account by the Government, but they have not done so. And we are extremely disappointed to find in the Second Five Year Plan, to which I shall come later, that out of the amount of Rs. 400 crores representing the uncovered gap, they want to raise Rs. 300 crores by way of taxation, and I have not the slightest doubt in my mind that there will be a greater pressure on the States to impose taxes on various things. Now, as you know, the States are not in a position to impose any income tax. That is beyond their jurisdiction. They can only impose certain other types of taxes, for example, the sales tax and so on. In fact, sales tax is the real thing as far as the States are concerned. Therefore, if the Central Government makes more and more demands on the States to find additional finances by way of taxation, it inevitably means, in the circumstances, that the States will be going in more and more for imposing the sales tax. Now, the Central Government is likely to come into the picture for imposing sales tax. Sir, you might feel that since one Party is in power, probably they will not be at cross purposes. But that is not going to be so, because the State Governments are confronted with their own problems. They are nearer, as far as the people are concerned. We live in this secluded chamber away from the people, away from the masses, and well-guarded and well-protected by all the powers of the Government. But it is difficult for the States to avoid mass demonstrations in and around the Assembly House. Such things happen, and the State Ministers, since they live near the people, are more bothered about the demands and the developments in their respective areas than the Central Government. And naturally, they will hesitate to impose such taxes as cause discontent among the people, and such taxes which made it difficult for the MLAs to go about in the villages or in the towns. We have seen how during the last two or three years, the State Governments have not been very enthusiastic about imposing sales tax, despite pressure from the Central Government. Not that they are at all opposed to it. They do impose taxes, but they find it difficult to do it because of very strong, healthy and vehement opposition on the part of the public in their respective States. I understand that when Governments take this power, they will take advantage of it in order to initiate sales tax on such commodities as enter inter-State trade and thus obviate the difficulty which might very legitimately stand in the way of the State Governments. I would like to know something about it. I hope the hon. Minister has got my point. We would like to know from him whether they will impose any sales tax, after they have got these powers, even when the Governments and the people of the States oppose the imposition of such taxes. This is something we would like to know from the Government. The Central Government has the prime responsibility for executing the Plan. From this Report of the Planning Commission, we know that, apart from the expenditure which will be met by the States, the responsibility rests chiefly with the Central Government. All the financial powers are concentrated in the hands of the Central Government, and it is, therefore, the duty of the Central Government to find money, not in this manner by encroaching on the powers of the States, by curtailing their powers, by imposing taxes like the sales tax, but from other sources such as income tax, corporate tax, and so on. They can impose these taxes."},
  { name: "Transcription No: 361", text: "Sir, I move this Bill with a feeling of hope and expectation, for I am confident that for the successful development of agriculture, ancillary and supplementary conditions envisaged in this Bill are indispensable. Just as in the case of industry, finance and marketing are two essential conditions, so also in the case of agriculture, finance and proper marketing are equally essential conditions. You can put up the latest factory and provide the best personnel, but if there is no arrangement for finance and for marketing, that factory will not work. Sometimes, I am amazed how the agriculturist, sandwiched as he has been between the usurious and fleecing money-lender and the greedy and profit-minded trader, has been able to survive above to live. A lot of thinking has been given to the question of providing finance for agriculture. Some thought has also been given to the problem of marketing of agricultural produce. But I do not know of any report or of any literature in the long history of the cooperative movement which has dealt with this problem in a comprehensive and integrated manner as the Rural Credit Survey has done. One of the main defects from which the cooperative movement in India has suffered is that it has mainly concentrated itself on the credit side of the problem. It has been confined to the better class of farmers. The medium and the small farmer has been left out of the ambit of the cooperative movement. The Government too has not taken the interest that was necessary for the development of this movement. The result has been that the cooperative movement today contributes an infinitesimally small part only of the short-term, medium-term and long-term credit needed by the agriculturist. I am thankful to the Rural Credit Survey which has surveyed the problem in a very comprehensive manner and given us, as I said, an integrated scheme. The scheme envisaged by the Rural Credit Survey falls into two parts, the financial or rather the credit side of co-operation and the economic side of co-operation. So far as the credit side is concerned, the formulation of the scheme and its implementation has been entrusted to the Reserve Bank of India. The Reserve Bank Act laid the responsibility of developing rural credit upon that institution and it was appropriate that that responsibility should be placed upon the Reserve Bank. Before I come to the particular subject with which this Bill deals, I would like to give a background of what the Reserve Bank proposes to do because it is only in that background that a very proper appreciation of the provisions of this Bill can be done. At the base, it is proposed or rather it has been decided to set up what are known as large-sized cooperative societies. These large-sized cooperative societies will cover from five to ten villages according to the conditions of the different regions. For these five or ten villages, as I said, a large-sized cooperative society will be set up which will deal with multifarious activities concerning the farmer. Ordinarily, the share capital of a large-sized cooperative society will be Rs. 20,000. The Government will contribute 50 per cent of this capital, but if the farmers of the region failed to contribute the remaining 50 per cent, the Government will make up the shortfall. The idea is not that the Government should remain permanently a partner in the share capital but as soon as the farmers are in a position to provide adequate finance, the capital invested by the Government will be retired because I am fully conscious of the fact that the cooperative movement in order to be successful in the true sense must be owned and run by the farmer himself. This society will also provide commodities which the farmer needs for his productive and consumption purposes, such as seeds, fertilisers, agricultural implements, kerosene, cloth, etc. It will maintain a storehouse. Hitherto, the cooperative societies used to advance capital to the farmer either on the security of land or on production of one or more sureties. The result was that only substantial farmers or those who had credit in the financial world could avail of that credit. The medium farmer and the small farmer, who in many cases had only a precarious right in land could not benefit out of it. Sir, it is a well-known fact that the medium and small farmers constitute about 75 per cent of the total farmers in India, and any scheme which is not calculated to benefit the 75 per cent of the mass of farmers, I submit, is a highly defective and incomplete scheme. It is proposed that in future credit will be advanced not on the security of land or on the production of sureties but on the security of the prospective crop, so that even the smallest agriculturist owning an acre or half an acre can get some money to finance his productive operations."},
  { name: "Transcription No: 362", text: "Another equally important thing is about the division of the personnel of the services. In this matter, the States Reorganisation Commission recommended that there should be uniform pay scales in all States. For that purpose they said, when the State of Madhya Pradesh or Karnataka was created or formed, there should be uniform pay scales for all these services, whether they belonged to the old Mysore cadre or to the Bombay cadre or Hyderabad cadre. From the Bill, I don't find any such attempt being made. It is true that to raise the scales of pay in Mysore means additional expenditure to be incurred from the State funds. But can we defer or postpone it or avoid it? I think we cannot. It is absolutely necessary to strengthen our administration and one way of strengthening the administration is to have a uniform scale of pay for all the services from whichever area they might come. Otherwise, what will happen is there will be one scale for the persons who might come from Bombay, another for those coming from Madras, another for those coming from Hyderabad, while those from Mysore will have their own scale of pay. This is bound to create a lot of confusion and in this context I am sorry some political leaders in Mysore made the mistake of making a statement that they did not want the services from other areas and if they came, they must come at their own risk. I don't know whether that statement was made after consideration. I hope it is not. Had they merely looked into clause 100(a) of the draft Bill, that statement would never have come to be made. You know under clause 100(a) of the draft Bill, the entire cadre of all the previous States and present Bombay and Madhya Pradesh States stand dissolved and a new cadre is being formed by the Central Government. That being so, I don't know how you can say that you are merely allowing somebody else to come. This has created a lot of bitterness and a number of people have complained about it. The services in other areas are quite shy of coming to the new State and it will not be in our interest to keep back any service if it is an efficient one. It might be necessary to put in more specific provisions. We are going to have the elections very soon. If we want to successfully manage the elections, we must have an efficient administrative machinery at the Secretariat level as well as at the district level and that would be constituted long before the election takes place. We have hardly a few months before us and it would be absolutely necessary for the Home Ministry to give its attention to this matter and constitute the new services as early as possible. I hope the Home Ministry would give its best attention to this matter. This would also be necessary in connection with the working out of the Second Five Year Plan. A disgruntled or disorganised civil service will not assist you in implementing the Second Plan. I would like to say a few words about the division of assets and liabilities. You remember that Mr. Wanchoo's report some specific recommendations have been made. Mr. Wanchoo recommended, so far as the movable properties are concerned, a certain formula and that was accepted in the Andhra Bill. As regards immovable properties, it laid down that such immovable properties and buildings located in places which are in the districts will not be taken into consideration as they are mere concomitants but such Government buildings which are existing in the headquarters like Madras will be taken into consideration. They will be valued on the basis of the formula that those buildings which have been built prior to 1960 will be valued at double the book value and those that have been put up after 1960 would be valued according to the book value. This is a very reasonable suggestion. It is on that basis that the buildings in Madras were valued at nearly Rs. 7 crores and odd. But Andhra, which was entitled to 36 per cent of the same, was given about Rs. 3 crores under Section 9 of the Andhra Act. Unfortunately, when we come to the States Reorganisation Bill, none of these provisions are there. There is no provision for assessing the value of the buildings in big cities like Bombay, Madras, Hyderabad, Delhi and other areas. What is going to happen? Mighty buildings have been put up in those places at the cost of the entire State and every part of the State contributed for them. Huge engineering colleges for the benefit of the entire State were built up. They are not in a position to make a gift. Another curious thing that happened is that in the Wanchoo Report, it has been said that they must be valued."},
  { name: "Transcription No: 363", text: "Mr. Chairman, the other day when the House adjourned, I was trying to prove that even qualitatively the progress of the co-operative movement had not been satisfactory. Only primary credit societies have increased in number and size as compared to the other types of societies which actually contribute to the development of agriculture. Even the loan advanced by these primary credit societies is not being utilised for the purpose of development of agriculture, but, instead, it is being utilised in many cases for paying off the old debts and for their day-to-day expenditure, because many of the peasants are so poor and so indebted that the credit given by these credit societies, which is meant for the development of agriculture, is being utilised for other purposes. Madam, when we take into consideration the total amount of credits given by these credit societies and try to analyse the different strata of people who get the greatest advantage of all these credits, it will be realised that the upper strata of society are getting the greater share of the credits advanced by these societies. Now, when we take into consideration the classification of all these societies which gives an insight into the development or the improvement of all these societies, it will be realised that only 15 per cent of the total number of societies are classified under A and B class. That means that only 15 per cent of the societies are sound and are able to stand on their own legs without the help of the Government or whatever it might be. This has been stated by the Estimates Committee as well. So, the remaining 85 per cent of the societies are not functioning satisfactorily at all. 40,000 societies were revitalised in the Second Plan, and last year over 15,000 societies were said to have been revitalised. So, it means that nearly 40,000 societies in the past five years were not able to function properly and were about to be liquidated, and so the Government and the co-operative movement had to go and help them and revitalise them. But even after spending a lot for the revitalisation of the societies we do not know whether all these societies, which were dormant, are active again. When we take into consideration 15,000 societies, it will prove that the co-operative societies have not improved their position. Madam, this Bill intends to set up a Corporation in place of the existing Board. We are told that this Corporation will continue to perform the same function as the old Board. We are told that the Board has been working very well and has been responsible for the development of the co-operative movement all these years. If this is so, I cannot understand the necessity for setting up a Corporation different from the Board. If the functioning of the Board has been satisfactory, what is the necessity for forming a Corporation? What are the other advantages that we are having in forming a Corporation? We could gather from the Annual Report on the Corporation issued by the Ministry of Community Development and the speech of the Deputy Minister that the Board has been only an advancing agency for the respective States. Of course, they have set up three or four committees to go into the question of the various aspects of the co-operative movement. I think this job can be done by the Ministry itself. Now, coming to the composition of this Corporation and of the Executive Committee as it is envisaged in the Bill, it is evident that it is practically riddled with Government officials. There is only a sprinkling of non-official representation. I can understand the constitution of the Board as it is done by the Ministry of Food and Agriculture. We know the views with regard to democratisation, of the Minister of Food and Agriculture. But I cannot understand how the Minister of Community Development who lays great stress on, and gives importance to, democratisation can copy the same old method that was there with regard to the composition of the old Board and incorporate it in the new legislation, practically going back on his own recommendations that the co-operative movement must be representative of, or carried on by, non-official bodies. It is relevant at this time to point out that the Prime Minister himself has pointed out that the co-operative movement must be actually carried on by non-official bodies and that official interference must be the least. But when we take into consideration the composition of the Corporation and the Executive Committee, non-official representation is practically negligible. So, all these factors have to be taken into consideration. Again, before the Bill was brought forward before the House, the Government should have taken advantage to liberalise certain regulations, taking into account the past experience and impediments in the growth of the co-operative movement. The Government have tried to make this legislation more conducive to the development of the co-operative movement."},
  { name: "Transcription No: 364", text: "Mr. Deputy Chairman, I would like to welcome the Bill which has been introduced by our eminent leader, Shri Pant, who has suggested that it should go to a Joint Select Committee. I would particularly like to welcome the proposals regarding the removal of the ban on practice by High Court Judges after retirement. The present position is that there is an absolute ban on their practice and the result is that courts are finding it increasingly difficult to get a suitable class of lawyers to accept seats on the Benches of the Courts. It is necessary, it is vital for the preservation of democracy in this country, for the preservation of human freedom and for the protection of the average citizen in this country that our High Courts should continue to have the confidence, the respect and the esteem of the people. But if, as a result of existing provisions, the quality of our Courts goes down, the quality of our democracy will suffer. It is a tribute to the patriotism of our Bars that so far there has been no deterioration in the quality of our recruitment to the Bench. Members of the Bar who are enjoying good practice have considered it, in most cases, a patriotic duty to accept a judgeship when that has been offered to them. But after all a man has to think of his future and the position is that a member of the Bar, when he is offered a judgeship does not know what he will have to do with himself after he attains the age of sixty two. It is demoralising to see retired High Court Judges seeking re-employment after their retirement. The foundation of judicial independence in England, or in any other democratic country for that matter, is the life tenure of Judges. It is not suggested that we can have a life tenure in this country. It may be that there was a case for a higher age limit when the Constitution was being framed. But we know that as people age quickly in our country, it will not be possible to have a life tenure. The foundation of the independence of the judiciary is that once a Judge is appointed in Britain, he does not get any increment in his salary even when he is promoted to a court of appeal. He does not get any financial preferment. Now, I should like to say a few words about the provisions regarding additional or temporary Judges. The present provisions regarding ad hoc Judges are very unsatisfactory. Our Courts are in huge arrears. In the court with which I was associated for more than seven years we had, I believe, over 25,000 cases in arrear. Now, these arrears are largely a legacy of the past, and I can tell you that, with all the speed that Judges may possess, it is not possible for them with the existing number of Judges to cope with the amount of work in our Courts. Criminal work has increased, writ work has increased. Other classes of work have also increased. It is necessary to have additional Judges for the disposal of arrears. These arrears, I hope, represent a temporary situation, but I cannot be sure of this. I do not think they represent a permanent phenomenon. Once these arrears have been cleared off, it will be possible for us to fix or to determine the permanent strength of our Courts with some degree of assurance. I am, therefore, glad that advantage is being taken now that the Constitution is being amended to provide for the appointment of additional Judges. There were some legal doubts about what an ad hoc Judge could or could not do and it was, therefore, necessary that provisions for additional Judges should be included in the amending Bill. I hope that in appointing additional Judges, care will be taken to appoint members of the Bar who are not likely to revert to the profession after their term as an additional Judge is over. That is to say, appoint a man whom you are going to appoint as a permanent man in the initial instance, if you like, as an additional Judge and then confirm him as a permanent Judge, when the permanent vacancy occurs. Another suitable class of persons to be appointed as additional Judges are our district Judges. If you want a district Judge to become ultimately a permanent Judge of the High Court, you may appoint him in the initial instance as an additional Judge or as a temporary Judge. You can also invite retired High Court Judges for definite periods to act as additional Judges. Particularly, this should be the case when a Judge goes on temporary leave or on leave for a few months, for in that case, it may not be desirable to appoint a member of the Bar to act in his vacancy. Because after the Judge comes back to the Bar, he gets possible advantage which his colleagues do not possess."},
  { name: "Transcription No: 365", text: "Mr. Deputy Speaker, Sir, I thank you for giving me time to speak even at this late hour. I am supporting the Demands of the Ministry of Food and Civil Supplies. This Ministry has the responsibility to provide food to the people all over the country and I am happy to say that it is discharging this responsibility efficiently. The public distribution system has a great role to play in controlling the prices of essential commodities. This is one of the important items in the Prime Minister's Twenty Point Programme. It is the duty of the Government to provide food at fair prices to the poor people and the policy of the Government is to open fair price shops in all nooks and corners of the country. I find that the number of fair price shops has steadily gone up over a period of time. For example, in nineteen seventy nine we had three lakh fair price shops which have increased to four lakhs in nineteen eighty seven. Seventy eight per cent of these shops are in the rural areas which shows the Government's concern about the people in the rural areas. But, in this context, I want to draw the attention of the Government to the complaints that many things are not available in the fair price shops in the rural areas. Therefore, the Government must monitor the distribution of the foodgrains which it supplies. Another point I want to make in this connection is that the Government should increase the number of items distributed through the fair price shops. For example, pulses are very essential for a nutritious diet. Therefore, pulses should also be distributed through fair price shops. The Central Government has a scheme to provide financial assistance to the Civil Supplies Corporation in North Eastern States, Sikkim, Jammu and Kashmir, Himachal Pradesh, etc., for the construction of godowns. There was a demand from Kerala for similar aid. But it has not been considered. Therefore, I would request the hon. Minister to consider favourably the request from the Kerala Civil Supplies Corporation for assistance to construct godowns in the State. It is one of the most important duties of the Department of Food and Civil Supplies to control the prices of essential commodities. I must say in this context that there has been very heavy price rise in respect of fruits and vegetables throughout the country. The Government must make adequate arrangements to sell fruits and vegetables through consumer shops and other outlets. This problem is very acute in cities. Taking advantage of cold storage facilities, the big wholesalers store these items and retain them, bit by bit, into the market and make huge profit. There is a monitoring cell in the Civil Supplies Department, but more effective steps will have to be taken to control the prices. Now, I come to some of the problems of my State, Kerala. The distribution of rice and palm oil is not being done properly in the State. This is causing a lot of problems to the public. This only shows that the State Government is not managing the distribution properly. It is not enough that they get supplies, fair distribution has also to be ensured. That is the duty of the State Government which is not being discharged by that Government. However, I take this opportunity to demand that Kerala should be given two lakh tonnes of rice and ten thousand tonnes of palm oil per month and adequate quantity of kerosene and sugar should also be supplied. I would also request the Government to see whether the foodgrains and other items supplied by the Centre are being distributed properly. There is a tendency in the present Left Front Government in Kerala to mismanage the distribution and put the blame on the Centre. So, the Central Government should be very vigilant about it. Similarly, under the present practice, fifty per cent of the ration is subsidised by the Centre. I have a suggestion to make in this regard. This subsidised ration should be supplied to them at a time. Otherwise, they are not in a position to buy it and the shopkeeper will take all the benefits of the subsidy. The public distribution system in Kerala has been widely acclaimed. But the State Government is not doing anything to strengthen it. This is evident from the fact that the State Government has made only a very small token provision in the Budget for the public distribution system. This is a politically motivated step because if the public distribution system fails, they can always put the blame on the Centre. I would, therefore, request the Centre to meet fully the requirements of Kerala for foodgrains and other essential commodities like kerosene and edible oil and strengthen the public distribution system in that State. I would also request the hon. Minister for Food and Civil Supplies to take steps to monitor the distribution effectively. I once again support the Demands of the Ministry of Food and Civil Supplies, and with these words I conclude."}

const list = document.getElementById('mattersList');
const searchInput = document.getElementById('kcSearch');

function renderMatters(query = '') {
  const search = query.trim().toLowerCase();
  list.replaceChildren();

  KC_MATTERS.forEach((matter) => {
    if (search && !matter.name.toLowerCase().includes(search)) return;

    const btn = document.createElement('button');
    btn.className = 'matter-item';
    btn.textContent = matter.name;
    btn.onclick = () => selectMatter(matter.text, matter.name);
    list.appendChild(btn);
  });
}

searchInput.addEventListener('input', () => renderMatters(searchInput.value));
renderMatters();

// Apply dark mode if on
if(localStorage.getItem("darkMode")==="on") document.body.classList.add("dark");
</script>
