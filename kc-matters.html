s than those in the world. The aeroplane up to date is the rich man's means of conveyance. Why cannot air fares be raised rather than railway fares? Sir, I may be pardoned for saying so in this House."},
  { name: "Transcription No: 150", text: "Sir, I am mostly in agreement with almost all the principles that the hon. Prime Minister has enunciated this morning, and yet, I beg to submit that from the point of view of logic, I do not arrive at the same conclusion as the Prime Minister has done. I may say, at the outset, that the continued association of my country with the Commonwealth is not justified. The hon. Prime Minister said that it is very easy to destroy a thing, but it is very difficult to build. I agree that the work of an artist who creates something is difficult and it takes a long time to build a thing, but it is much easier to destroy it. This world of ours is not being created now. It is not something new which is being just brought out. It is in existence with all its faults and good points and like who is not creating a new thing but who is taking the buildings as they exist and then harmonising them by trying to join them together, and in that task it sometimes becomes necessary to alter certain things here and there, and sometimes even to destroy a small portion. Similarly, in the small world of ours, when in the interest of a greater harmony, to build a world with possibly a World Government, with freedom for all and with chances of development to every nation to the fullest extent, it is possible that some of the old associations may have to be severed. The British Commonwealth started as a British Empire. It had a purpose in this world. Whether it was a colonial purpose or some other purpose, it came into existence with a certain set purpose. And then, as the world went on changing, the British Empire also went on changing. Then it was the British Commonwealth and, lastly, that word 'British' was dropped. The hon. Prime Minister said that the United States of America has a closer relationship with the Commonwealth than even India. I support the hon. Prime Minister's statement and that is just the reason and just the argument in my favour. If the United States, without being in the Commonwealth, can have as great an association with it, or even greater association with it than we have, then, Sir, our country, India, remaining outside the Commonwealth, can also continue the same association. Sir, the hon. Prime Minister was vehemently against the S.E.A.T.O. and Baghdad Pact and all those things that he thought were against the spirit of the United Nations. He said that the nations can have regional associations. Sir, you will realise that the Commonwealth is not a region. Australia, India, Canada and the United Kingdom are so far apart geographically that nobody in his imagination can consider them to be a compact area where there may be some sort of an understanding or co-operation. We are aiming at peace and for the attainment of that peace, we have a world organisation, the United Nations. Do you think that the formation of packs or groups or associations helps in the development, better organisation and control of the United Nations? On the other hand, these petty associations, packs, pacts and treaties retard the influence of the United Nations, defeat the whole purpose of the United Nations. I submit that these associations are a step in the wrong direction. Sir, I come to a few mundane matters. We have our trade relations largely with the United Kingdom. If you see the structure of our import and export trade, you will find that a large part of export goes to the United Kingdom and a large part of our imports comes from the United Kingdom. We are giving some sort of a preferential duty. That preferential duty creates problems for us. Commercially, we find that the cost of production in the United Kingdom has gone up much higher than in any other country. If it is a question of import of machinery, we find that other nations are able to offer us better terms. If it is a matter of our export trade, we find that other nations are able to offer us better prices. This link with the Commonwealth was linked up with the Sterling. Sir, you know that in nineteen fifty-eight the Sterling was worth about five dollars. Then, the Sterling was devalued to two dollars and eighty cents. The value of the pound came down by nearly forty per cent. We had to devalue our currency because we were linked up with the Sterling currency. If it had not been linked up with the Sterling, it would have had to be appreciated by forty per cent. Thus perforce, we had to rearrange our entire fiscal policy in this way."},
  { name: "Transcription No: 266", text: "Hon. Members would recall that I had stated in my Budget Speech that the credit institutions will have the freedom to pass on the burden of interest tax to the borrowers by adjusting suitably the rate of interest. It has been brought to my notice that in many cases where term loans have already been sanctioned, the credit institutions may be able to vary the rate of interest because loan agreements do not contain a provision permitting such variation. I propose to move an amendment to the Bill to provide overriding legal authority to the institutions to vary the rate of interest, if they so desire, in order to pass on the burden of interest tax to the borrowers. Further, I also propose to exempt from the imposition of interest tax cooperative land mortgage banks, cooperative land development banks and cooperative societies engaged in the business of banking which cater primarily to the needs of farmers and village artisans. My proposal to extend the coverage of the expenditure tax to the expenditure incurred in restaurants providing superior facilities like air-conditioning has been generally welcomed because these restaurants are patronised by the affluent sections of the society. It has, however, been pointed out that the criteria for identification of restaurants, expenditure in which would come within the purview of the proposed tax, is cumbersome in the form in which it is contained in the Bill. I, therefore, propose to modify it and adopt a single criterion, which will be that the restaurant is air-conditioned. I will be moving necessary amendment to the Bill for this purpose. I propose to make some modifications to the proposals in the Bill relating to deduction of tax at source from certain payments. The requirement to deduct tax from interest on bank deposits will apply only to interest on term deposits other than recurring deposits. Further, cooperative land mortgage banks, cooperative land development banks, primary agricultural credit societies and primary credit societies will be taken out of the purview of this requirement. We would thus exclude from the ambit of tax deduction at source most of the depositors from rural areas. Further, I am sure that these modifications will ensure that the small taxpayers are not put to any harassment as a result of the proposed requirement of deduction of tax at source from bank interest and withdrawals from the National Savings Scheme. Hon. Members may be aware that under an existing provision in Section 197A of the Income-Tax Act, individuals not having any tax liability can obtain payments without deduction of tax at source by furnishing a declaration in writing in duplicate in the prescribed form. I am directing the Income-Tax Department to give wide publicity to this provision and make the requisite forms available at the bank counters. It has been brought to my notice that the proposed requirement of deducting tax at source from winnings from races and payment of commission on sale of lottery tickets would impose an onerous burden on persons responsible for paying these amounts. With a view to mitigating this hardship, I propose to provide for a threshold limit of Rs. 2,500 for deducting tax at source from winnings from horse races. Tax will be deducted at source on commission etc., on sale of lottery tickets only if the payment at any time exceeds Rs. 1,000. I also propose to make a clarificatory amendment to Section 32 of the Income-Tax Act relating to deduction for depreciation in computing business profits for tax purposes. Under the proposed amendment, no depreciation will be allowed in respect of any plant and machinery the cost of which gets amortised, in one or more years, under any other provision of the Income-Tax Act. The Bill contains a proposal to amend Section 273A of the Income-Tax Act and Section 18B of the Wealth-tax Act to provide one more opportunity for disclosing unaccounted income and wealth. Hon. Members would agree that this facility should not be open-ended. I, therefore, propose to provide that it will be available only up to 31st March 2002. The Bill contains a proposal under which the discretion of the Income-Tax authorities to entertain application for registration of charitable or religious trusts and institutions will be restricted to three years from the creation of trust or establishment of the institution. It has been pointed out that this proposal may prove to be harsh, particularly for trusts and institutions in remote areas who might not be fully informed about the intricacies of tax laws and procedures. I, therefore, propose to provide that a trust or an institution may apply for registration at any time. However, an application made after the expiry of one year from the date of its creation or establishment will relate back to the date of such creation or establishment only if the delay beyond the initial one year is for valid reasons."},
  { name: "Transcription No: 267", text: "At the outset I would like to say that the Government and the members of the Cabinet the honourable Finance Minister myself and the Prime Minister have spent several sleepless nights on this problem almost from the time when we took over in 1992. Shri C. Rajgopalachari who was then the Chief Minister of Madras had brought this problem to the attention of the Government of India. It was he who suggested that as a short cut to solving the problem of the handloom industry the area of reservation might be increased and sarees and dhoties might be reserved for handlooms. He was impelled to do that because of the intense suffering of the handloom weavers in South India. The Madras State as it then was retained the largest number of handloom weavers. There is no point in our saying today that millions of families are suffering or in our evaluating them in terms of numbers for the reason that our statistics are all wrong. But there is no denying that the quantum of human beings dependent on the handloom industry is a very appreciable number. It does not matter whether the total number of handlooms is 28 lakhs or 16 lakhs in 2002. So we need not quarrel about the numbers affected. If there are sixteen lakhs of looms and there are eighty lakhs of people starving there are a number of people who starve because of these unfortunate weavers not getting any work and all that follows is no income no food starvation and the misery multiplies. It is essentially a human problem it is not so much an economic problem and we have been approaching this problem from the human angle. It is no question of there being any dispute in regard to what should be done for our unfortunate countrymen who are dependent for their sustenance on a particular type of living on a particular type of economic activity which basically is unstable. But somehow or other it is the responsibility of every citizen of this country and of the Government which the citizens have placed into power to see that that misery is relieved. All the disputes that we had amongst ourselves Mr. Rajgopalachari and the members of the Central Cabinet have been in regard to the methods that have to be adopted whether an outright reservation would help Madras. In point of fact it would not have helped Tamil Nadu because of various circumstances and the priorities of movement which is an obligation that is laid on me as Commerce and Industry Minister. We were able to indicate to the Railway Administration that since the dhoties and sarees were available in plenty in South India the priority need not be given for mill made dhoties and sarees from Bombay and Ahmedabad. It must be conceded that the reservation artificially effected by means of utilization or a correct utilization of priorities has given Tamil Nadu an advantage far above the reservation that we have achieved by laying an embargo on mills that they should not produce more than 60 percent of dhoties they produced in the past. So the picture is not all the same everywhere. What is good for Tamil Nadu is not good for U.P. Bihar West Bengal Orissa Rajasthan and Punjab. The net result of our restricting production of dhoties by mills in the initial stages had resulted in the prices of dhoties going up because in many areas the handloom industry did not produce dhoties. Actually before 1950 U.P. had no looms producing wide width dhoties and sarees and it was in 1950 that the U.P. Government financed about ten looms for producing wide width dhoti and sarees because they were in short supply in 1950. It would not be right for the honourable Members to say in these circumstances that all that we have done is an eye wash that we are cheating somebody that the mills are cheating us and that we are cheating the Members of Parliament and the public. Maybe some cheating does take place. After all if cheating does not take place there will not be Section 420 in the I.P.C. That is why we have provision in the Penal Code. Sir the position today in regard to the handlooms all over has slightly changed. I must say this that I am not really boasting. I am only doing my duty what is my duty as a Member of the Cabinet which has been put in power by the Congress Party that if there is any item in the hundreds of items which the Commerce and Industry Ministry is responsible for to which I devote personal attention I should say it is the handloom industry. Sir my honourable colleague knows we have hardly any difference of opinion. I and my colleague the Finance Minister have hardly any difference of opinion in any matter."},
  { name: "Transcription No: 268", text: "When I move this resolution I am aware that it will not be received kindly by certain sections of the House. We have heard arguments for rationalisation from interested people and we have heard statements from the spokesmen of Government. Nevertheless I am happy that this House has today an occasion to discuss this problem. I am sure that if the Labour Minister is going to speak he will admit that this is the most burning problem agitating the mind of the working classes in India. From everywhere you hear the cry. In fact after this motion was accepted and news came in the papers hundreds of telegrams have been received by me. Most surprisingly of all was not only the workers engaged in the jute and other mill industries but also the workers from many other sectors including agriculture are writing to me. I have got a number of those letters here. From Kerala I get letters from agricultural workers who are thrown out of employment by the on coming of tractors for which we have got a Central organisation and about which our Government seem to be so happy. Here I have got a letter from an employee of a bank in Mumbai the Bank of India. He says that 40 temporary employees of that Bank are going to be thrown out because some mechanical device is about to be introduced. So this is a question which should be very carefully considered by this House with all the seriousness which it deserves. We are not prepared to discuss rationalisation in abstract. Gentlemen who know much about it may do well not to waste their time in telling us about the advantages of modernisation and development of machinery and all that. They are all well known. We are discussing a concrete problem in a concrete situation. Now let us turn for a moment to the textile industry the largest industry occupying an important position even on a world scale an industry for which our people have fought with sweat and tears against the British. It employs nearly 7 1/2 lakhs of workers. In this industry rationalisation is being introduced or is proposed to be introduced in all the centres. Nobody will say that this is done in the interest of production because only last year we heard cries of over production raised even in this House. Textile is one of the few sectors where the targets laid down in the Five Year Plan have been exceeded. Its problem therefore was not one of fall in production but of over production. And in 2003 we saw the picture of total or partial closure of mills. At that time our Government of course standing between the capitalists and the workers did not remain quiet. They immediately responded to the complaints of the capitalists. Concessions were freely granted the export duty on cloth was reduced and the excise duty on medium and coarse cloth was raised hitting the vast majority of the consumers. But to the Government that is a minor matter. Neither the mill owners nor the Government thought of the consumer then. Both now speak for rationalisation in the name of the ordinary consumer. The mill owners do not want more profit. That is not at all the objective. The problem before the textile industry as made out is not one of fall in production but over production. Now let us come to the attitude of the Government with regard to this. Statements have appeared from Government spokesmen from time to time purporting to protect the interests of the workers prevent unemployment etc. For example in February last the Minister of Labour told pressmen in Calcutta that Government would not allow any rationalisation or mechanisation which would result in retrenchment. He said the Planning Commission had formulated schemes in this respect and there was no idea of improvement which would result in the retrenchment of even a single worker. But the Labour Minister of Uttar Pradesh speaking to pressmen in Lucknow said that there was nothing like a Government rationalisation scheme. He said that the employers had prepared a scheme and the Government’s efforts were to see that a formula agreeable to both labour and employers should be worked out. So he takes it for granted that rationalisation is bound to come into effect whether the worker is going to be thrown out or not and he says that the possibility of a settlement between the workers and the management should be explored. This is a very serious statement to make but I make it knowing the full responsibility because had it not been for the aid of the Government this gross injustice would not be allowed to be worked out. The moment the workers who are thrown out get together in their trade unions and make their protests in the name of law and order they are prevented from pursuing their efforts and their families are doomed to poverty and so many other hardships."},
  { name: "Transcription No: 269", text: "After an exhaustive speech that my hon. colleague the Finance Minister has made I have very little to say. The reasons for the modification of the award have also been given in the statement annexed to the order of the Ministry of Labour dated 24th August 1998 and placed on the Table of the House. Ever since the publication of the Appellate Tribunal’s award when rumblings of growing discontent on both sides began to be heard I have been greatly concerned on two accounts. Firstly I have been most anxious that the state of tension which has existed in the relationship between employers and employees in the banking field during the last five or six years should relax and give place to an enduring relationship based on goodwill and contentment. Secondly I have been equally anxious that while the terms of final settlement of the dispute should not be such as to injure the cause of banking in the country they should be fair to the vast number of what are known as the lowest categories of bank employees and who have put up with much trouble and expense during all these years of costly litigation. It is true that Government has been given the power under the Industrial Disputes (Appellate Tribunal) Act to accept reject or modify the award of an industrial tribunal if and when Government is satisfied that it is expedient in the public interest to do so. It cannot be disputed that the said powers should be exercised by Government with due care and caution in exceptional circumstances and for very strong reasons of public interest and that the modification of an award of an industrial tribunal by executive action is prima facie not desirable. I also subscribe to the views expressed by many honourable Members that the sanctity of the award which is in the nature of a judicial pronouncement should be respected by conventions and precedents. Honourable Members have heard from my colleague the Finance Minister how the full burden of the Appellate Tribunal award might have brought about a crisis in the banking industry. In particular he has told the House how banking facilities in rural areas might have suffered a serious setback on account of the burden. The arguments that he has adduced are before the House and I would request hon. Members to consider them dispassionately. If any bank is really going to suffer a serious setback I am sure that this House and I venture to say all sections of it will accept the necessity of modification however much they might ordinarily condemn such a step as being bad in principle and unacceptable in practice. After all it is only in a healthy economy that bank employees or any other groups of wage earners can hope to secure a reasonable living. No doubt Government must take care to see that the awards of judicial and quasi judicial bodies arrived at after the most exhaustive studies and researches are not lightly brushed aside and that none but the gravest consequences are allowed to justify any modification which might go against the immediate interests of the weaker side that is labour. Government have placed all their cards before the House and it is for the hon. Members to decide whether their judgement is right and whether it has been taken only after the most careful consideration. It cannot be a pleasant prospect for any Government to pass orders which will have the effect of depriving low paid employees of a portion of their emoluments and when they undertake such an unenviable but perhaps inevitable task they would be doing so after careful consideration. Governments are no more infallible than individuals but no Government worth the name can afford deliberately or negligently to cloud its vision and judgment by partiality or careless assumptions. I would therefore appeal to hon. Members not to doubt the bona fides of Government. If Government in fact have gone wrong it is for the employees to place facts and figures before them with a view to persuading them to change their decision. According to one estimate made by the employees 70 per cent or so of the employees stand to lose by the amended award. If that is so employees would do well to supply lists of persons who will be suffering a reduction in their emoluments. Finally I must appeal to both employers and employees to consider these problems objectively and dispassionately. They have been before courts and tribunals for the last five or six years and have expended a good deal of time temper and resources in the prosecution of the judicial proceedings. It is time that they settled all old scores and got down to the business of banking. Their own prosperity is directly linked to the prosperity of the bank they serve. In this Bill I do not quite understand one peculiar thing. In all other legislations we have the feeling that Government wants to take more powers."},
  { name: "Transcription No: 270", text: "Mr. Chairman Sir as the other hon. Members have pointed out this Bill has had a very chequered history. I do not think in the history of Parliament after this country became independent any Bill has suffered the duress of circumstances so badly as this Bill has suffered. But all the same it does indicate the confused thinking of the Government of India. Really how to explain the situation? This Bill has been introduced again in the Fourth Lok Sabha. As the hon. Member Prof. D.C. Sharma pointed out this Bill has assumed really a very peculiar character because somehow or other neither the Government nor the persons have been able to explain fully as to what exactly they want to do with the patents in this country. This Bill was also introduced in the Third Lok Sabha but it could not be passed. It was always said that it was due to lack of time which prohibited this Bill to be passed. The life of one Lok Sabha is five years. I am surprised that in the life of the Second Lok Sabha it was not passed in the life of the Third Lok Sabha it was not passed and it has come in the Fourth Lok Sabha. Let us really expect that this Bill will see a better fate now. It is not that there was any lack of material. As the hon. Member who just spoke before me pointed out many committees were appointed. First of all a committee was appointed by the Government of India to go into the entire law of patents. A Patents Enquiry Committee was appointed which went into the entire details of patents system and formulated proposals based on U.K. pattern. That was introduced in December 2003 but it lapsed. I do not think that the Government can convince this country or outside that this piece of proposed legislation lapsed because of lack of time. We are not so innocent as all that that we could not find time for an important law when we require this law to be passed or to be given a shape because of the requirements of rapid technological developments in the country. Does it create a good impression? The whole world has always been talking about our patents. In the last twelve years we have not been able to do anything. The Government has not come forward with its mind made up and it is really a great tragedy that this Bill is one of the many instances of how much confusion there is in the thinking of the Government vis a vis modern requirements of economic development. This is only one instance. There are many others. But this instance is a clear example of how much confusion there is in the Government thinking about the basic requirements of industrial growth and economic growth which can compensate for and which can really keep its pace with the economic development in other countries. I will not go beyond this. But I would certainly say that I do not believe that destiny only has had its hand in restraining this Bill in one form or the other. Now this Bill has come before the House. The recommendation is that the period of patents should be reduced from 16 years to 14 years in the case of drugs and chemicals and 10 years in the case of others. When we are discussing this matter we should realise and accept our own limitations. I may just give one instance of the Pimpri factory which is a public sector undertaking. This factory has invented two drugs. Many countries are wanting the patent and also wanting to manufacture the drug. On the other hand we have not been able to manufacture this drug yet and put it in the market. For in practice we have a very outdated system of marketing. Our distribution system is not up to date. In other countries for instance in a country like Japan or America they spend millions of dollars on research and the moment the research is completed they apply every strength and tap all their resources into the drive to put that commodity in the market as soon as the investigation is found to be fruitful. But they also have a capacity to withdraw the drug overnight or within a week or a fortnight in case it is found that the drug has not succeeded. I think it was an original product of Germany and it was given as a tranquilliser to women especially convalescent and pregnant women. It was noticed that this drug had created some adverse effects on pregnant women and when the babies were born they were found to be deformed. Immediately the Drug Controller in the U.S.A. issued a notification that that drug should be withdrawn from the market and I think that within a week or a fortnight this drug was withdrawn. So far there were only two or three exceptional cases."}, 
  { name: "Transcription No: 90", text: "Now, there is another aspect of the rubber industry, namely, the rubber producing industry, which has been entirely left out of the consideration of this bill, that is, the rubber manufacturing industry. My hon. friend Mr. R.P. Sinha has rightly pointed out that aspect. We find that Indian rubber production has been consumed by the rubber manufacturing industry in India. So, here is the question of increasing Indian production. As with the tea trade, the question is of export. As yet, the structure of the tea trade and the trends of the tea trade are such that it is mainly dependent on export and whenever there is any loss of export market, there is a hue and cry of a crisis. But in the case of the rubber industry, all the rubber produced in India is consumed by the rubber manufacturing industry in India. Rubber is a very important commodity and this industry should also be developed here. There is a deficit in Indian production. So, the government thinks of allowing import of rubber. If the production of rubber is increased by 27,000 tons a year, that will be consumed in India. That is all very true. So, my point is that in connection with the development of the rubber industry, we cannot leave the rubber manufacturing industry out of our consideration. These are closely connected with one another. Coming to the question of the rubber manufacturing industry, my friend Mr. R.P. Sinha has rightly pointed out that it is also dominated mainly by foreign companies. The rubber manufacturing industry in India produces various types of rubber goods from tyres to water-proofs and other rubber materials. They produce tyres and tubes, cables, general mechanical goods including roofing, footwear, and so on. But the predominant position in the rubber manufacturing industry is occupied by Messrs Dunlop Rubber Company, Messrs Firestone Tyre and Rubber Company, Bata India, etc., and from the figures which have been given in the report of the Indian Tariff Board, it is seen that the average total consumption of rubber is distributed among a large number of small industries. Here also, the question that arises is this. How should we treat these concerns, these big gigantic concerns. Sir, I have not studied the condition of labour in these industries of Messrs Dunlop, Firestone and Goodyear Company. Therefore, just now I am not in a position to give you the picture of their condition, but the question is that from the price of rubber in India, in relation to the world price of rubber, these people are mostly benefiting. It is true that prices cannot be fixed in such a way that the big concerns will pay one price for the rubber and the small concerns will pay another price for rubber. Here also, the main question that comes is this. If we want to develop the small units, the question arises of putting some check on the profits made. These big foreign concerns must go. It is they who are taking all the advantage of the present position in India. About that aspect, I find that there has been no mention in the bill and there was no indication in the speech of the hon. Minister for Commerce. Then, lastly, I would like to say that here also the government has taken the power to appoint the Chairman and is going to reconstitute the Board. The same remarks which I made in connection with the Chairman of the Coffee Board are valid here. If it is the intention of the government to break the domination of the foreign rubber growers or big rubber growers in the Rubber Board, I think it will be circulated to hon. Members later on. Let there not be any foreign representation on the Board. If the government is not prepared to accept that suggestion, then also, it can take certain other minimum steps. It can increase the representation of small growers, it can increase the representation of labour. The representation of small growers has been increased by one, but the representation of labour should be increased. I do not suggest the number now. In this manner, if the government thinks that the reconstitution of the Rubber Board is essentially necessary in order to exercise its powers for the development of the rubber industry, then the reconstitution should be on proper lines, not simply by having a nominated Chairman, not simply by indulging in eyewash activities. The government should do everything to check the big foreign interests and big growers. Mr. Vice-Chairman, as has been pointed out, we have a series of similar bills. Rubber is a cash crop, and therefore, I think, the government should be very careful to see that in fixing the price of rubber the price of the manufactured articles is borne in mind. The hon. Member who preceded me has pointed out that the rubber manufacturers are mostly foreign firms, and the figures that he has given are really staggering. It has been pointed out that during the last ten or twelve years the profits distributed are 350 per cent. That means the original one crore of rupees have received three and a half crores of rupees as profit. It has also been pointed out that one crore of rupees have become two crores of rupees by means of bonus shares, and the market price of the shares of two crores of rupees is nearly seven crores of rupees. That means that the original one crore of rupees become ten crores of rupees in our country. The foreigners are multiplying their profits. They are expanding their industries and getting a stronghold on our economy. The hon. Members of this House give protection. They want Indian industries to develop, but the advantage of this protection is taken by the foreigners. They set up factories in our country, and if at all some money is brought from outside, it multiplies ten-fold."},
  { name: "Transcription No: 91", text: "Mr. Vice-Chairman, I accept the principle of the separation of the Railway Finance from the General Finance. I also accept the desirability of this arrangement. It is not only a convenient arrangement but it is based on sound principles, and is conducive to the better administration of the Railways. I also agree that the contribution of the Railways to the General Revenues should be in the shape of fixed dividends, but I cannot agree that the dividend should be fixed at 4 per cent and that is the crux of the whole report. As a matter of fact, the Committee was instituted only to go into that matter whether the dividend payable at the present time, i.e., 4 per cent was reasonable or not and whether this arrangement should continue. When I say that I do not agree to the rate of dividend, I wish to submit that enough material has not been placed in our hands to judge whether the dividend which is being fixed is fixed on some sound basis or not. The Committee has not examined certain vital matters concerning the administration of the Railways and what I find is that the whole arrangement is very superficial. It appears to me that the Railway Administration and the Finance Administration came to an agreement and the Committee did not find it necessary, because of the agreement between the two Ministries, to examine and go into the vital matters which affect this issue. It is not clear how this dividend, if fixed at 4 per cent is going to react on the working of the Railways and particularly on the future development of the Railways, and also on the present structure of the fares and freights. This question has not at all been examined and we do not know what reaction it is likely to have. These are very vital matters and I think that they need a thorough examination before we can come to correct conclusion in this matter. As we know, there is a pressing demand for reduction in the Railway fares, particularly for third class passengers. This demand has been made on the floor of this House, and I think there is great justification behind this demand, and more particularly now when we find that the prices of agricultural goods have gone down, we will have to take into consideration the question whether the rural population who will get much lesser return for their products now, will be able to pay the same fares and freights. I also wish to draw your attention to the fact that the Federation of Indian Chambers of Commerce had submitted a memorandum to the hon. the Railway Minister asking him for an examination and revision of the freight structure. I do not know what the position today is, and not until we are enlightened about that, unless and until we know where we stand in relation to freights and fares, we are not in a position to take any decision whether the rate of dividend should be 4 per cent or not. I should like to ask the hon. the Railway Minister, whether in view of this strong demand made by the people through their representatives in both the Houses of Parliament and in view of the changing economy with which we are faced, he can give us an assurance that he will be able to discharge his obligations and responsibilities and commitments, that he will be able to pay a dividend of 4 per cent, and yet, he will be able to reduce the freight and fare rates. That is the basic thing. Another important factor which has to be taken into consideration is the development schemes. I wish to submit that there is no new approach in this matter. I find that we are going about in this matter in the same frigid manner and the aspirations of the people have not at all been taken into consideration. The hon. Railway Minister will remember that during the Budget speeches made on the floor of this House as well as in the other House there have been incessant demands for the development of the Railways. I do not know what he thinks about it and how he thinks that after paying this dividend at 4 per cent he will be able to meet that demand and he will be able to find a way for the Railways to expand their economy, as they think it proper as would meet the demands and aspirations of the people. In this connection, I wish to invite your particular attention to the facts. I will be happy if we could pay even a larger percentage but the fact is that we must be sure that the Railways are, in the present circumstances, in a position to do so and yet discharge their responsibilities and obligations and satisfy the needs and demands of the people which are legitimate and justified. Now, when we fix the dividend at 4 per cent, what happens is that we also fix that of those projects which are to be considered as remunerative at 5 per cent because the Railways want a margin of 1 per cent. What actually happens is that when we fix it at such a high level, because of this percentage, we find that not many new projects are really taken up and we have been very seriously disappointed in this matter. I, therefore, think that in the present circumstances, the Railways cannot afford to pay a dividend of 4 per cent. May I ask the Railway Minister whether it is not a fact that even he has not been able to contribute fully or even he will fall short by about Rs. 60 crores in his contribution towards the Plan. Out of the Rs. 400 crores that the Railways have to contribute, I find from his speech that they are faced with a net shortfall of about Rs. 62 crores."},
  { name: "Transcription No: 92", text: "This question, Sir, in my humble opinion, should be viewed from a different angle from which it was looked at and discussed here yesterday. It is true that it is correct in principle that the Railways whose entire capital-at-charge is drawn from the General Revenues, should be able to make a good contribution to the General Revenues, but in applying this principle, care must be exercised. If we are looking at railway systems in advanced countries like the United Kingdom or the United States of America or any such countries, this principle, no doubt, could be applied on all fours. But in a country like India whether it could be applied is a question that should be considered. It was argued that the Railways have a long history and because they have long been an established concern, they should now be able to contribute to the General Revenues. Although it is true that the Railways are a long-established concern, still the circumstances under which the Railways were run are not being examined here. The Railways, as we all know, before independence, were run not on a welfare State basis but they were run on the system of strategic lines. When the railway lines in India were formed, it was not the question of developing economic resources, it was not the question of linking up industrial centres, it was not the question of linking up the railway system with pilgrim centres or centres of density, that prompted the authorities, the private companies, to start the Railways in India, but it was the strategic concern of the British Government then that prompted these companies to form Railways. The question of arriving at a correct pattern of railway system from the point of view of developing and exploiting the natural resources of the country, from the point of view of developing the backward areas of the country, is still there to be examined and to be attended to. Well, from this point of view, as anybody can see, there is much scope for developing the Railways. In fact, there is so much pressure on hon. the Railway Minister for new lines that one will be at a loss as to where to find the resources from. They have undertaken in the second part of the Five Year Plan to construct new lines of 1,500 kilo metres in length. In order to have a perfect railway pattern, to be able to exploit and make use of the natural resources of the country to the fullest extent, although we cannot dismantle the railway lines that we have now, still these lines have to be linked up to fulfil that requisite of exploiting the natural resources. So, my point in bringing out these arguments is to show that the Railways have a full development programme on their hands, and they need funds. They can no longer draw from the General Revenues of the country, as the Railway Finance is separated from the General Finance. They have to obtain the resources that are required for development either by loan or otherwise. There is the other need also to be examined in this connection, the need of passenger amenities. Both inside these Houses of Parliament as well as outside, it has been agitated that passenger amenities are required to be given in a larger and larger number. The second class passengers, before independence, did not get adequate amenities. In fact, the condition of the bogies, the condition of the waiting rooms, the condition of catering facilities and the condition of housing, all these things needed much attention. Although the Railways have now taken up the amenities programme, and according to the recommendation of the Convention Committee, we are now earmarking Rs. 3 crores per annum for this purpose, still, I think, it is totally inadequate. The Railway Administration has now recognised the fact that greater and greater passenger amenities are to be given. But, they are not going, on the right lines. I may make this statement clear by saying that they are not following proper lines with regard to the amenities that are to be given. I will take just one example and point out how they fall short of the requirements. Well, the question of providing waiting halls for second class passengers has been a much-mooted question, and that naturally gets a top priority in the amenities programme. Well, the so-called waiting halls that are now provided are like this. The halls are there; the exit gate from the platform opens into the hall, and the entry gate into the platform opens into the hall, so much so that in fact the hall is only a passage. When people come and go, how can the second class passengers take rest here? That is a question which I have not been able to understand. Secondly, for the passengers who have to wait for a number of hours in these halls, necessary sanitary facilities should be provided. Now, the sanitary arrangements may be inside the platforms, where the waiting passengers cannot go. And if they go and commit nuisance outside, the policeman will be there to haul them up and prosecute them under the police regulations for committing nuisance. So, it is not imagined that when passengers are required to wait for ten hours or twelve hours in these waiting halls, they should have some bath-room facilities as we have for first class or for higher class passengers. That thing has not been visualised. Even for our cattle-sheds in our houses, we have doors and windows, but here for these second class waiting halls there is neither a door nor a window, nor an enclosure. This, I say to draw the attention of the authorities to think of these amenities in their proper proportion. Their estimate of the requirements of funds for these amenities is an under-estimate. The needs for increasing the amenities are large."},
  { name: "Transcription No: 93", text: "Sir, coming from the South, we are very happy that after a prolonged struggle, after a good deal of suffering by the people and after several movements have been conducted by the people's representatives, Pondicherry has become one with us, though not still according to law. It is gratifying to know that the people of Pondicherry and the surrounding French settlements are very happy about their being reunited with the motherland and it is in the fitness of things that the Government of India has come and asked for sanction of expenditure there. With regard to Pondicherry and other French settlements in the South what the Government of India has been doing and what the Chief Commissioner has been doing have won the approval of all sections of the people. Pondicherry has been going through very, very difficult times and there have been uncertain political conditions for the past so many months and it is really surprising how the law and order situation has been so successfully tackled and how the people after a very long time have been assured of perfect law and order in that area. Pondicherry has been notorious for the disturbances and in the past two months the situation worsened because of lack of cooperation between the Administration and the people and it is after a very long spell of time that the people of Pondicherry are enjoying a stable Government. The Government of the day and the Chief Commissioner have been doing their best to establish perfect and cordial relations between all sections of the people. The Chief Commissioner is also trying to give the people of Pondicherry a perfect democratic set-up. So, it is not true to say that he has been doing things which are not in the interests of the people or which are not conducive to democratic functioning of institutions there. All the political parties which have been openly siding for the merger have been recognised and it is with them that we have to get along till elections are held in Pondicherry, till a final decision is made by the people whether they would be with the Indian Union or not. Till then, the Government of India have done a good thing in nominating people's representatives to official positions so that there may be better collaboration between the people and the Government. It has also been said that they have provided enough money for carrying out ordinary repairs, and also for medical facilities and other amenities that are necessary to the people of the place. I would like to refute the allegation that the Government have been partial to one political party and are trying to dominate other political parties which also worked for the freedom of the people. The Government have been taking a non-partisan attitude and have recognised the claims of the people. It is the people who have to finally decide and the people's representatives have been given the recognition. All the political parties which were working for the merger of Pondicherry with the Indian Union have been recognised and the predominant political party of the day, which did contribute greatly to the merger movement, has been given recognition and that has the approval of the people. Moreover, it is untrue to say that the police is trying to dominate and is trying to force the people to submit by the use of bayonets and arms. The police is there to protect the people against the onslaught by undesirable elements in the area. So, the police are doing a very difficult but a responsible job and the people of Pondicherry have no complaint and most sections in the settlement fully support the move of the Government. Pondicherry will be with us soon and we hope that the people of Pondicherry will vote for the merger of Pondicherry territory with our own. It was said that at Pondicherry and other places certain political parties which worked for the liberation movement have been ignored and that they are being suppressed. It is not so. All the political parties, except the Indian National Congress which was having a branch there, were formerly with the French Government and they did not want freedom. In the past two months, they voted for the merger, actually the de jure transfer of power from the French Administration. Today, Pondicherry is able to get along well, with the other sections of the people, and the people have welcomed the merger with great relief. It was the people who were suffering, it was the common man, it was the worker, it was the ordinary people who had to depend on the mainland for the supply of necessities. They were put to a lot of difficulty before and now they have got almost all the necessities of life supplied to them at a very reasonable cost. Now, there is free movement of these essential things and the people of Pondicherry are very happy about it. There was only one section grumbling about in Pondicherry and that is by the merchant class. They have made a complaint that with the stopping of licences to import and also due to the cancellation of many import licences, they have been put to a great loss. They have been the worst sufferers because they will have to fulfil their contracts. I would like the hon. Minister to consider this aspect that whether the licences that have been granted by the previous Administration can be held valid, of course, subject to the financial interests of our country, because people also take this opportunity to cheat the government of India of their legitimate share of taxes and also the import duty. Similarly, there is one irksome feature which has been the subject of many a complaint by the people of Pondicherry, and that is, the customs barriers still exist. There are lots of people who are going to Pondicherry every day and these people are being put to a lot of customs difficulties."},
  { name: "Transcription No: 94", text: "In the course of the discussion, it has been very ably pointed out by a large number of speakers as to how the rubber industry is in the grip of certain foreign elements and Indian monopolists at the top. We know that there are small planters and producers but the hold of the Dunlop Company was also mentioned. So far as the big industries are concerned, it has been their policy to capitalise the money and to put money in the reserve fund instead of utilising such funds and profits for improvement of the working classes and for the betterment of the labourers. It was pointed out yesterday that the Dunlop Company gave very high dividends. You will be shocked to know that while the Company had money to declare a dividend of 40 per cent and also to capitalise a part of the profits, it did not give at all a fair deal to the workers. On the contrary, they were kept at more or less the same old level, where they had a kind of labour, practically speaking. Therefore, it becomes necessary to look into this matter. Sir, we are interested in the increase in production and everybody is interested in the increase in production. The production of rubber, coffee or of any other essential commodities or imported commodities must undoubtedly be increased in the country. But merely by appointing a Board or by taking certain powers into the Government's hands or investing the Board with such powers, you cannot ensure increase in production. There may be slight improvement here and there, but materially you cannot alter the situation until and unless you inspire the real producers by making them see through their own lives' experience that increase of production means a constant rise in their standard of living, in their material and cultural well being. Now, that is why, I say that it is very essential, when the Board is really being given certain powers for looking after the interests of the working class, to make these powers effective and to make them effective would be to ask the Board to work for the increase of the wages of the rubber workers or the labourers who work in that particular industry. Now, that is not there. It is a very unhappy omission and a very sad omission, if the intention of the Bill is good. Sir, as you know, we had been told in the recent days very much about socialism and we are not talking about socialism in its big aspects here at all. This is not our concern here. But if you at all really have such feelings, if you think that socialism is something which one has to swear by, even though the ideas of socialism were first propagated one century ago, then give some expression to it. But we know that there will not be socialism at all under you. All that we say is, if you swear by socialism, talk about socialism, if the Members of that side of the House go to some other Houses and hear lectures very seriously, they should come here and tell us that they are also going to increase the wages of the workers when such measures are brought up. Such occasions are good occasions for them to begin to cultivate this thing because you have yet to learn the ABC of socialism first and you cannot write a book or a poem or an article straightaway and we do not expect you to do it either. But if you are really sincere about what you are talking, you should try to learn the ABC, that is to say, begin with giving the workers a fair deal, giving them a living wage and dealing with the workers here in this Bill you should make provisions for them. I do not suggest to the Minister that in this Bill there should be provision that so much wages shall be given to the rubber plantation worker or fix a scale and all that sort of thing. All that I have proposed in this amendment is that the Board should be given that reorientation of outlook, should be given the direction that the wages have to be increased and that they have to consciously work for it. That is all that I demand in this amendment. Sir, we do not like that our workers should be exploited by the people, and he will not deny because it has been pointed out from that side of the House also, that huge profits are being amassed, they cannot spend the money, the British who are earning out of this industry cannot spend the money. With all their luxury and extravagance, they cannot spend that money here in this country. They send this money abroad. Even then, they retain some money in their hands. They would rather keep them in banks idle than give this money to the workers for bettering their lot, for improving their conditions which determines, in the final analysis, whether the production of the country would go up or not. Now, Sir, I read with great interest the Select Committee's Report, especially the portion of the evidence appended to it, and I would ask you also, Sir, to re-read if you have already read this interesting document. You see here Mr. T.T. Krishnamachari crossing swords with an important representative of the British interests, the British rubber interests in this country. Now, it is all a wordy battle. It is a sort of very interesting competition for being smart, one trying to overreach another in smartness. But, at the same time, out of these discussions it emerges that the British interests are totally unmindful of the interests of the workers, of the interests of the country as a whole although the British gentleman who came here to give evidence spoke of national interests and all that. Here, you will find many times."},
  { name: "Transcription No: 95", text: "Sir, the hon. Minister has said that because this Bill is of a complicated nature, he has come forward with this measure to extend the blanket cover that is to be given by another one year. Sir, in my opinion, the Bill as such is not complicated, but the Government have made it more complicated by getting into certain things which, in my opinion, are certainly extraneous for the purpose of this Bill. Sir, in the course of one year this Bill has come up before this House three times. This is the third time that this Bill is coming up before the House. The parent Bill was introduced in December 1983 and in less than one year two amending Bills were being moved before us. Even at the time when the parent Bill was moved, it was suggested by several Members, both on this side as well as on the other side of the House, that it is safe to enumerate in the Bill itself by attaching a schedule to it, to specify clearly, provisions as to what would amount to an office of profit and what would not amount to an office of profit. It was then stated by the then hon. mover of the Bill that it was not necessary to attach any schedule to the Bill, and that the Bill by itself, as moved, was comprehensive enough. Then, Sir, certain difficulties were felt, and various Members of this House as well as of the other House had addressed the hon. Law Minister then, asking him whether their remaining in a particular committee would amount to an office of profit or not. Probably, looking at the numerous letters that had been addressed to the hon. Law Minister, he was in a dilemma as to what to do. He had come forward with an amending Bill to extend the life till the end of December 1984. A committee was constituted to advise the hon. Law Minister as to which offices would amount to offices of profit and which offices would not amount to offices of profit. Sir, I am told by one or two members who had served in that Advisory Committee that only once, only during this session, they were summoned to meet. I would ask the hon. Minister, Sir, this question: When it was such an important measure, what was the Ministry doing from April 1984 till December 1984, excepting to come forward before the House with another amending Bill of this nature? Originally, Sir, only four months' time was asked for, when the parent Bill was moved, and it was stated that within that period of four months they would come forward with a comprehensive legislation. Then again, they came forward with another amending Bill, extending the period till December 1984. Now, between April and December nothing has happened excepting that the Advisory Committee has been constituted, and it met once only just to recommend for extending the period by another one year. Sir, nobody, in both the Houses would oppose this measure, but they can only criticise the way in which the Government is dealing with this measure, the way in which the Government is sleeping over the matter, a matter which affects the very life of a Member of Parliament, not only a Member of Parliament, but also a Member of the State Legislature. As the hon. the Law Minister has pointed out, Article 102 of our Constitution does not define what is an office of profit except to say that a Ministership or a Deputy Ministership or even a Parliamentary Secretaryship and by a later amendment, even a Whip of the Congress Party would not amount to an office of profit. Only a few instances are specified as to which offices would not amount to an office of profit. Then, Sir, complications had arisen even when the original Bill was moved introducing statutory committees and advisory committees. What a statutory committee was, or what an advisory committee was, was not at all defined in the parent Bill. So, doubts had arisen in the minds of various Members as to what would amount to a statutory committee or what would amount to an advisory committee or even whether a Vice-Chancellorship of a University, to which are attached certain privileges like the appointment of so many persons and all that, was defined as not an office of profit, and the hon. the Law Minister was not able to say what office would amount to an office of profit, what would amount to a statutory committee or what would amount to an advisory committee. Sir, I have only to point out that an important measure such as this which affects the very existence of the Members of Parliament should have been given a very high priority in the matter of legislation. On the contrary, not much attention was given to this. The Committee met only once and even then nothing seems to have happened in that Committee. Sir, before the matter goes to a court of law for the Judges and for the lawyers to interpret what would amount to an office of profit, it is better that the hon. the Law Minister brings forward in the coming Budget session a comprehensive Bill which will specify in its schedules what are offices of profit. The schedules may be of a positive character or of a negative character. The schedules might say that the holders of such and such offices would not be disqualified from being Members of Parliament or Members of State Legislatures, or the schedules might say, in a negative way, that such and such offices are offices of profit, so that the Members of Parliament and Members of the State Legislatures would know whether to accept an office and whether they would be disqualified by accepting a certain office."},
  { name: "Transcription No: 96", text: "As you have already pointed out, under Article 323 of the Constitution, the Union Public Service Commission submits annual reports and these reports are laid before both the Houses of Parliament, along with any memorandum, if there be any, from the Government explaining their position as to why they have not accepted the particular advice of the Commission. Sir, we have so far received three such reports from the Commission and I have gone through these reports. Sir, the general impression that I have gathered after going through these three reports is that apart from the fact that there have been cases of non-acceptance of the Commission's advice in many important matters, there are, Sir, very serious irregularities committed by the Executive Government in the matter of appointments to the civil posts and the civil services. If you permit me, Sir, I may add that I have found that there are occasions when the Government has even by-passed the Houses of Parliament in their anxiety to provide for their favourites. Sir, under Article 320 of the Constitution, as you have already pointed out, the recruitments to civil posts and the civil services are to be made by the Union Public Service Commission. There are two basic ideas underlying this system of recruitment to the civil services adopted in our Constitution. Firstly, we desire that all eligible persons to a particular post should be entitled to enter into a fair and free competition to get that job. Secondly, we want to avoid all elements of patronage in the matter of appointments to our civil services. You will find that under the old Regulation which has been kept in force under Article 372, there are several categories of employment and posts which have been kept away from the purview of the Union Public Service Commission. One of these categories is temporary appointments lasting for less than a year. I maintain from a review of all these reports that the Government has abused this power of temporary appointments. The Government has used it as a shield to bestow all kinds of patronage. Sir, if you look at the posts, you will find that on the very face of it, they are not temporary posts, but that they are likely to continue for more than a year. Sir, appointments to such posts are made as temporary appointments merely to avoid the Union Public Service Commission. In the name of temporary and emergency appointments, I find that a large number of appointments are being made. The glaring examples are the Community Projects Administration and the All India Radio under the Ministry of Information and Broadcasting. We find, as a matter of fact, such appointments being made by every Ministry but these are the very glaring examples and I would like the hon. Minister to tell this House as to how many temporary appointments are being made every year by the Government and how many of them are continued even after the end of the year. Sir, they make the temporary appointments and they keep these appointments going on year after year and they do not also consult the Commission, although, under the Constitution, they are required to do so. Apart from bringing in an element of patronage in the civil appointments, this procedure acts very unfairly to the other candidates who compete from the open market when these temporary posts are made permanent. When the appointments are regularised by inviting applications by means of advertisements, what happens is this. We cannot prevent these temporary appointees from competing in such examinations and these temporary appointees who have gained experience at the cost of the tax payer compete with the candidates from the open market and do better because of the experience that they have gained. I know it from my personal knowledge that appointments in the temporary cadre are purposely made in order that a particular candidate may gain experience and do better at competitive examinations and have a better chance of getting a permanent Government service; otherwise, he could never have got such a post. Sir, not only this, but the Commission have also referred to the fact that advertisements are drafted in such a way that it may suit a particular person. On page 9 of the first report, they say, advertisements for posts in the category of technical, scientific or specialised qualifications are often so drafted by Ministries as to tend to restrict the recruitment to the limited circle of persons already holding the posts advertised or analogous posts. One of the main functions of the Commission is to so draft the advertisement without sacrificing the requirements of the post as to ensure a competitive selection for the post from the widest field. I have looked into the regulations and the method by which the Public Service Commission works in U.K. There, the Ministries merely inform the Service Commission that they want such a post to be filled with a person of such and such qualifications. The advertisement is drafted by the Service Commission, and not by the Ministries as is done here. Here, Government are anxious to bestow patronage and therefore it is that they want to avoid going to the Public Service Commission, and continue to make these temporary appointments and draft the advertisements themselves. I find from the Report that as early as January 1951, the Commission submitted their proposals to the Government as to how the existing regulations should be remodelled so that each case should come under the purview of the Union Public Service Commission. Now, the Government has not taken any decision in this matter. These proposals ought to have been placed before both Houses of Parliament, as required under the Constitution so that the Houses will be fully seized of the problems which are facing appointments and would give their directions as to how appointments in the civil services should be made."},
  { name: "Transcription No: 97", text: "Sir, this volume, the Progress Report for the year 1983-84, is before the House and Members will have discovered for themselves that this volume is replete with useful information. It consists of a large volume of facts and figures and it is hardly necessary for me to make a lengthy introduction. This Report is the basis of discussion now. I would make only one request to hon. Members. They will have a lot to say about the various aspects of our economic situation and economic progress of the country. We would welcome all that; they are entitled to make an appraisal of the activities. Let it be a critical appraisal and I hope, Sir, that it will also be a fair appraisal. In doing so, we will have to think not of today, not of the conditions in which we are functioning but we have to take our minds back to the days when the idea of a Plan took shape, when the proposals that are now before us and the action that has been taken on them was conceived of. What were those conditions? It will be very easy for all of us to recall the days of anxiety through which we were passing then. We were not sure of our food supplies for the next month. We were, as some people said, living from ship to mouth. We had a certain nervousness about our food supply. We had, on account of frantic demands from all parts of the country, to move food from one part to another and rush it to places where stocks were low. We had to import large quantities spending large amounts of foreign exchange. We had also to give heavy subsidies and, yet, people were not satisfied and they could not be. There were controls and there were difficulties experienced by many people. The quantities consumed then were low relatively to what a normal human being must consume. Sir, this was the situation in respect of food and in respect of other consumer goods also. Cloth was so difficult to obtain even to cover the minimum needs of an ordinary family. We had difficulties in other directions also, difficulties about transport and so on and then it was in those very days that the problem of rehabilitation of displaced persons was prominent. We had started tackling it but we had not completed that yet. Prices were rising and so many people felt that at those high prices an average family could not subsist. There were inflationary pressures and so, anything that we could do to relieve the situation, to increase production, to spend money making large investments created those dangers of increasing inflation, of a further rise in prices. That was the dilemma. What is the position now? When we judge of ourselves today, we should not think of today. On the basis of conditions today, we determine the future and our future performance but so far as the past is concerned, it is these conditions that determined our present. What is it that we find today? Our major headaches have been relieved. Nobody can say that food is scarce; nobody can say that cloth is not to be had. In the matter of transport, we have greatly improved and our position in several other directions has also improved. For these things, it is not necessary to give any figures; the thing is there in the air and it is part of everybody's experience in the country that the difficulties and the anxieties have, more or less, gone and that we can breathe freely and can think of the future with confidence. The chief difficulty both in industry and in agriculture was, of course, that there was not enough production. We were faced with the spectacle of high prices and scarcity of food, etc. Also, our industries were not running full capacity; existing capacities were not being utilised; in the case of several industries, we were using only a part of that capacity. Therefore, agriculture was the key to the whole situation. We must produce more raw materials in order to run our industries well. Sir, this is what we started doing. We came to the conclusion that we must do everything possible in the course of the five years that we had before us to bring about an increase in agricultural production to the maximum possible extent. We made up our minds that we will free ourselves from the necessity of importing food from outside countries; we wanted to be relieved of this dependence. Sir, we have succeeded in that, but for doing that we had also to decide that the major part of our resources should be applied to this sector and we decided to increase irrigation facilities, major and minor. We decided to make programmes for giving more fertilizers, manures, improved seeds and reclamation of waste land. In all these directions we have spent some money and we have achieved results in physical terms and those results are very heartening. In the field of irrigation, for example, we can legitimately take a measure of pride in what has been achieved already. By the end of this year, the area irrigated by projects is expected to exceed five million acres. The river valley projects which had been begun before the Plan are now making rapid progress. Work on the new river valley schemes which were included in the Plan for the first time, such as the Chambal, the Kosi and the Tungbhadra, has also begun. On the Kosi, preliminary work has been completed and construction is about to begin. Some Members were anxious about Kosi. Estimates of about 7 or 8 crores of rupees have been sanctioned and all preliminary work has been completed. I may tell them that in a few days construction will be taken in hand. At the Kosi Project, we also hope to witness the heartening spectacle of large scale public participation."},
  { name: "Transcription No: 98", text: "Sir, as is well-known, in 1982 when we passed the Delimitation Commission Act, the constituencies were formed on the basis of the census figures arrived at at the last census in 1981. The census authorities at this time worked in a manner which was slightly different from the way in which the work was carried out in 1971. At the time of the census of 1971, as we are aware, all castes and sub-castes were mentioned in the census figures. But at the time of the census of 1981, naturally, in view of the change in our policy, what they did was that they did not enumerate all the castes, but only enumerated such castes as were ordered to be enumerated generally as had to be given some special representation under the Orders issued by the President under Article 341. As we are aware, Article 341 provides that in the present circumstances, the President shall determine the Scheduled Castes and the Scheduled Tribes to whom for a period of ten years special representation has been given. And under Article 341 (2), if at all there is to be any change in these in the list, then it is only Parliament that can make that change. At the present moment, the position is that at the time of the census of 1981, there was an Order giving the lists of the Scheduled Castes and the Scheduled Tribes for whom special representation was to be given. Therefore, at the time of the Census of 1981 they tried to collect information only about those cases which were mentioned in that Order, for the purpose that they may be given the special representation on that basis. But it appears at the present moment, at the time of the actual taking of the census information, certain people mentioned their castes a little incorrectly. For instance, if a person belonged to some sub-caste, at the time of mentioning it to the enumerator, he gave it as Harijan. Now, Harijan is neither a caste nor is it recognised. So, probably, at the time of the census of 1981, such people were omitted, though they really belonged to the castes enumerated in the Order. Similarly, there were certain synonyms of castes, and in that case also, people of the same caste for whom the protection was intended, on account of their giving the wrong description to the enumerator in respect of the name to which they did not exactly belong, they were also excluded. Therefore, in the 1951 census register which was prepared on the basis of the information thus supplied, certain castes were omitted. After the passing of the Bill, as we are aware, under Article 81 of the Constitution, the membership has to bear a certain proportion to the figures of population of the last census. It was, however, found as, for instance, in the case of Andhra Pradesh, though there is a general increase in the population as a whole, there was a decrease in the population of the Scheduled Castes and the Scheduled Tribes. This was so glaring that it was brought to the notice of the authorities concerned, and the census authorities there, from whatever information they had, corrected these figures because in respect of these they had certain slips or certain other papers giving the information from which they could get the correct figures. That could be corrected because the final Delimitation Orders were not passed at that time. So, in respect of Andhra Pradesh and Gujarat where the final Order was not passed, the census authorities corrected these figures and the Delimitation Commission took that into account and they did their work. But it was found in respect of certain other States also that such corrections were made. But the Delimitation Orders were not passed. Therefore, we first intended to bring forward or introduce a Bill in the Lok Sabha only in respect of those States where the Delimitation Commission had not passed its final Orders, with the provision that if the Census authorities were to make a change in respect of the figures of population of the Scheduled Castes and Scheduled Tribes, then they could, in their final orders, take these figures into consideration and delimit the constituencies on that basis. However, when the Bill was introduced, it was brought to the notice of the Government that in many of the States, final Orders had been actually passed by the Delimitation Authorities, and it was therefore necessary in order that there should be uniformity in the principles followed in respect of this matter that there should be some provision brought in spite of the fact that final orders are passed by the Delimitation Commission, that could be reopened, but only for this limited purpose, wherever the census authorities had to correct these figures and place it on a proper basis. The Delimitation authority should in that case, reopen that matter and determine the matter on the basis provided by the Census authorities. Therefore, the scope of the Bill to that extent was widened. The Bill which is now before the House is in this form. So far as the delimitation of constituencies is concerned, whether it is Andhra Pradesh or Gujarat or whether in respect of other States, the Delimitation Commission, will be authorised to reopen these matters if the Census authorities had to change the figures of population. Therefore, the Bill before the House is a very simple one to that extent. It only enables the Delimitation Commission to take into account the corrections which may be made by the Census authorities. It is primarily the Census authorities who are to do it now."},
