 कर सकती, जो जनता ७ के कष्ट दूर नहीं कर सकती । आज तक जितनी भी योजनाएँ बनाई गई हैं, जिन्हें हम पहली पंचवर्षीय योजना, दूसरी पंचवर्षीय योजना और दसवीं पंचवर्षीय योजना आदि कहते हैं और उन योजनाओं में हमने जो कुछ निर्धारित किया उनसे “\" हम जनता के दुखों को दूर नहीं कर सके और जनता के कष्ट दूर नहीं हुए । इन योजनाओं के परिणाम ““ भी हमारे सामने हैं । बड़े-बड़े अनुभवी बैठे, उन्होंने आजा बाई ५288 ठीक प्रकार से कार्यान्वित नहीं की गईं उन योजनाओं में काफी दोष थे जिसके कारण ये योजनाएँ लोगों कर सकी । लोग दुखी ही रहे । गीक दुखोको दुरनहीं मैं यहाँ पर कहना चाहता हूँ कि जो हमारी क्या निकला ? \"» उसका परिणाम गहो न गा थी उसकी 2288 करना पड़ा । जो योजना होती है वह राष्ट्र धन \" को ऊँचा करने के लिए बनाई जाती है । लेकिन हमारे सामने आँकड़े हैं इंसका परिणाम ॥ कर ए नर हमने अब तक नौ पंचवर्षीय योजनाएँ कार्यान्वित की हैं मे सामने है । ” आय में और जीवनस्तर में अपेक्षित वृद्धि \"नहीं हुई है 'न हमारी प्रति व्यक्ति मैं यह कहना चाहता हूँ कि हमारा ऐसी सजा में हुई है । यह दुख की बात है के कप्टों को, जनता के दुखों को दूर न कर सके विश्वास '« नहीं है जो जनता करते हैं जो उनकी आयु बढ़ा सके उन. ऐसी योजनाओं पर विश्वास उन्नत कर सकें / उनका आर्थिक विकास कर सकें, उन्‍हें"},{"name":"संख्या 9","text":"सभापति महोदय, ये शब्द मेरे नहीं हैं बल्कि राष्ट्रपिता के हैं । जो लोग आज सरकार में बैठे हुए हैं ” क्या वे अपने दिल में सोचेंगे कि यह देशद्रोह शब्द बालकों को अंग्रेजी पढ़ाने के लिए राष्ट्रपिता का \" कहा हुआ है । आज 54 वर्ष देश को स्वतंत्र हुए हो गए हैं लेकिन राष्ट्रपिता की इस बात पर \"\" आज तक ध्यान नहीं दिया गया है । अंग्रेजी भाषा को पढ़ाना क्यों बंद नहीं किया गया और उसको दैनिक * कार्यों में क्यों प्रयोग में लाया जाता है ? मैं इस बात को कई बार इस सदन में कह चुका हूँ '\" और मैंने इस विधान परिषद्‌ की नियमावली में एक वर्ष पहले एक संशोधन भी रखा था लेकिन मेरा दुर्भाग्य है\" कि वह संशोधन वर्ष भर से इस सदन में प्रस्तुत नहीं हो सका । मेरी अपनी राय है कि कम से कम दैनिक कार्यों के लिए यदि सरकार अंग्रेजी भाषा पर बंधन लगा दे तो बहुत अच्छा हो और जो यह अनुशासनहीनता \" है वह भी समाप्त हो जाए। सभापति महोदय, जैसा कि मेरे मित्र ने कहा, लड़कों के माता-पिता अंग्रेजी का '” प्रयोग करते हैं और उनके शिक्षक भी उसका प्रयोग करते हैं फिर बालकों पर उसका प्रभाव क्यों \" नहीं पड़ेगा ? मैं उनसे सहमत हूँ कि बालकों में नकल करने की आदत होती है । जैसा वे अपने बड़ों *\" को करते देखते हैं बैसा ही वे करते हैं । अगर हम कोई बुरा काम करेंगे तो उसका प्रभाव बालकों ः* पर अवश्य पड़ेगा । आप देखेंगे कि जिस मनोवृत्ति के माता-पिता और शिक्षक होते हैं उसी प्रकार के बालक भी होते हैं । हम दूसरों को तो परामर्श दे देते हैं लेकिन स्वयं उस पर अनुपालन नहीं करते इसके »« साथ ही साथ हमको शिक्षा- प्रणाली की ओर भी ध्यान देना है । शिक्षा के जिन तरीकों को आजकल १० अपनाया जा रहा है वे वास्तव में लाभकारी नहीं हैं । सरकार की ओर से इस प्रकार का आदेश होना चाहिए »\" कि चौदह वर्ष तक बालकों को अपनी मातृभाषा में ही शिक्षा दी जाएगी और दैनिक कार्यों में \" भी अंग्रेजी का प्रयोग नहीं होगा । इस प्रस्ताव में अनेक महत्वपूर्ण बातों की ओर ध्यान दिलाया गया है । १७ मैं समझता हूँ कि जब माननीय मंत्री जी इस का उत्तर देंगे तो कह देंगे कि हम बहुत-सी बातों पर कार्यान्वयन कर रहे हैं । लेकिन मैं समझता हूँ कि उन पर कोई कार्यान्वयन नहीं हो रहा है ।"},{"name":"संख्या 10","text":"पाप महोदय, आज हमारे देश में जो के मे लेकर नीचे तक 'शक्षा दी जा रही है *\" उसमें व्यवस्था ही एक कारण है जिसकी वजह से शिक्षा का स्तर गिरता जा रहा है । मेर अपना विचार » है कि जो शिक्षा प्रणाली है और जिस रूप में शिक्षा दी जा रही है, वही अनुशासनहीनता # भी को हहैं। अपने देश और प्रदेश में हर एक की अपनी- अपनी भाषा है और वह बालक जो इस देश में पैदा हुआ है, जो अपनी मातृभाषा की गोद में पला है, उसको यदि अपनी मातृभाषा में ही *\" शिक्षा दी जाए तो मेरा विचार है कि शिक्षा का स्तर ठीक हो सकता है । जो सबसे बड़ी भूल ”” और कमी सरकार के द्वारा दी जाने वाली शिक्षा के संबंध में हो रही है, वह यह है कि बालक /* की मातृभाषा में शिक्षा न देकर, उसको उस भाषा में शिक्षा देने की व्यवस्था की गई है जो हमारे & देश या प्रदेश की भाषा कभी रही ही नहीं । मेरा अभिप्राय विदेशी भाषा अंग्रेजी से है । मैं यह *\" मानकर चलता हूँ कि जब से यह भाषा इस देश में आई है, चाहे वह किसी कारण से आई «\" हो, इसे आप भी और इस माननीय सदन के सदस्य भी जानते हैं कि उस से बुरे परिणाम ही निकले *\" हैं, कोई भलाई ढुह।इस देश को जो तन है वह किसी से डी नी लव हमारे यहाँ जितना फैशन वह सब “ अंग्रेजी भाषा के ही ३ है $ 4 जिस समय यहाँ पर अंग्रेजों था“ कि वे लोग जो तिरोष कर के किसी न किसी ली ह देखते को मिला होते थे अंग्रेजों से \"\" मिलने के लिए जाते समय 9 से सरकारी पक्ष के ही करते थे । परंतु यह इस प्रदेश और इस देश 7७ अग्रेजी वेशभूषा का ही प्रयोग समाप्त हो जाने के बाद भी लोग उनकी वेश' का दुर्भाग्य है कि अंग्रेजों का राज्य इससे जो प्रभाव हमारे देश के फैशन पर भूषा को पहनते “\" चले जा रहे हैं। हुई है रहो भी रही है। मे ऐसा विचार है कि कक चाय हानि को ”\" बहुत हानि हुई है । भारत की सके कि अंग्रेजी वेश-भूषा से इस देश पर्याप्त ध्यान देने की आवश्यकता है सभ्यता और संस्कृति के संरक्षण पर"},{"name":"संख्या 11","text":"अरतिलेखन संख्या - [] अध्यक्ष महोदय, मैं आपको एक और बात बतलाना चाहती हूँ और वह यह है कि कृषि विभाग को योजना आयोग 2 ने बहुत गलत रास्ते में बिठा दिया है । उन लोगों के पास लड़ने के लिए दम नहीं है और देश * में खाद्‌यानन का उत्पादन बढ़ाने के लिए जो योजनाएँ चाहिए और उनके लिए जो धनराशि चाहिए बे “ उनको पूरी तरह संस्वीकृत नहीं करा पाते हैं कृषि विभाग तो जमीन की तरह आधार होता है और उसी » पर देश के लिए पर्याप्त अन्न पैदा करने का महान भार है । इम्नलिए यह बहुत आवश्यक है कि अधिक ''\" अन्न उपजाने के मार्ग में जो भी आवश्यक कदम यह विभाग उठाना चाहे उसमें किसी तरह की रुकावट न हो । '\" बहुत-सी हड़तालें हो सकती हैं । मजदूर काम से बरी हो सकते हैं लेकिन किसी भी हालत में वे खाने \" से बरी नहीं हो सकते अब हम देखते हैं कि मिलों और कारखानों में हड़तालें हो जाती हैं छुट्टी हो '*\" जाती हैतो आम काम के दिनों की अपेक्षा लोग उन दिनों में ज्यादा खाना खाते हैं ज्यादा दावतें करते ७\" हैं । आज यह हमारे लिए यह सर्वाधिक महत्व का विषय है कि हमारा अन का उत्पादन उस गति से बढ़े ताकि '\" हम अपनी खपत से अधिक उत्पादन कर उसका निर्यात कर सकें । सरकार तथा इस मंत्रालय के लिए यह समस्या 2” एक बड़ा सिरदर्द पैदा कर रही है । हर एक विभाग में बड़े-बड़े अधिकारी बैठे हैं और हजारों रुपए ७ के बड़े-बड़े वेतन ले रहे हैं । लेकिन मुझे दुख के साथ कहना पड़ता है कि उनका दिमाग कार्यालय »\" की मिसिलों और कागजों में लगा रहता है । इस विभाग का काम बहुत ही महत्वपूर्ण है । प्राकृतिक कोप के *“ कारण जो समय-समय पर हमारी फसलों को नुकसान होता है इससे भी अपनी फसलों की रक्षा करने के 3० लिए आवश्यक कदम उठाना इसके जिम्मे है । आज मेरे पास लखनऊ से कुछ लोग आए थे और वे लोग *' बोल रहे थे कि यहाँ दिल्‍ली में इस अबसर पर ठंडी हवा चल रही है और आप यहाँ दरवाजे बंद “\" करके बैठे हैं या आराम से लेटे हैं लेकिन हमारी तो जान खतरे में है । वहाँ ओले गिर रहे हैं और हमारी गेहूँ की 'फसल खतरे में है । अब यह इस विभाग का काम है कि चूँकि हवा में पानी ज्यादा ७ होता है इसलिए फसल के बचाव के लिए उस पर नियंत्रण किया जाए जिससे फसल की हानि न हो । ०९"},{"name":"संख्या 12","text":"अध्यक्ष महोदय, जिस भावना से मैंने यह बिल पेश किया है उसको विरोधी पक्ष के लगभग सभी सदस्यों ने\" एकमत से महसूस किया है कि देश मे बेकारी को जो समस्या है वह एक भयंकर समस्या है “\" और उसके कारण हमारे देश का विकास चाहे वह सामाजिक हो, आर्थिक हो या सांस्कृतिक रुका हुआ है और ऐसी स्थिति में हम आगे बढ़ नहीं सकते हैं । इसी प्रकार से इस परिस्थिति का निर्माण हम पिछले 54 वर्षों * से देख रहे हैं । मंत्री महोदय ने यहाँ पर अभी कहा कि राष्ट्रपति इस काम को नहीं कर सकते हैं *\"९ क्योंकि वह 'डनके अधिकार के बाहर है । आप राज्यों में राज्यपाल-शासन स्थापित करते है जब यह देखते हैं कि किसी राज्य में वहाँ की व्यवस्था, वहाँ का विकास ठीक नहीं हो रहा है । जब किसी ** राज्य में गड़बड़ी फैल रही हो विकास का काम समाप्त हो गया हो और जिम्मेदारी से लोग काम न ** करते हों तो वहाँ पर >राज्यपाल-शासन स्थापित किया जाता है । ऐसे बहुत-से उदाहरण हमारे देश में #प्रौजूद 5\" हैं । उसी प्रकार से हमारे राष्ट्रपति हैं और अगर देश में इस तरह की स्थिति वर्षों तक चले तो “\"\" कोई कारण नहीं है आपात के रूप में राष्ट्रपति इस देश की सुरक्षा के लिए, इस देश की उन्नति के लिए जिम्मेदारी अपने हाथ में न ले सकें । हमारे भाइयों ने बहुत-से उदाहरण दिए हैं कि राज्यों में “' संयुक्त सरकारें नहीं चलीं लेकिन उसके पीछे राजनीतिक हथकंडे थे । अगर कोई राजनीतिक पार्टी जिम्मेदारी से काम नहीं करती ““ तो विधान में यह स्पष्ट है कि राष्ट्रपति शासन अपने हाथ में लें । मैं एक उदाहरण देता हूँ कि संविधान में आदिवासी हरिजनों के उत्था मझता '“ हूँ कि कुछ ऐसे विचार भी उनके सामने प्रस्तुत करूँ जिससे उनकी कठिनाइयाँ कुछ हल हो जाएँ । उदाहरण के रूप में विगत दो वर्षों में लेखा-जोखा कमेटी में बैठने के समय मुझे ऐसा अनुभव हुआ है ?\" कि इस देश में दो, तीन इस प्रकार की ज्रुटियाँ मौजूद हैं जिनको दूर करने के लिए, जिनकी ः' जाँच करने के लिए यदि कोई एक कमेटी या आयोग बिठा दिया जाए तो राष्ट्र को, राष्ट्र की सरकार को, राष्ट्र के विकास कार्यों को और राष्ट्र की रक्षा व्यवस्था के लिए करोड़ों नहीं अरबों की व्यवस्था फौरन हो कली ७ है केवल शासन को जागरूक होकर कुछ कदम उठाने की आवश्यकता अभी कुछ छिपे हुए धन का जिक्र किया ”\" गया । सरकार ने भी समय-समय पर ऐसा आभास दिया है कि इस देश में लगभग 30000 करोड़ रुपए '\" का छिपा धन मौजूद है । स्वयं मैं समझ नहीं पाता हूँ कि जब सरकार ऐसा अनुभव करती है तो इसकी »\" व्यवस्था करने में उसको दिक्कत क्‍या आ रही है । ऐसा मालूम होता है कि कहीं इच्छा शक्ति की कमी *'\" है भारत की इस सरकार ने अपनी शक्ति का ठीक से उपयोग करके उस दुश्मन के दाँत ला किए जिसके है अर ३89 शक्तिशाली 'और इंगलैंड जैसी शक्तियों अटूट सहारा था और *\" जिसको कि उन्होंने किया शी जोर अपन पं सहयोग दिस था नि हमारे विरुद्ध उकसा कर खड़ा"},{"name":"संख्या 22","text":"अध्यक्ष महोदय, मानव संसाधन विकास मंत्रालय की माँगों के संबंध मे बोलने के लिए मैं खड़ा हुआ हूँ । शिक्षा की पद्धति के “” बारे में, उसमे परिवर्तन लाने के बारे में, इस क्षेत्र में हमें जो असफलता हाथ लगी है, उसके बारे में अभी मेरे मित्र ने बहुत कुछ कहा है । दुर्भाग्य कौ बात यह है कि देश मे सभी लोग यह *\" मानते हैं कि शिक्षा में प्रगति नहीं हुई है, शिक्षा पद्धति मे आमूलचूल परिवर्तन नहीं हुए हैं, लेकिन फिर भी इस दिशा में कुछ किया नहीं जाता है । ऐसा प्रतीत होता है कि इस विषय में कुछ भी करने »\" की स्थिति में रा नहीं रहे हैं । स्थिति ज्यों की त्यों चली आ रही है । इतना होने पर भी शिः ् की मद पर होने वाला जो खर्च है और जो उसके लिए धनराशि आबंटित की ! है, वह *\" भी बहुत थोड़ी है । लेकिन उस पर न जाकर मैं आपका यान हलक दिलाना चाहता हूँ कि मर्ज *« बढ़ता ही गया ज्यों-ज्यों दवा की वालो का ही आज चरितार्थ हो रही है । जितने ज्यादा आयोग और समितियाँ बेठी और मा 2०543 पद्धति के बारे में छानबीन की गई डी ह  बात यह है कि *\" देश में सादगी और संपत्ति को उड़ाने के बजाय उसे उत्पादक कार्यों में लगाने का वातावरण बनाना चाहिए। मैं नहीं जानता वित्तमंत्री महोदय इससे कहाँ तक सहमत होंगे, लेकिन आज देश में समाजवाद की चर्चा बहुत होती ?“ है । लोगों का समाजवाद की और देखने का दृष्टिकोण विकृत हो गया है । लोग हमें क्या मिलता है इस ” ओर ज्यादा ध्यान ते हैं । हम कितना खर्च करते हैं इस ओर ध्यान नहीं देते हैं समाजवाद बिना संपत्ति की १७ 322 थे किए और बिना उसके समान वितरण के नहीं आ सकता । हमारा देश कृषि प्रधान देश है ।"},{"name":"संख्या 26","text":"सभापति महोदय, खेती के बाद उद्योग का मा है देश में । जीवन में बड़ा प्रमुख और महत्वपूर्ण स्थान है । “” स्वतंत्रता पा बाद देश बड़े-बड़े और मौलिक उद्‌योग-धंधे खड़े किए गए हैं, जिनकी बहुत आवश्यकता थी उस दिशा में अच्छा प्रयास किया गया है और उसमें बड़ी सफलता भी मिली है । लेकिन जहाँ बड़े-बड़े उद्योग-धंधे खड़े हुए, वहाँ छोटे छोटे उद्योग धंधों की, विशेष रूप से उन उद्‌योग-धंधों की, जो देश में परंपरा “” से चले आ रहे थे बड़ी उपेक्षा हुई बहुत-से उद्योग-धंधे अपने पुराने ढँग से चले आ रहे हैं, उनमें कोई नया परिवर्तन नहीं लाया जा सकता है, उनका कोई विकास नहीं हो सकता है । देश की स्थिति *» को देखते हुए विशेष रूप से ग्रामीण क्षेत्रों में कौन-से नए उद्योग-धंधे खड़े किए जा सकते हैं, इस बारे में कोई अनुसंधान नहीं किया गया है । खादी और ग्रामोद्योग स्थापित किया गया और उसने * खादी और कुछ ग्रामीण उद्योग-धंधों को लिया, लेकिन उसकी भी कुछ सीमाएँ हैं । 'बहुत-से उद्‌योग-धंधे ऐसे हैं, जिनको प्रोत्साहन दिया जाना चाहिए था । लेकिन प्रोत्साहन देना तो दूर रहा, ऐसी नीति अपनाई गई कि उनके काम में बाधा पैदा हुई और उनमें बहुत-से टूट गए । इसका परिणाम यह हुआ है कि ५० एक तरफ तो हमने दिखाने के लिए बड़े-बड़े कल कारखाने खड़े किए हैं, लेकिन दूसरी तरफ बेकारों कौ संख्या बढ़ती गई है । आज यह समस्या एक भीषण रूप में हमारे सामने आई है । यदि हम छोटे-छोटे 'डद्योग- कृषि से संबंधित दूयोग-धंधों को विशेष रूप से कृषि से संबंधित उद्योग धंधों को बड़े-बड़े शहरों में नहीं, दूर-दूर ग्रामीण क्षेत्रों में नहीं फैलाते हैं, तो इसके दो दुष्परिणाम होंगे । एक तो उद्योगों * केंद्रीकरण होगा, दूसरे, शहरों की जनसंख्या बढ़ेगी, जिससे अनेक जटिल समस्याएँ पैदा होंगी । इससे हर एक आदमी को काम नहीं मिलेगा और हमारे जो पुराने उद्योग-धंधे जीवन से संबंधित सामग्रियाँ तैयार है, उन पा प्रभाव पड़ेगा । लेकिन सरकार की ऐसी नीति रही है करते हैं, उन पर बुरा डद्योग-धंधे समाप्त होते जा रहे है जिसका कि उनमें से बहुत-से उद्योग में लगे हुए आदमी बेकार हो रहे हैं माह १७० है कि इस 88 को अधिक प्रोत्साहन देने का प्रयल करे। कि सका हम इस मौके पर सरकार का समः । इस प्रयत्त ए न देशभक्ति की भावनाओं से करते हैं"},{"name":"संख्या 27","text":"् उपाध्यक्ष महोदय, मैं मानती हूँ कि बहुत-से जो हमारे भाई हैं उनकी ओर से शिकायतें आई हैं और » यहाँ बातचीत चलती रहती है कि हम अपने इलाके में सफाई बंद कर देंगे परंतु यह विषय स्वायत्त शासन * संस्था के सहयोग से नहीं हो पा रहा है जैसी कि हमें आशा है और मैं समझती हूँ कि राजनैतिक “ दल स्वास्थ्य के विषय में ध्यान रखते हैं क्योंकि यह मानवता के __ लिए बहुत आवश्यक है और इसमें राजनीति *” का कोई रंग नहीं आना चाहिए, ऐसी मेरी आशा है । मैं अनुरोध करूँगी कि सदस्यों की जो समस्याएँ हैं ''\" उनको ध्यान में रखते हुए दिल्‍ली प्रशासन कोई ऐसी नीति अपनाने की कोशिश करे _ जिससे नगर निगम का '\" यदि कोई काम हो तो उस विषय में हमारा नगर निगम + से एक सहयोगपूर्ण वातावरण पैदा हो मगर इस वातावरण '* में राजनीति न आने _ पाए । हमारे सामने एक उद्देश्य हो कि हमें जनता का काम करना है क्योंकि _ जनता के '* लिए हम चुनकर आए हैं । इसमें पार्टी का कोई प्रश्न नहीं है । दूसरी बात मैं यह कहना चाहता '* हूँ कि अनाथ बच्चों के लिए जो इस बजट में प्रावधान किया गया है कि उनक़े लिए केंद्र बनाए जाएँगे तो मैं समझती हूँ कि इन केंद्रों के साथ-साथ बेसहारा महिलाओं के लिए जो कि समाज से तिरस्कृत :' हैं, ऐसी महिलाओं के लिए जगह-जगह इस प्रकार के केंद्र खुलने चाहिए जहाँ उन्हें रोज़गार सिखाया जाए और साथ \"ही साथ आर्थिक रूप से स्वतंत्र बनाने की तरफ भी प्रयत्न किया जाए । इस विषय में मेरा एक सुझाव है कि जो बच्चे अनाथ हैं, जो बेसहारा महिलाएँ हैं उनकी तरफ हमारी पूरी कोशिश होनी चाहिए कि जो अनाथ बच्चे हैं जो समाज से तिरस्कृत हैं, जिनको अवहेलना की दृष्टि से देखा जाता है उनके लिए केंद्र बनाए जाएँ और उन केंद्रों में वह अधिकारी रखे जाएँ जिनके सर्रक्षण में वह कार्य सीखें, पढ़ें, लिखें । * यदि इसमें बाहर के सदस्य हों तो बे ऐसे होने चाहिए जिनका जीवन सरकारी सेवा में ही बीता हो ' ऐसे योग्य लोगों से सहायता लीजिए । यदि इसमें असामाजिक तत्व घुस गए तो फिर हमारा पैसा ऐसे ही खर्च हो जाएगा और जो नीति हमने बनाई है वह असफल हो जाएगी जिसका परिणाम यह होगा कि हम ड्स कप को कार्य रूप में परिणत नहीं कर सकेंगे । इस बात पर कोई मतभेद नहीं है"},{"name":"संख्या 28","text":"ग्रतिलेखन संख्या - 28 उपाध्यक्ष महोदय, रूस में भारत के जो मानचित्र प्रकाशित हुए है, भारत के कुछ हिस्से को सही तरीके से नहीं “” दिखाया गया है । इसको स हवा भी मानती है और इस विषय पर कोई मतभेद नहीं है । प्रश्न यह है किया किसी देश ने हमारे देश का गलत मानचित्र प्रकाशित किया है, तो एक सर रूप में “\" भारत सरकार का जो कर्त्तव्य है उसने उसको निभाया है या नहीं अगर निभाया है तो किस प्रकार से निभाया है । जब भारत सरकार (के इसमें प्रकाशित उस मानचित्र की ओर दिलाया गया, जिसमें हमारे देश का 83 भाग को गलत ढंग से दिखाया गया था तो उसने 956 में ही, जबकि कि गा भारत और चीन की सीमा का प्रशन पैदा हुआ था, इस बारे में रूस ने विरोध 7 इसके बाद भारत सरकार ने लगातार चार बार रूस सरकार से रा विरोध किया कि हमारे मानचित्र को ठीक से *«७ गे मानचित्र को लेकर यह चर्चा हो रही है, जब उसकी हम (230: तो उसने जून, जुलाई और अगस्त में लगातार तीन पते राजद दे के माध्यम न आर कलर व से अधिकारी अमर बार, अपने राजदूत के माध्यम से, प्यार शोरआकर्मित किया हक सा आए, उनसे बातचीत करके, रूस का बेखाया हे सने इस देश का मानचित्र ठीक नहीं प्रश्न यह है कि जिस मानचित्र बारे में हमें चिंता होनी दिया कम चर्च कर रह है वे भी देश हमारा मानचित्र सही ढैग से कब अगर दुनियाओा \"कई को उसके बारे मे चिंता करनी नहीं दिखाता है तो स्वाभाविक रूप से देश हैं । लेकिन जहाँ तक इस चर्चा का । हम अपने कर्त्तव्य से नहीं चूक सकते करता, अगर वह उन समस्त देशों तन सरल का मानचित्र को गलत ठग से का जिक्र करते और निंदा करते, जिन्होंने हमारे शिकायत है उसके मानचित्र ै उदाहरण के लिए पाकिस्तान को बल्कि अमरीका ने भीगलतदिखान रूस, इराक और मिम्र ने ही नहीं, ताज और मुकुट कहते आए है है जिस कश्मीर को 7० मताक बा है उस इलाके को बिल्कुल 228 'कहते हैं कि वह इस बरी धरम र्ज उत्साहवर्धक नहीं है। *या और कृपा पर छोड़ दिया गया है। वह"},{"name":"संख्या 29","text":"महोदय, मैं दिल्ली के संबंध में भी कुछ कहना चाहता हूँ । अब दिल्‍ली चूँकि केंद्र शासित क्षेत्र है और दिल्ली » को केंद्र शासित क्षेत्र माना गया है तो स्वभावतः दिल्‍ली वालों को यह आशा थी कि केंद्र से शासित होने » से यहाँ पर उन्नति होगी और यहाँ के लोगों को कुछ सुविधा मिलेगी, संतोष प्राप्त होगा, किंतु मैं यह देख “ रहा हूँ और लोगों में भी यह भावना बढ़ती जा रही है कि जब से यह केंद्र शासित क्षेत्र हुआ ४» है, तब से शासन में निरंकुशता आने लगी है और लोगों की ओर ध्यान कम दिया जाने लगा है ।'\" इसलिए मैं यह कहना चाहता हूँ. कि दिल्ली प्रशासन के पुनर्गठन के ऊपर पुनः जोर दिया जाना चाहिए और '* हो सके तो उसके लिए एक समिति बैठा दी जाए और उसके लिए सोचा जाए कि दिल्‍ली का '\" प्रशासन किस तरह का होना चाहिए । मैं चाहता हूँ दिल्‍ली के प्रशासन के संबंध में आप विचार करें । भ्रष्टाचार के '« संबंध में यहाँ बहुत कुछ कहा गया है । मैं पुनः उसको दोहराना नहीं चाहता किंतु इतना अवश्य कहना चाहता ' हूँ कि आज देश में जनता का जो नैत्विक स्तर है वह दिन-प्रतिदिन गिरता जा रहा है । सरकार को यह सोचना चाहिए कि उनका वह नैतिक स्तर किस प्रकार उठाया जाए और किस तरह से लोगों की ”\" भावनाएँ बदली जाएँ, किस तरह से लोगों में अनुशासन रह सके । इसके लिए सोचना अत्यंत आवश्यक है । हम जब :* भ्रष्टाचार की बात कहते हैं तब यह तो सभी मानते हैं कि भ्रष्टाचार है और इसमें कोई दो राय नहीं हैं कि भ्रष्टाचार मौजूद है । छोटे-से अधिकारी से लेकर बड़े अधिकारी तक यह फैला हुआ है । भ्रष्टाचार केवल प्रशासन ः# में है ऐसी बात नहीं है, वरन यह लोगों में भी फैला हुआ है । जब करों की अदायगी का प्रश्न \" आता है तब लोग दो-दो खाते बना लेते हैं और आयकर की चोरी करने का प्रयत्न करते हैं और कर से बचने के लिए भ्रष्टाचार करते हैं । जैसे बगैर दोनों हाथ के ताली नहीं बज सकती ठीक वही बात भ्रष्टाचार के संबंध में लागू होती है । भ्रष्टाचार - के निवारण के लिए जितना अधिकारियों का कर्तव्य है उतना ही कर्तव्य जनता का है । अधिकारियों को तो सतर्क रहना ही चाहिए क्योंकि यह जो संसद है वह क़ानून बनाकर उनके हाथ में दे देती है उसका कार्यान्वयन करने के लिए जनता और नौकरशाही को सहयोग से कार्य करना चाहिए । हे"},{"name":"संख्या 30","tex उनका झुकाव न होने के कारण उन्होंने उसे उस सीमा तक नहीं अपनाया जितनी '« सरकार को आशा थी । श्रीमान आपको मालूम है कि नागपुर कांग्रेस में यह प्रस्ताव पास हुआ है कि सहकारी '*\" खेती कराई जाए । पूरे देश में इस समय इसका जोर चल रहा है और इसको लाने के लिए १० न मालूम इसके कितने रूप रखे गए हैं । यह कहा गया है कि इसके अंदर कोई जोर नहीं है । अभी एक माननीय सदस्य कह रहे थे कि राजनैतिक पार्टी के लोग यहाँ पर सहकारिता के संबंध में कुछ “\" कहते हैं और बाहर किसानों से कुछ और ही कहते हैं । वे किसी से यह भी कहते हैं कि तुम्हारी ः' जमीन छिन जाएगी । मैं यह निवेदन करना चाहता हूँ कि यह जो कहा गया है और किसानों के अंदर जो भावना पैदा होती है वह इस बिल से साफ स्पष्ट होती है कि वह गलत भावना नहीं है । मैं यह जानता हूँ कि जब किसान पार्टी का जोर बढ़ा और किसानों की आवाज ऊँची हुई तो सरकार ने और हमारे नेताओं ने यह कहना शुरू कर दिया कि हम सहकारी खेती को किसानों के ऊपर लादना नहीं चाहते । बल्कि यह *\" तो किसानों की इच्छा पर है । लेकिन इसके साथ ही साथ, एक बात मैं पहले भी निवेदन कर चुका *“ हूँ और फिर भी निवेदन करना चाहता हूँ कि नेताओं का अपना विचार होना चाहिए किसी सभा में जब यह कहा गया कि यह जो सहकारी खेती शुरू की गई है यह तो अंत में सामूहिक खेती को त्तरफ ले जाएगी"},{"name":"संख्या 44","text":"ग्रतिलेखन संख्या - 44 माननीय सभापति महोदय, उन्होंने साफ कह दिया कि अगर सामूहिक खेती होती है तो इसमें भी मुझे कोई आपत्ति »\" नहीं है । मैं यह कहना चाहता हूँ कि इस बिल को देखने से यह साफ स्पष्ट होता है कि उस “” सहकारी समिति के जितने सदस्य होंगे वह अपनी-अपनी जमीन को एक साथ कर लेंगे और अगर समिति से निकालना ““ चाहेंगे तो एक साथ अधिक जमीन उसको नहीं मिल सकती है । इस बिल के संबंध में इस सदन के ४\" सरकारी दल वाले लोगों ने और विरोधी दल के लोगों ने बहुत-सी बातें कही हैं जैसाकि यह बिल है इसको अभी समिति के सामने विचार के लिए जाना है और वहाँ से विचार होने 'के बाद यह *\" इस सदन के सामने फिर से विचार के लिए पेश किया जाएगा तब माननीय सदस्यों को पूरी तरह से यह *\" अधिकार होगा कि जहाँ तक इसमें दी गई बातों का संबंध है उसमें परिवर्तन ला सकते हैं या उसको हटा सकते हैं । कल से जो बातें हो रही हैं वह सब नोट की गई हैं और मैंने बहुत-सी बातों को सुना है । इस समिति में उन सब बातों पर विचार किया जाएगा । बहुत-से माननीय सदस्यों ने इस ““ तरह की बातें कही हैं वह बहुत आवश्यक मालूमे हुई हैं और जैसा कि मैंने कहा है उन पर विचार किया जाएगा जहाँ तक सहकारिता का संबंध है चाहे सरकारी दल वाले माननीय सदस्य हों चाहे विरोधी दल वाले माननीय सदस्य हों सबकी यह माँग है कि जब हम जनता के राज में विश्वास करते हैं और अपने यहाँ जनता का राज स्थापित कर लिया है और जबकि देश में गरीबी है और उसका गलत लाभ भी उठाया जाता है तब सहकारिता की बहुत आवश्यकता है । इसको रोकने की आवश्यकता है, यह सभी लोगों की राय '“ है । जहाँ तक इस सहकारी बिल का संबंध है बहुत-से माननीय सदस्यों ने बहुत-सी बातें इसके संबंध 7» में कही हैं मैं सब बातों का विवरण में तो उत्तर नहीं दे सकता हूँ लेकिन मैं थोड़े में विशेष बातों का उत्तर देने का प्रयल करूँगा । जैसा मैंने अभी कहा, जब हम ने अपने यहाँ जनता का “ राज स्थापित किया है तो हमें अपने समाज के ढाँचे को बदलना पड़ेगा । हमारे यहाँ गरीबी और अमीरी चली आती 7० है, हमारे देश में एक गहरी खाई चली आती हैं और आज भी समाज में गलत लाभ उठाया जाता है ।"},{"name":"संख्या 45","text":"; सभापति महोदय, हमारे महत्व है इसका अनुमान इसी से ६2000 मंत्रालय और गृहमंत्री का कितना मंत्रालय का भार सरदार पटेल ने स्वयं अप कण है कि स्वतंत्र भारत में गृह साहस, उनका उत्साह और उनकी बुद्धि तीनों लटक आदर्श का काम “ कर सकती हैं । परंतु दुर्भाग्य हु हमारेगह सबलय के लिए बातों में कुछ कमी आती हुई दिखाई दे व पटलात इन तीनों मैं कहना चाहता हूँ। 962 में जब हमारे देश पर चीन 22778, 4 नवंबर, 962 को हम सब ने इसी सदन में तकाइसलाहुआ वी किया था, जिसके /» शब्द थे - भारत की भूमि खड़े होकर एक प्रस्ताव पास करा होते वब तक जब तक हम शत्रु से स्वतंत्र नहीं हमारा यह संघर्ष बराबर '“ जारी रहेगा, भले ही वह कितना ही लंबा क्यों न हो । लेकिन कुछ दिन बाद आगे चलकर हमने '' राष्ट्रीय एकता सप्ताह या दिवस मनाना शुरू किया तो हमने उस प्रतिज्ञा को कुछ दूसरे शब्दों में बदल दिया । '\" उस प्रतिज्ञा के शब्द थे मैं अपने देशवासियों के संकल्प को दोहराता हूँ कि मैं अपने देश की स्वतंत्रता तथा “” एकता की रक्षा करूँगा चाहे इसके लिए कितना ही कड़ा और लंबा संघर्ष क्यों न करना पड़े । मैं राष्ट्रीय 7९ सकता तथा बल के लिए तन-मन से काम करने की शपथ लेता हूँ । लेकिन इस बार राष्ट्रीय एकता सप्ताह “” के सिलसिले में एक छोटा-सा प्रकाशन भारत सरकार की ओर से प्रकाशित हुआ है । इस प्रकाशन में स्वयं “ इन्होंने लिखा ; कि 962 में चीन दूवारा आक्रमण के बाद शपथ की भाषा में थोड़ा परिवर्तन कर ! दिया गया है और जो शब्द बदल दिए गए हैं उनको भी मैं सदन की जानकारी के लिए सुनाना चाहता हू मैं प्रतिज्ञा करता हूँ कि मैं कभी हिंसा का प्रयोग नहीं करूँगा और मेरा विश्वास है कि धर्म, भाषा, प्रांत संबंधी तथा अन्य सभी राजनीतिक और आर्थिक विवादों का शांतिपूर्वक और संवैधानिक तरीकों दूबारा हल किया जाना चाहिए ४ ५ अब मैं आपके माध्यम से जानना चाहता हूँ कि 962 में संसद ने जो निर्णय किया था, क्या भारत *“ सरकार अपने उस निर्णय से हट रही है ? अगर सरकार अपने निर्णय से हट रही है तो यह जो सरकारी »/ प्रकारान आया है शक दूवारा 962 की शपथ में परिवर्तन किया गया है, इसका आधार क्या"},{"name":"संख्या 46","text":"सभापति महोदय, हम यह समझे कि किसी तरह का चीन का दबाव इस सरकार पर पड़ रहा है, जिसने ४\" सरकार के सोचने के ढंग में परिवर्तन कर दिया है । मैं गृहमंत्री से विशेष रूप से यह कहना चाहता “ हूँ कि सरदार पटेल जिस जगह पर बैठे थे आज आप उसी जगह पर बैठे हुए हैं और राष्ट्र की आंतरिक सुरक्षा का भार आपके कंधों पर है । इस प्रकार के प्रकाशन सरकार की दुर्बलता के सूचक हैं । *\" दूसरी बात मैं सांप्रदायिक दंगों के संबंध में कहना चाहता हू । इन सांप्रदायिक दंगों से निश्चय ही हमारे देश की जो आंतरिक स्थिति है, वह बिगड़ती जा रही है । दुनिया के दूसरे देशों में हमारा देश बदनाम हो रहा है । »\" सबसे पहले मैं गृहमंत्री महोदय से कहना चाहता हूँ कि अब जितने सांप्रदायिक दंगे हमारे देश में *' स्वतंत्रता के बाद हुए, गृह मंत्रालय इस बात की जानकारी ले कि इनका प्रारंभ कहाँ से होता है और *” कौन उनको प्रारंभ करता है । अगर इस देश का बहुमत उनको प्रारंभ करता है तब तो मेरा कहना *« यह है कि बड़ी कड़ाई के साथ उन पर काबू किया जाना चाहिए । लेकिन अगर दूसरे लोगों की तरफ से «\" प्रारंभ होता है तो मैं समझता हूँ कि उनके अंदर इतनी हिम्मत नहीं है । जब वे जानते हैं कि इसका परिणाम यह होगा कि हमको और हमारे दूसरे सहयोगियों को चोट लग सकती है, फिर भी वे *\" इसका प्रारंभ करे तो मुझे ऐसा लगता है कि कोई तीसरी शक्ति अवश्य है जो आज भी पाँच दशकों ७० के पश्चात हमारे सामाजिक जीवन को दुखी बनाना चाहती है । उदाहरण के लिए मैं एक ही बात कहना चाहता हूँ ७० गृह मंत्रालय जब अपनी वार्षिक रिपोर्ट प्रकाशित करता था तब रस 25222 था कि हमररे देश में दुनिया '\" के किस-किस देश के कितने नागरिक रह रहे हैं । लेकिन अब शायद जानबूझकर गृह मंत्रालय ने अपनी '\" कमी को दे के के लिए इन आँकड़ो को देना बंद कर दिया है । लेकिन फिर भी प्रश्नों के 5 उत्तर में 23354; 5 रस शर के आँकड़े सामने आ जाते हैं। अभी हाल में जब पासपोर्ट लेकर रह हर] 3.8 पाकिस़ान के कितने नागरिक ऐसे हैं जो पासपोर्ट के आधार पर भारत में रह रहे पान अलावा गे? कि जस सं 27 हजार है है रहे पाकिस्तानी नागरिकों की संख्या लगभा"},{"name":"संख्या 47","text":"अध्यक्ष महोदय, मैं आप की आज्ञा से अपना बिल सदन के सामने ' विचार के लिए रखना चाहता हूँ ! मैंने इस ”' बिल में एक बात कही है कि जो विदेशी धन गलत तरीके से हमारे देश में आता है, उसके /' ऊपर कोई कड़ी निगरानी होनी चाहिए । मैंने इस बिल में यह भी कहा है कि कोई भी पार्टी, कोई भी « संस्था, कोई भी आदमी अगर विदेशों से धन लेता है तो उस की सूचना तुरंत सरकार को दी जानी चाहिए । \" उस आदमी या उस संस्था के लिए यह भी अनिवार्य हो कि उस राशि का पूरी तरह से लेखा-जोखा रखे '' और एक वर्ष के बाद उस राशि के खर्च का पूरा लेखा-जोखा सरकार के पास भेजे ताकि सरकार को मालूम “” हो सके कि कितना धन विदेशों से आया तथा वह किस प्रकार खर्च हुआ। इस सदन में इस संबंध में '\" अनेक बार बहस हो चुकी है । स्वयं गृहमंत्री जी ने यहाँ कहा था कि वह इसके संबंध में “\" एक बिल सदन में लाएँगे, लेकिन मुझे बड़े दुख के साथ कहना पड़ता है कि ढाई वर्ष बीत जाने के '\" बाद भी आज तक वह बिल सदन में नहीं आया । आज अगर कोई यह कहे कि मैंने यह पैसा अमरीका 2\" से लिया है या चीन से लिया है या अन्य देश से लिया है, तो उसके ऊपर आज कोई भी 2 मुकदमा नहीं चल सकता । आज हमारे देश में कोई कानून ऐसा नहीं है जो इस चीज पर प्रतिबंध लगा # सकता हो आज तीन बड़े-बड़े देश हैं जहाँ से हमारे देश में पैसा आता है । कुछ पैसा अमरीका से आता है, कुछ चीन से आता है और कुछ पाकिस्तान से आता है और छुटपुट अन्य देशों से इस प्रकार /\" का धन हमारे देश में कितना 'फैला है, अगर इसकी ओर आप ध्यान देंगे तो  उन्हें स्वयं कुछ-न-कुछ करना होगा, विशेष रूप में समाज कल्याण 5“ के क्षेत्र में केवल सरकारी कार्रवाई पर्याप्त नहीं हुआ करती जनता और सरकार दोनों को मिलकर एक दूसरे #७ का हाथ मजबूत करना चाहिए और पूरे अधिकतम सहयोग से काम करना चाहिए। अपने कार्यक्रमों को पूरा करने के अतिरिक्त समाज कल्याण संगठनों को भी अंधविरवासों से लड़ने और लोगों में तर्कसंगत दृष्टिकोण अपनाने की ओर ध्यान देना चाहिए । समाज सेवी संस्थाएँ दैनिक जीवन में वैज्ञानिक चिंतन को लोकप्रिय बनाने के लिए बहुत- कुछ कर “* सकती हैं । जाति या समाज के नाते हम लोगों को, स्वास्थ्य और शिक्षा की ओर कहीं अधिक ध्यान देने की आवश्यकता हैं । इसके लिए आवश्यक है सही वातावरण, आदतें और सामाजिक दृष्टि, ताकि हमें अपने व अपने आसपास के लिए उचित सफाई, बेहतर पोषाहार और स्वास्थ्य की सुविधाएँ प्राप्त हो सकें । सफाई के बारे में हमारा ४» कुछ अजीब दृष्टिकोण है हम अपने घर की तो सफाई करते हैं, पर कड़ा-करकट दरवाजे पर ही डाल देते हैं हम स्वयं तो रोज नहाते हैं, पर हमारी सड़क या गली गंदी है जिसकी तनिक भी चिंता नहीं 7० करते । बड़े शहरों में और उन इलाकों में भी जहाँ पढ़े-लिखे और गा रहते तक र खाते-पीते लोग रहते हैं, कड़ा-करकट “जमा रहता है और कोई इसकी परवाह नहीं 'करता से यह पी 40505 और समाज कल्याण ?« संगठनों का वाई है समा कल्याण संस्था: लिए परम आवश्यक है कि वे के लिए “\"” आपसी तालमेल समूचे क्षेत्र के सुधार बहुत आवश्यक है जिससे हर साध सती आछसी वालतेल, भी"},{"name":"संख्या 61","text":"[_ प्रतिलेखनसंख्या -6_ै]_] संख्या - 6] , सभापति महोदय, मैं वित्त विधेयक का समर्थन करने के लिए खड़ा हुआ हूँ । उत्तर प्रदेश की जनसंख्या बहुत बड़ी है ?\" और उसका क्षेत्र भी बहुत बड़ा है । इसलिए यह आवश्यक है कि उत्तर प्रदेश को उसकी जनसंख्या ४ और क्षेत्र के अनुसार विकास योजनाओं के लिए केंद्र से आर्थिक सहायता दी जाए । इसके बिना उत्तर प्रदेश की \" उन्नति होना असंभव है । भारत का किसान इस देश का जीवन है । किसान पर ही सारी खुशहाली और उन्नति * निर्भर करती है । अगर उसका जीवन 48०७४ , तो देश भी समृद्ध होगा इसलिए यह आवश्यक '\" है कि किसान के दैनिक जीवन की चीजें सस्ती हों और उसके खाद और कृषि यंत्र आदि सस्ते दामों !' पर मिल जाएँ । पानी के लिए उसको भगवान की तरफ न देखना पड़े बल्कि उसको सिंचाई के विषय /* में आत्मनिर्भर बनाया जाए । जब तक किसान को पूरी सुविधाएँ नहीं दी जाएँगी, तब तक देश उन्नति नहीं कर '“\" सकता है । मेरा यह भी निवेदन है कि जिन परिवारों में खेती का काम होता है उन परिवारों के बच्चों / को कृषि विभाग में नौकरी देनी चाहिए । यह मैं आवश्यक समझता हूँ क्योंकि उन्हें कृषि के बारे में व्यावहारिक “' ज्ञान होता है । सभापति महोदय, वर्तमान सरकार ने समाजवाद की नीति अपनाई है और सरकार समाजवाद की तरफ कदम बड़ा रही है। लेकिन हम देखते हैं कि बड़े और छोटे सरकारी कर्मचारियों के वेतन में बड़ा फर्क है । कुछ अधिकारियों *\" का वेतन हजारों में है, जबकि चपरासी आदि छोटे सरकारी कर्मचारियों को सिर्फ 5000 या 7000 रुपए मिलते हैं आज वेतन में यह जो फर्क है वह समाप्त होना चाहिए। मेरा निवेदन है कि सरकारी कर्मचारियों के वेतन में ४\" बहुत ज्यादा का अंतर नहीं होना चाहिए। तभी हम कह सकते हैँ कि हिंदुस्तान में समाजवाद है । किसान की रोजाना '\" के उपयोग की चीजें बहुत महँगी होती जा रही हैं । देश में महँगाई दिन-प्रतिदिन बढ़ रही है और »' सारे देश में बेचैनी फैली हुई है। इस बढ़ती हुई महँगाई को रोकना आवश्यक है, नहीं तो देश में क्रांति “\" हो जाएगी । आप इस सच्चाई को छिपा नहीं सकते कि आज देश में चारों तरफ बड़ा असंतोष है और लोग # बड़ी आशा से हमारी तरफ देख रहे हैं । लेकिन महँगाई हमारे नियंत्रण से बाहर होती चली जा रही है । देश में काले-धन की बड़ी चर्चा की जाती है । उसको निकालने के लिए बड़े प्रयत्न किए गए हैं"},{"name":"संख्या 62","text":"सभापति महोदय, सरकार इस स्थिति में नहीं आई है कि वह कह सके कि देश में काला धन नहीं है । काले धन को निकालने के और प्रयत्न होने चाहिए । लेकिन उसके साथ-साथ इस दिशा में भी कदम उठाए जाएँ कि *“ ऐसे कामों पर रोक लगाई जाए जिससे लोगों को काला धन कमाने का अवसर ही न मिले। आज हमारे देश के विभिन्‍न प्रदेशों और क्षेत्रों की स्थिति में बड़ा अंतर है । इस अंतर को समाप्त किया जाना चाहिए । मुझे आशा है कि वित्तमंत्री महोदय मेरे इन सुझावों पर अवश्य ध्यान देंगे । कल मैं वित्तमंत्री जी को बता रहा था कि आप एक तरफ से नए-नए कर लगाकर खजाने को भरने की कोशिश कर रहे हैं और दूसरी तरफ आपके विभाग उस खजाने में छेद कर रुपया निकाल रहे है । इस तरफ उनका ध्यान जाना चाहिए । मैंने इस संबंध में एक उदाहरण दिया था कि एक लंबी-चौड़ी सड़क पर एक ही तरह *” का काम होने वाला था । एक ठेकेदार ने 4 लाख रुपए प्रति मील और दूसरे ठेकेदार ने लाख रुपए प्रति मील के हिसाब से रुपया माँगा । जब मंत्री महोदय के सामने यह चीज लाई गई तो इस बात की “ जाँच हुई जिसमें कुछ करोड़ रुपयों की बचत हुई है । अगर सब मामलों की जाँच हो जाती तो कई करोड़ रुपयों की बचत हो सकती थी । जैसा कल मैंने वित्त मंत्री जी से कहा उन्होंने दो करोड़ रुपए की \"' छूट करों में देकर हम पर अहसान लाद दिया । लेकिन मैं तो आपका कई करोड़ रुपयों का लाभ करा “» रहा हूँ । आप इसकी जाँच कराइए और देखिए कि क॑सी लूट हो रहो है । इतना ही नहीं, इसका प्रभाव दूसरे विभागों पर भी पड़ रहा है । वहाँ पर जो दूसरे विभाग काम कर रहे हैं, उनकी दरें भी बढ़ रही है या दरें बढ़ने ४» सरी करंगा या दर काम कम लागत में नहीं हो सकता । इसलिए या तो वह बढ़वाएगा। अगर एक सड़क पर ऐसा होता है तो वहाँ जो दूसरे काम चलते हैं उनमें भी ऐसा ही होता है। ठेकेदार आपके विभागों के साथ मिलकर दर बढ़ाते हैं । मैं भ्रष्टाचार की बात उसको * . आप बंद कर सकते है और न मे बात \"« नहीं कहता हूँ बंद कर सकता हूँ और न लोग"},{"name":"संख्या 63","text":"अध्यक्ष महोदय, मैं कल कह रहा था कि वित्तमंत्री जी ने जिस संदर्भ में यह बजट प्रस्तुत किया है और जिन परिस्थितियों की पृष्ठभूमि में वित्तमंत्री , का भार संभाला है, उस दृष्टिकोण से यदि इस बजट को » देखें तो हम इस चरिणाम पर पहुँचेंगे कि वित्तमंत्री जी ने निश्चित तौर पर ऐसा काम किया है जिसके लिए वे धन्यवाद के पात्र हैं । उन्होंने देश की अर्थव्यवस्था को सुधारने के भार को लेकर * उसमें सफलता प्राप्त करके देश की बिगड़ती हुई आर्थिक दशा को सुधारा । पिछले वर्ष देश का उत्पादन बढ़ा है, उद्योगों में सुधार हुआ है, क़ीमतों में सुधार आया है, हमारा आयात कम हुआ है और निर्यात बढ़ा है । इस !» तरह से देश में एक नई आशा और विश्वास पैदा हुआ है । इस वर्ष के बजट दूवारा भी उन्होंने '\" पिछले वर्ष के कार्यक्रम को जारी रखने की कोशिश करने का प्रयास किया है । मुझे इसमें कोई संदेह नहीं '« है कि इसमें भी उनको सफलता मिलेगी । उन्होंने देश के आयात-निर्यात के बारे में जो कदम उठाए हैं उनसे निश्चय ही हमारे विदेशी व्यापार का संतुलन सुधरेगा, यह निश्चय के साथ कहा जा सकता है । मैं वित्तमंत्री के लक्ष्यों व कर-नीति का आम तौर पर स्वागत करता हूँ । यद्यपि मैं मानता हूँ कि इस कर व्यवस्था के दूवारा मध्य वर्ग पर बोझा पड़ेगा । परंतु इस देश में हमें पंचवर्षीय योजनाओं को जारी रखना है, इसलिए उस संदर्भ में हमें आर्थिक साधन जुटाने पड़ेंगे, और ऐसी दशा में जो लोग इस देश में ऐसी?\" स्थिति में हैं जो कष्ट उठाकर के भी कुछ दे सकते हैं, उनको देश के लिए देना ही पड़ेगा । इसलिए वित्तमंत्री जी के इन कदमों का भी मैं स्वागत करता हूँ परंतु साथ ही साथ में नम्रतापूर्वक यह अवश्य कहना चाहता हूँ कि वित्तमंत्री महोदय ने किसानों पर जो भी नए कर लगाए हैं, »\" उनके ऊपर वे फिर सोचें । मेरी मान्यता के अनुसार वित्तमंत्री दूवारा खाद पर जो कर लगाया गया है, जो शुल्क लगाया गया है, वह एक ऐसा कार्य है जिससे इस देश का विकास रुकने वाला है । /“ उन्होंने अपने बजट भाषण की भूमिका में कृषि संबंधी कच्चे माल के उत्पादन के लिए पूँजी लगाने कौ आवश्यकता »\" पर जोर दिया है । उनको स्वयं की यह मान्यता है कि कृषि का उत्पादन बढ़ाना बहुत आवश्यक है ।"},{"name":"संख्या 64","text":"अध्यक्ष महोदय, उसके लिए सब कुछ करना है तो फिर कृषि उतारा का जो मूल आधार है, उस खाद और पानी की जो व्यवस्था है जब उस पर ही कर लगाया जाता है तो मेरे मन में आता है कि कहीं वित्तमंत्री महोदय अपनी ही बात को, अपने ही सिद्धांतों के दवाया तो काट नहीं रहें हैं “ मैं कहना चाहता हूँ कि हमारे देश में अभी भी चौथाई भूमि/से ज्यादा सिंचित भूमि नहीं है। इस देश *\" की जितनी कृषि योग्य भूमि है उसको चौथाई से भी कम हिस्सा ऐसा है जो सिंचित भूमि के नाम »\" से पुकारा जा सकता है । मेरी राय में अब समय आ गया है जबकि पिछले दो तीन-वर्षों की »” नीति पर फिर विचार किया जाए और एक मात्रा में घाटे के बजट का सहारा लेकर ही सही आर्थिक तथा सामाजिक विकास योजनाओं की गति को बहुत बढ़ा दिया जाए । इस मामले मैं मैं समझती हूँ कि तुरंत कार्यवाही होनी “ चाहिए ताकि आज जनसाधारण में जो अंसतोष उभर रहा है वह हानिकर दिशाओं में न चलने पाए । आज ** के राजनीतिक वातावरण की दृष्टि से भी मैं कहना चाहती हूँ कि विकास की गति - को बढ़ाने की आवश्यकता सर्वोपरि “” है । जहाँ तक कि नए बजट के अंतर्गत कर-नीति का संबंध है, अच्छा होता यदि मिट्टी के तेल जैसी “* वस्तुओं पर अतिरिक्त कर न लगाया जाता । मेरी राय में इस प्रकार के करों से बचना ही उचित है, परंतु वस्तुस्थिति कुछ ऐसी लगती है कि प्राय: गरीबों पर करों का भार लादे बिना सरकार की गाड़ी आगे *“ बढ़ ही नहीं सकती । एक नया कर जिसे पहली बार वित्तमंत्री ने लगाने की ठांनी है वह कृषि संपत्ति संबंधी कर है । अब से पहले कुछ राज्यों में कृषि संबंधी आयकर लगाया गया था, परंतु '” उसके प्रशासन तथा वसूली आदि में इतनी कठिनाइयाँ आईं कि राज्य सरकारों को अपनी नीति प ग है कि जहाँ करोड़ों अनपढ़ तथा गाँवों में बसने जाल बदलनी पड़ी । बात यह रखने और रिपोर्ट भेजने की 48९ किसानों पर हिसाब-किताब सफल नहीं हो सकता । उल्टे उसके का जी.है, तह देखा को जाते हैं। और फिर वे लोग सके कारण लाखों लोग कई प्रकार \"“ से सता पड़ेगी हे सरकार से नाराज हो जाते हैं । इसलिए पहले देख लागू और कितना रुपया कर के रूप में बसूल होगा । ९ वाला"},{"name":"संख्या 65","text":"अध्यक्ष महोदय, सूचना मंत्रालय एक के संबंध में यह कहा जा सकता है कि ” बहुत 3 का इसके कामों में सामान्य रूप से यह देखा गया है कि सभी स्थानों 'परप्रगि हुई है । जहाँ -जहाँ कुछ कमजोरियाँ हैं, उन को सुधारा जा सकता है । इसलिए सबसे पहले “ मैं आकाशवाणी के संबंध में कुछ कहना चाहता हूँ । यह बात सच है कि आकाशवाणी ने परिस्थितियों के अनुकूल अपने ४ को परिवर्तित किया है । जब हमारे देश पर संकट आया तो इस विभाग ने डटकर उसका सामना किया और '\" परिस्थितियों के अनुसार अपने प्रसारणों को बढ़ाया, लेकिन मुझे दुखके साथ कहना पड़ता है कि इसको भाषा नीति '\" में अभी तक कोई परिवर्तन नहीं आ पाया है । इस मंत्रालय का एक महत्वपूर्ण विभाग पत्र-सूचना कार्यालय है, जिसके » द्वारा सभी सरकारी सूचनाएँ अखबारों के दूवारा जनता तक पहुँचती हैं। अभी तक हमारे इस मंत्रालय का यह दृष्टिकोण रहा '* है कि इस देश की भाषा अंग्रेजी है और सब काम अंग्रेजी भाषा के माध्यम से होना चाहिए यही कारण “है कि इस्॑षिभाग से जो सूचनाएँ प्रसारित होती हैं, उनमें से अधिकांश अंग्रेजी में ही प्रसारित होती हैं, जिसके “'” कारण देश भर में हमारी सरकार की बातें जनता तक नहीं पहुँच पाती । मैं अपनी इस बात की पुष्टि के ”” लिए इसी मंत्रालय दूवारा प्रकाशित पुस्तिका में दिए गए आँकड़ों को प्रस्तुत करना चाहता हूं। आप इन आँकड़ों को देखें »\" तो आप को ज्ञात होगा कि अधिक प्रकाशन अंग्रेजी में हुए हैं। हिंदी या अन्य क्षेत्रीय भाषाओं के प्रकाशनों की ““ संख्या बहुत कम है, जबकि इस देश में अंग्रेजी जानने वालों की संख्या दो प्रतिशत से अधिक नहीं है । * अन्य भाषाओं के जानने वालों की संख्या इस देश में 84 करोड़ है । इस दृष्टि से आवश्यकता इस बात की है कि हम अपना सारा काम अपनी भाषाओं के मध्य से करे । अभी कई माननीय सदस्यों ने अपने विचार व्यक्त कप ककल कि 965 से हमारे देश की मुख्य भाषा हिंदी हो गई है और री शव सह-भाषा के रूप में है, लेकिन फिर भी अधिकांश काम आज सशहिंदी के ही होता है । मैं चाहता हूँ कि /“” आप ऐसे कदम उठा: (88 हैक हमें दिए +ध्यम के द्वारा यह कार्य सूषाऊ रूप से चलने लग” हिंदी विभाग में 'ए हैं, उनमें बताया गया हे कि पत्र-सूचना कार्यालय अपर्याप्त कर्मचारी हैं"},{"name":"संख्या 66","text":"अध्यक्ष महोदय, मैं मंत्री महोदय को बतलाना चाहता हूँ कि कुछ वर्ष पूर्व इस विभाग में अपर्याप्त कर्मचारी थे । इस दृष्टि *\" से इस विभाग में हिंदी के काम में कोई प्रगति नहीं हुईं । अध्यक्ष महोदय, आपके लोक सभा सचिवालय में हिंदी के काम में काफी प्रगति हुई है। इस समय लोकसभा की कार्यवाही दोनों भाषाओं में चल रही है । लेकिन अगर इस काम में हमारा सूचना मंत्रालय अपनी भाषा नीति के कारण पिछड़ा रहा, तो यह बड़े दुख की बात होगी। खादूय तथा कृषि मंत्रालय की माँगों पर बोलते हुए मुझे याद आता है कि इसे जितना भी महत्व आज तक दिया गया है और जितना महत्व आज दिया जा रहा है, वह बहुत कम है । अभी अंतर्राष्ट्रीय ?” व्यापार पर बोलते हुए व्यापार मंत्री ने बताया था कि निर्यात की आमदनी में कृषि का कितना महत्वपूर्ण योगदान रहा *\" है । उन्होंने बताया था कि 70 प्रतिशत निर्यात कृषि की वस्तुओं का हो रहा है और उसी के दूबारा हमें इतनी आमदनी हो रही है । इस दृष्टि से कृषि का महत्व और भी ज्यादा बढ़ जाता है । उन्होंने *\" यह भी बताया था कि यदि कृषि उत्पादन केवल 5 प्रतिशत और बढ़ जाए तो निर्यात से हम एक सौ करोड़ रुपए के लगभग अपनी आमदनी को और ज्यादा बढ़ा सकते हैं । इतना महत्व इसका होने के बावजूद भी ४\" मुझे बड़ा खेद है और सचमुच यह बड़े दुख को बात है कि आप कृषि के ऊपर जिसमें सौ करोड़ “\" रुपया कमाने को क्षमता है, एक करोड़ रुपया भी खर्च करने के लिए तैयार नहीं हैं । मैं तो यहाँ तक *“ कहँगा कि जिसे हम औद्योगिक उत्पादन मानते हैं, उस प्रकार-का उत्पादन आज भी हमार समझना »\" और दृढ़ निश्चय के साथ आगे बढ़ना होता है, चाहे रुकावटें कितनी ही बड़ी क्‍यों न हों, कठिनाइयाँ कैसी भी ''\" क्यों न हों सरकार , का यही संकल्प है । सार्वजनिक क्षेत्र को बहुत महत्वपूर्ण योगदान करना है । उसे यह काम - अपनी *» उपलब्धियों दूबारा ही नहीं, बल्कि का की भागीदारी को भावना को अनुभव करते हुए करना है । मैं जानती हूँ कि '\" आज यह भावना सभी श्रमिकों में नहीं है । मुझे यह भी पता है कि इसके लिए हमेशा उन्हें ही '\" दोषी नहीं ठहराया जा सकता । हमने प्रयास ही नहीं किया है कि उन्हें ऐसा अत सद होता रहे । मैं जानती हूँ कि प्रायः जो महू किसी बाँध के निर्माण में लगे हैं, उन्हें / \"ही नहीं होता कि बाँध होता क्या है ।"},{"name":"संख्या 68","text":"महोदय, हमने ऐसा प्रयास ही नहीं किया कि किसी अगवा पक ऐसा संयुक्त उद्यम माना जाए जिसमें उसके निर्माता, 426०४ व वाले अन्य मजदूरों, वैज्ञानिकों, प्रबंधकों तथा अन्य संबद्ध लोगों को भागीदारी का अनुभव हो । *\" हमने समस्याओं को पुराने कोण से ही देखा है और लोगों को अलग-अलग खानों में बाँट दिया है । इसलिए ये झूठे 838५ 8 समाप्त होने चाहिए । हमारे समाज में ऐसे अनेक विभाजन हैं । शायद वे सभी समाजों में «७ होते हैं । लेकिन हमारे यहाँ वे सामान्य से कुछ ज्यादा ही हैं । ये धर्म केआधार पर, जातियों के आधार पर, भाषा और क्षेत्र के आधार पर पाए जाते हैं । एक व्यक्ति और एक वर्ग को दूसरों से अलग »\" करने वाली अनेक तरह की दीवारें हैं और इन सब विभाजनों से हमारा राष्ट्र कमजोर हुआ है । स्वतंत्रता आंदोलन के दौरान इन विभाजनों का इस्तेमाल हमारी एकता को तोड़ने के लिए किया जाता था। आज भी इन्हें उन लोगों को कमजोर बनाने के लिए काम में लाया जाता है जो एक होकर खड़े होना चाहते हैं, जो भिन्न-भिन्न जातियों और धर्मों के होते हुए भी एक ही उद्देश्य से प्रेरित हैं । हमें यह सावधानी रखनी होगी कि ऐसे लोगों ५० के समूह को कोई भी कमजोर न कर सके । हमें ऐसे वर्गों का और विस्तार करने कौ कोशिश करनी चाहिए «” जिससे उनके अंतर्गत हमारे और भी अधिक ऐसे लोग आते जाएँ जो एक विशेष उद्देश्य को पूरा करने के लिए कृतसंकल्प हों, क्योंकि यही देश के हित में है, इसी से देश मजबूत बनेगा, देशवासी मजबूत बनेंगे जिनके अंतर्गत कौई एक वर्ग ही नहीं है, बल्कि सभी वर्गों के लोग हैं । इसलिए संपूर्ण शिक्षा का,अ रहने से निरुत्साह पैदा होता है और मनोबल गिरता है । '» हमें उन औज़ारों को ही कुंठित नहीं कर देना चाहिए जिनसे हमें काम लेना है । देश और विदेश में हमें “\" काम तो करना ही है । हम अच्छी तरह जानते हैं कि पाकिस्तान के शासकों को दी गई हर सहायता बंगलादेश के निर्दोष लोगों के विरुद्ध इस्तेमाल की जाएगी । इस अवसर पर हमारे प्रतिनिधियों ने परिश्रम से बहुत अच्छा '* काम किया है । प्रस्तुत परिस्थितियों में वे जितने प्रभावी हो सकते थे, हुए हैं । कुछ सरकारों के विचार निश्चित हैं ' और यदि उनमें सहानुभूति भी पैदा की जाए, तो भी बे इस प्रकार के मामले में कोई स्पष्ट बात कहने “' को तैयार नहीं होंगे । मैं कहना चाहूँगी कि हमारी उन सेवाओं ने, जो वर्तमान स्थिति से निपटने में जुटी है, साहस और समर्पण का परिचय दिया है । यदि कुछ माननीय <\" सदस्यों को गाली देकर और सरकार पर साहस, दिशा और यहाँ तक कि समझ की कमी का आरोप लगाकर »\" कुछ संतोष मिलता डै, तो मैं उन्हें इससे वंचित नहीं करना चाहती कुछ सदस्यों के लिए हिम्मत का अर्थ गले की ताकत और भावुकता की भाषा है । काश कि जिंदगी इतनी ही सरल होती । इस सरकार में बहुत-से ”\" दोष हो सकते हैं, लेकिन उसमें साहस की कमी नहीं है, न ही यह आवश्यकता के अनुसार जोखिम उठाने से » डरती है । जैसा मैं बहुत बार कह चुकी हूँ, हम इस स्थिति या किसी भी स्थिति के केवल कानूनी पहलू की चिंता नहीं करते हम चिंता करते हैं केबल एक ही बात की और वह है हमारे राष्ट्रीय हित, सुरक्षा '\" और स्वाभाविक रूप से बंगलादेश के बहादुर लोगों की सुरक्षा इसी कारण से शांति से काम करने का"},{"name":"संख्या 76","text":"महोदय, 'मान्यता' शब्द की हर तरफ से माँग आई है, मानो कि मान्यता देने भर से ही वे बहुत-सी कठिनाइयाँ हल हो जाएँगी, जो अगलाबिर लोगों के सामने हैं, हमारे देश के सामने हैं और विशेषकर हमारे सीमांत राज्यों अर्थात पश्चिम बंगाल, असम, त्रिपुरा और मेघालय के समक्ष हैं । हमने इस प्रश्न के हर पक्ष पर बड़ी गहराई से सोच-विचार किया है । जैसाकि मेरे साथी ने बताया है, इसकी हम निरंतर समीक्षा करते रहते हैं । हम इसकी प्रतीक्षा नहीं करते कि दूसरे देश इस विषय में क्या करते हैं । इस बारे *\" में या अन्य मामलों के बारे में हम जो-कुछ भी निर्णय करेंगे, वह स्थिति के हमारे अपने ही स्वतंत्र *» मूल्यांकन के अनुसार और इस बात को ध्यान में रखकर होगा कि हमारे हित व्यापक अर्थ में किस *» तरह पूरे होते हैं । कल मैं अपनी वर्तमान कठिनाइयों में से संभावित खतरों और बोझों के बारे में जानबूझकर *“ बहुत संयत भाषा में बोली थी । वह इस कारण नहीं कि मैं बोझों या खतरों से आज या कभी डरी ४ हूँ, बल्कि इस कारण कि मैं चाहती हूँ कि माननीय सदस्य इन सब विषयों पर गहराई से विचार करें । खतरों का तभी सामना किया जा सकता है जब आदमी इसके लिए तैयार हो । जैसा मैंने पहले कहा और फिर «« से दुहराना चाहूँगी कि यह समय दलगत प्रतिद्वंद्विता का नहीं है । हम सबको मिलकर एक साथ खड़े ७० रहना चाहिए और हमारे सामने जो अधिक काम हैं, उनमें एक दूसरे की सहायता करनी चाहिए सांप्रदायिक प्रवृत्तियों को दबाना चाहिए । मेरे विचार में सब पार्टियों को सहायता करनी चाहिए कि बंगला देश और शरणार्थियों का प्रश्न सांप्रदायिक स्तर तक न गिरने ** पाए बल्कि अपने सही स्तर पर ही बना रहे , जो राष्ट्रीय और अंतर्राष्ट्रीय स्तर है। मैं इन प्रश्नों और अन्य घटनाओं के बारे में विरोधी दलों के नेताओं और सदन के अन्य सदस्यों से संबंध बनाए रहूँगी । मैं?\" अपनी तरफ से सदस्यों को इस विषय पर अपनी बात मुझसे आकर कहने और उनके पास जो कोई जानकारी हो, उसे बताने की पूरी छूट देती का ही, इस 2 223 और कुछ कहने को '« नहीं रन 224 कहना चाहंगी कि हम निराश न हों । हमें अपने और अपने होना चाहिए । हमें बंगला देश ढक पोगों पर भरोसा संकल्प पर भरोसा होना बाहर कर अपने अधिकारों के लिए लड़ने के"},{"name":"संख्या 77","text":"महोदय, इस समय भारतवर्ष के सामने बहुत प्रकार की जटिल समस्याएँ हैं और यह ऐसा समय है जब सबसे 2\" यह अपेक्षा की जाती है कि आप सदा क्रारत की सुरक्षा और उसकी उन्नति के लिए कटिबद्ध होंगे । आपको मालूम ही है कि जब से यह प्रश्न हमारे सामने आया है कि भाषा के आधार पर देश “ के विभिन्‍न भागों का पुनर्गठन किया जाए तब से देश में बहुत प्रकार के आंदोलन उठ खड़े हुए हैं । सरकार ४ ने जनता की इच्छा और माँग को देखते हुए उसके लिए एक विशेष आयोग नियुक्त किया और यह आशा की जाती थी कि उस की जो कुछ भी सिफारिशें होंगी, वे सबको मान्य होंगी और आपस के मतभेद के लिए कोई स्थान न होगा । इस संबंध में सरकार ने जो भी निर्णय किए उनमें से अधिकांश निर्णय '* सर्वसम्मति से ही हुए हैं । परंतु दुख की बात है कि एक-दो स्थानों पर मतभेदों न  कर रहे हैं । बहुधा ऐसा होता है कि ऊँचे-ऊँचे पदों “\" पर बड़े-बड़े अधिकारी दूर-दूर से आते हैं पर जो काम कठिन समझा जाता है उसको स्थानीय लोग “ ही करते हैं । इसके विपरीत मैंने यहाँ यह भी देखा कि केवल ऊँचे पदों पर ही नहीं बल्कि पत्थर ७० तोड़ने तथा पत्थर काटने जैसा ठेठ मजदूरी का काम, जो कठिन काम होता है , मद्रास से लोग आकर कर रहे ““ हैं । यह हर्ष की बात है । वे तो मजदूरी के लिए ही आए हैं। पर॑तु इतनी दूर से आने-जाने में उनको सारे देश का ज्ञान हो जाएगा और जितने दिन वे यहाँ रहेंगे, उनका यहाँ के लोगों से प्रेम और संपर्क पैदा हो जाएगा जो सारे देश के लिए अत्यंत आवश्यक है । यह देश इतना बड़ा है और इसके ५२ इतने अधिक इक जब तक सब राज्यों के लोगों का परस्पर थोड़ा-बहुत परिचय कराने का वि प्रयत्न नहीं किया जाएगा तब तक सबका सहयोग नहीं मिल सकता । हमारे पूर्वजों ने इस सारे देश «७ को सदा ही एक माना और शॉकराचार्य जी ने दिग्विजय की तो उन्होंने हिंदुस्तान के '” चारों शर मठ प्रत्येक 2 माहात्य । प्रत्येक स्त्री-पुरुष के लिए चारों मठों का दर्शी क्‍"},{"name":"संख्या 79","text":"भ्र्र >च्प यात अभ्यास सभापति महोदय, उसका इस देश के अधिकांश 30९०8 (जस गा में चर्चा हो रही है ने स्वागत किया है । इसलिए इसमें दो और इस सदन में भी अधिकांरा ; इसलिए इसमें दो राय नहीं हो श सदस्यों जनोपयोगी है । यह ठीक है कि कुछ लोगों सकतीं कि » यह विधेयक विधेयक का विरोध करने की हिम्मत की है है जिनके निहित स्वार्थ हैं, इस ही पार्टी,गितको पूजीवादी नीतियों हे, उनका दि जनसंघ और स्वतंत्र दे आफ मामले ह ध करना स्वाभाविक ही है । ; विधेयक का स्वागत करने का न ही से कह रहा यो कि जी तक । का स्वागत करता '» हूँ वहाँ आग गोपी है । जहाँ मे इस विधेयक ं श '* हूँ वहाँ यह भी निवेदन करना चाहता हूँ कि इस क़ानून को सफल बनाने के लिए, जैसा प्रधानमंत्री ने\" सदन में अभी 'कहा, जोलाग इसका स्वागत उनको यक्ाम / न (3 हैं उनको उचित दृष्टिकोण और ईमानदारी के साथ काम ॥ हमारे देश ने गरीबी को दूर करने के लिए योजनाउ द् से योजनाबद्‌ध तरीके से विकास “* के 20203 02% 6 20020 ( विधेयक के सिलसिले में जहाँ यह विरोध किया जाता है '\" कि इस विधेयक से एक तानाशाही पैदा होगी, अधिनायकवाद होगा, वहाँ मैं यह निवेदन करना । चाहता हूँ कि यह विधेयक »\" उन लोगों पर जो पूँजीवाद के जरिए से  हानिकारक बनाए । यह आश्चर्य और दुख की बात है कि जहाँ एक ओर इस 7० विज्ञान द्वारा आज इतने लोगों को भयंकर से भ॑यकर रोगों से मुक्ति मिल रही है, वहाँ उसी विज्ञान दूबारा लोगों का जीवन ३ हो गया है। हम चाहते हैं कि हमारे देश के वैज्ञानिक चाहे वे विज्ञान किसी भी क्षेत्र में काम करते हों, इस बात को अपने ध्यान में रखें कि यदि विज्ञान कां कुछ अर्थ हो सकता है तो शोर जाहिरन तभी भावी प्रगति होगी। वह सेवा होना चाहिए न कि विनाश"},{"name":"संख्या 95","text":"अध्यक्ष महोदय, मैं कृषि मंत्रालय की माँगों का समर्थन करती हूँ । इसके साथ ही मैं यह भी कहना ” चाहती हूँ कि सदन के सदस्यों को बोलने में बहुत कठिनाई होती है । कई माननीय सदस्य चार बार बोल चुके “ हैं । अब अगर किसी महिला को मौका मिला है, तो उनको तो सहानुभूति होनी चाहिए । मैं कहना चाहती हूँ कि मैं किसान की लड़की हूँ और खेती करने वाले घर में महिलाएँ बहुत काम करती हैं । इसलिए *\" उन को खेती का अच्छा अनुभव होता है । हमारे देश में कम से कम वही होना चाहिए । कम खेती करने वाले घरों में महिलाएँ ज्यादा काम करती हैं । उनको हर सुविधा होनी चाहिए। हमारे मध्यप्रदेश में इस वर्ष '\" पानी बहुत कम बरसा है, वर्षा बहुत कम हुई है । वर्षा कम होने की वजह से फसल बहुत कम हुई '* है । इसलिए मेरी प्रार्थना है कि किसानों का इस वर्ष का लगान माफ कर दिया जाना चाहिए । उनसे '« इस वर्ष लगान बिल्कुल नहीं लिया जाना चाहिए । वहाँ पर किसान ने अगर पाँच मन बीज डाला था तो मुश्किल '* से दस मन गेहूँ ही हुआ होगा । किसान रो रहे हैं । उनको कोई सुविधा नहीं है । इसलिए उनका इस वर्ष का लगान माफ कर दिया जाना चाहिए। आपको चाहिए कि आप बेहूँ की कीमत निर्धारित 2\" कर दें । किसान कौ खलिहान में जब गलला आता है और उसको जब वह बाजार में ले जाता है तो वहाँ पर व्यापारी लोग उसको कम कीमत में खरीद लेते हैं और खरीदकर । अपने घर भर लेते हैं । बाद में जब जनवरी-फरवरी का महीना आता है उस समय उसको दुगुने या उससे भी अधिक 2 दामों पर बेचते हैं । जनवरी-फरवरी से पहले वे गल्ला घरों से निकालते ही नहीं हैं । किसानों को व्यापारी लोग!\" कम दम देकर चूसते हैं । किसानों के घर में कुछ नहीं बचता है । इसलिए हमारे कृषि मंत्री जी को »» सोचना चाहिए कि फसल आने के पहले वह दाम निर्धारित कर दें, ऊरवरी-मार्च में दाम निर्धारित कर दें ताकि “\" किसान का गल्ला कम दामों में न बिकने पाए । अन्न की समस्या आज बहुत नहीं है । आज लोगों को बहुत *« केष्टों का सामना करना पड़ रहा है । क्योंकि सरकार किसानों से संबंधित कार्यों को समय पर नहीं निपटाती है । समय रहते किसान की उन्नति और खेती के जुंदर विकास के संबंध में मैंने बहुत-सी बातें की ।"},{"name":"संख्या 96","text":"[_ अऑऋिलेखनसंख्या 95 __ अध्यक्ष महोदय, राजस्थान में जनता को बड़ी कठिनाई है । वहीँ व पड़ा हुआ है, मवेशी मर रहे है । ऐसे जो स्थान हैं, वहाँ आपको कप 8 चाहिए, वहाँ लोगों को तथा मवेशियों को खाने के लिए देना चाहिए, 'दहातों की सहायता करनी चाहिए । अगर आपने शहरों का ही ध्यान रखा और देहात समस्या व किसान की समस्या को हल नहीं किया तो भविष्य में । टूल जिन पैदा हो सकता है । जब मैं अपने क्षेत्र में कार्य करने “\" के लिए जाती हूँ जिन लोगों ने वोट दिया होता है और जिन्होंने नहीं भी दिया होता है, ““ वे भी शिकायत करते हैं कि जब वोट का समय आता है तब तो आप कहती हैं कि लगान माफ *” होगा, गल्ला सस्ता होगा, गाय-भैंस के लिए घास का प्रबंध होगा, लेकिन हो तो कुछ भी नहीं रहा है । *“ अंग्रेजों से जब हमने राज प्राप्त किया था उस समय नारा लगाते थे कि लगान माफ होगा, नहरें खोदी *“ जाएँगी, गाय-भैंस के लिए घास का इंतजाम किया जाएगा, लेकिन कुछ नहीं हुआ । लगान भी दुगुना बढ़ गया है । »\" जनता में इन सब बातों को लेकर बड़ा असंतोष है । हमारे मंत्री महोदय जब जिले का या प्रांत का दौरा ““ करने जाते हैं तो रेस्ट हाउस में जाकर ठहरते हैं । देहातों में जाएँ तो उनको असली हालत का पता चले । लेकिन वे तो रेस्ट हाउस में जाकर ठहरते हैं ताकि कहीं उनको लू न लग जाए । इसलिए *“ मैं निवेदन करती हूँ कि उनको गाँवों में जाना चाहिए, वहाँ जाकर उनको किसान की कठिनाई को समझना « चाहिए उनकी कठिनाई को दूर करना चाहिए किसान इस समय बड़े भयभीत हैं । उनकी तरफ बहुत-सा ५० रुपया पड़ा हुआ है, तकावी का, बीज का, लगान का, बैल का इत्यादि कलैक्टर या तहसीलदार उनको '\" आज बहुत परेशान कर रहे हैं। उसके बैल नीलाम हा जा रहे हैं, जमीन नीलाम की जा रही है । उसको कचहरी में ले जाते हैं र पटवारी, तहसीलदार किसान को जिस तरह से परेशान करते हैं उसका /“ लेखा मैं नहीं दे सकती हूँ, उसका मैं वर्णन नहीं कर भ्रष्टाचार का ही बोलबाला है । जब तक पाँच सौ रुपया पक द const list = document.getElementById("mattersList");
const searchInput = document.getElementById("matterSearch");
function renderRamdhariMatters(query = "") {
  const search = query.trim().toLowerCase();
  list.replaceChildren();
  const matches = RAMDHARI_MATTERS.filter(item => {
    const number = item.name.match(/\d+/)?.[0] || "";
    return !search || item.name.toLowerCase().includes(search) || number.includes(search);
  });
  matches.forEach(item => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "matter-item";
    button.textContent = item.name;
    button.onclick = () => selectMatter(item.text, item.name);
    list.appendChild(button);
  });
  if (!matches.length) {
    const empty = document.createElement("p");
    empty.textContent = "No matching transcriptions found.";
    list.appendChild(empty);
  }
}
searchInput.addEventListener("input", () => renderRamdhariMatters(searchInput.value));
