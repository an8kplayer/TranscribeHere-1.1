<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>रामधारी खंड 1 - Steno Practice</title>
<link rel="stylesheet" href="style.css">
<style>
body.dark .matter-item { background:#2d2d2d; color:#fff; border-color:#444; }
.matter-page .container { max-width:1400px; }
.matter-search { margin:18px 0 20px; }
.matter-search label { display:block; margin-bottom:8px; font-weight:600; }
#matterSearch { width:100%; box-sizing:border-box; margin:0; }
#mattersList {
  display:grid;
  grid-template-columns:repeat(4, minmax(0, 1fr));
  gap:12px;
}
.matter-item {
  border:1px solid #ccc; padding:12px; margin:0; border-radius:7px;
  cursor:pointer; transition:background 0.2s, border-color 0.2s;
  display:block; width:100%; box-sizing:border-box;
  text-align:left; min-height:48px;
}
.matter-item:hover { background:#f0f0f0; }
body.dark .matter-item:hover { background:#383838; }
@media (max-width:1000px) {
  #mattersList { grid-template-columns:repeat(3, minmax(0, 1fr)); }
}
@media (max-width:700px) {
  #mattersList { grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px; }
}
@media (max-width:430px) {
  #mattersList { grid-template-columns:1fr; }
}
</style>
</head>
<body class="matter-page">
<div class="container">
<h2>रामधारी खंड 1</h2>
<button type="button" onclick="goHome()">Home</button>

<div class="matter-search">
  <label for="matterSearch">Search transcription:</label>
  <input type="search" id="matterSearch" placeholder="Search by transcription number or name..." autocomplete="off">

<div id="mattersList">

const list = document.getElementById('mattersList');
const searchInput = document.getElementById('matterSearch');

function renderMatters(query = '') {
  const search = query.trim().toLowerCase();
  list.replaceChildren();

  const matches = RAMDHARI_MATTERS.filter((matter) => {
    const number = matter.name.match(/\d+/)?.[0] || '';
    return !search || matter.name.toLowerCase().includes(search) || number.includes(search);
  });

  matches.forEach((matter) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'matter-item';
    button.textContent = matter.name;
    button.onclick = () => selectMatter(matter.text, matter.name);
    list.appendChild(button);
  });

  if (!matches.length) {
    const empty = document.createElement('p');
    empty.textContent = 'No matching transcriptions found.';
    list.appendChild(empty);
  }
}

searchInput.addEventListener('input', () => renderMatters(searchInput.value));
renderMatters();

// Apply the same saved dark-mode preference used by KC Matters.
