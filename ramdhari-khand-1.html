  { name: "संख्या 1", text: "सभापति महोदय, मैं रक्षा मंत्रालय की माँगों का समर्थन करने के लिए खड़ा हुआ हूँ। वर्तमान घटनाओं से पता चलता है कि संसार का हर देश अपनी सुरक्षा के बारे में चिंतित है और उसके लिए हर प्रयत्न कर रहा है। इस दृष्टि से अन्य देशों की तरह हमारे देश में भी रक्षा मंत्रालय का महत्व है। मुझे इस बात की खुशी है कि जहाँ अन्य मंत्रालयों की उनके पिछले साल के कामों के बारे में काफी आलोचना हुई है, वहाँ इस मंत्रालय की कम आलोचना हुई है। इससे पता चलता है कि इस मंत्रालय ने पिछले साल अच्छा काम किया है। मोटे तौर पर किसी भी देश की सुरक्षा नीति का लक्ष्य यह होता है कि दूसरे देशों, खास तौर से पड़ोसी देशों, के साथ मित्रता के संबंध स्थापित हों और हम एक दूसरे के मामलों में हस्तक्षेप न करें, लेकिन उसके साथ यह भी जरूरी होता है कि हम अपने देश की सीमाओं और अखंडता की रक्षा करें। इसलिए हमारे देश का यह कर्तव्य हो जाता है कि हम अपने पड़ोसियों के कार्यों पर पूरी नजर रखें, क्योंकि आज तक हमारे देश पर जो संकट आए, वे हमारे पड़ोसियों से आए हैं। 1965 में पाकिस्तान के साथ जो लड़ाई हुई और उसके बाद ताशकंद में जो समझौता हुआ, वह सिर्फ कागज पर ही रहा, पाकिस्तान ने उस पर कोई अमल नहीं किया। इस दृष्टि से बहुत जरूरी है कि हम अपने देश की सुरक्षा की हर तरह से व्यवस्था करें। हमारा उद्देश्य दूसरों पर आक्रमण करना नहीं है, लेकिन यदि हम पर कोई आक्रमण करे, तो हम में इतनी शक्ति अवश्य होनी चाहिए कि हम उसका डटकर सामना कर सकें। आप जानते हैं कि पिछले दिनों पाकिस्तान को अमेरिका और चीन से काफी मदद मिली है। रक्षा मंत्रालय की रिपोर्ट में भी कहा गया है कि पिछले साल अमेरिका ने पाकिस्तान को 15 सौ करोड़ रुपए की फौजी सहायता दी है। आज जहाँ हम फौजी सामान के लिए अपने कारखानों की मदद से अपनी शक्ति बढ़ाने का प्रयत्न कर रहे हैं, वहाँ पाकिस्तान संसार के देशों से फौजी सामान खरीद रहा है। अपनी नीति के कारण वह सब देशों से लाभ उठा रहा है। मेरा सुझाव है कि हम को भी अपनी शक्ति बढ़ाने के लिए संसार के अन्य देशों से अधिक से अधिक फौजी सामान खरीदना चाहिए। आज तिब्बत की सीमा पर चीन की डेढ़ लाख फौज खड़ी है।"},
  { name: "संख्या 2", text: "सभापति महोदय, प्रतिदिन छोटी मोटी झड़पें होती रहती हैं। हमारी फौजें बड़े उत्साह से उनके मुकाबले में खड़ी हैं, उनके हौसले बहुत ऊँचे हैं। लेकिन हमारी सरकार का भी यह कर्तव्य है कि उनके हौसले को कभी गिरने न दे। उन्हें हर तरह की सुविधा प्रदान की जाए, जिससे उनका आत्मविश्वास बढ़े। मैं मंत्री महोदय से अनुरोध करूँगा कि सरकार अपनी नीतियों के प्रचार का काम ठीक प्रकार से अपनी फौजों से करे, उन को अच्छे-अच्छे हथियार दे। अनुसूचित जातियों और आदिवासी जातियों के आयुक्त ने जो अपना प्रतिवेदन प्रस्तुत किया है, उस प्रतिवेदन को देखने से यह प्रतीत होता है कि इसकी तैयारी करने में उन्होंने बहुत परिश्रम से कार्य किया है। इसके लिए मैं उनकी और उनके सहयोगियों का धन्यवाद देता हूँ, परंतु साथ ही साथ इस प्रतिवेदन के संबंध में कुछ आवश्यक निवेदन भी करना चाहता हूँ। पहली बात तो यह है कि इस प्रतिवेदन को देखने से ऐसा प्रतीत होता है कि इन कार्यों के लिए जिस धन का उपयोग होता है, वह तीन साधनों से उपलब्ध होता है—केंद्र सरकार द्वारा, राज्य सरकारों द्वारा और कुछ गैर-सरकारी संस्थाओं द्वारा। प्रतिवेदन के अनुसार जितना धन इन कार्यों पर व्यय करने के लिए दिया जाता है, उतना धन पूरी तरह से व्यय नहीं हो पाता। मैं यह नहीं कह सकता कि आवश्यकता से अधिक धन दिया जाता है या कार्यकर्ताओं को वह धन प्राप्त ही नहीं होता, जिसके कारण से वह बिना खर्च हुए बच जाता है। मैं तो यह चाहता हूँ कि जितना धन दिया जाता है उसका पूरा उपयोग हो और आयुक्त को यह न कहना पड़े कि इस कार्य के लिए जितने धन की आवश्यकता थी, उतना धन नहीं मिल पाया और विवश होकर हमको उस कार्य को बीच में ही रोकना पड़ा। जहाँ तक राज्य सरकारों का संबंध है, बहुत-सी राज्य सरकारें अभी तक इस कार्य में असावधानी से काम ले रही हैं, और इस कार्य को उपेक्षा की दृष्टि से देखती हैं। आयुक्त ने इस बात की शिकायत की है कि बहुत-सी राज्य सरकारों ने अनेक पत्र भेजने के बाद भी अभी तक अपनी रिपोर्ट नहीं भेजी है। मैं चाहता हूँ कि सरकार इस तरफ निष्ठापूर्वक ध्यान दे, राज्य सरकारों पर दबाव डाला जाए कि वे इस दायित्व के प्रति सचेत हों और आयुक्त को उनके कार्य में पूरा-पूरा सहयोग प्रदान करें।"},
  { name: "संख्या 3", text: "सभापति महोदय, किसानों की उपज की आप न अधिक कीमत दे सकते हैं न अधिक उपजाने के लिए जो साधन देश में उपलब्ध हैं उनकी तरफ आपका ध्यान जा रहा है। जो कुछ आप कर रहे हैं उससे कोई अच्छा भविष्य नजर नहीं आ रहा है। मैं यही कहना चाहता हूँ कि आप देखें कि आपका जो कार्यक्रम है कहाँ चूति है, कहाँ कमी है। आपने कर लगा रखे हैं। आपने जो कर लगाए हैं तो लगाते ही हैं, हमारे प्रदेश में तो जमीन पर 25 प्रतिशत ज्यादा कर भी लगा दिया गया है। इतना बोझ अगर किसान पर होगा तो उसकी कमर टूट जाएगी। वह पहले से टूटी जा रही है लेकिन वे इन करों को देने के लिए भी तैयार हैं, यदि आप उस तरह के साधन उन किसानों के लिए तैयार करें। हमारे उत्तर प्रदेश के कुछ जिले हैं, पूर्वी जिले हैं जहाँ पर बहुत बुरी स्थिति है। हमारे सदन के एक सदस्य ने रो-रो कर आपको यह बताया था कि वहाँ लोगों को दो रुपए मजदूरी में मिलते हैं। इतनी ही एक दिन की उनकी मजदूरी है। सरकार ने एक आयोग की नियुक्ति की थी ताकि वहाँ पर कुछ विकास के कार्य किए जाएँ। वह योजना भी अब खटाई में पड़ गई है। आपका ध्यान इन समस्त चीजों की ओर कैसे दिलाया जाए? कैसे आपका ध्यान इन सभी कठिनाइयों की ओर आकर्षित किया जाए? समझ में नहीं आता है। यातायात के साधनों की स्थिति यह है कि ट्रेनों में दूसरे दर्जे में भीड़-भाड़ का कोई ठिकाना नहीं है, उसकी कोई सीमा नहीं है। हर रोज ऐसा मालूम पड़ता है कि कोई मेला चल रहा है। आपके पास अच्छे इंजन हैं, अच्छे गति वाले इंजन हैं, लाइन भी अच्छी है। तो क्या वहीं दूसरे दर्जे के अधिक डिब्बे लगाए जाते हैं? लोगों को कुछ सुविधा मिल जाए वह काम नहीं किया जा रहा है। आपको किसान की, देहात में रहने वाले आदमी की, मजदूर की परवाह नहीं है जो समस्त कठिनाइयों को झेलता है। आपके सारे कार्यक्रमों को पूरा करने की उसमें कहाँ से शक्ति आएगी? कैसे वे अधिक अन्न उपजाकर आपको दे सकेंगे? आप इन सब पर सोच-विचार करें। आपने बड़े-बड़े फार्म बना दिए हैं। क्या उन्हें आपके फार्म से कोई लाभ मिल रहा है?"},
  { name: "संख्या 4", text: "सभापति महोदय, सरकार ने कई कृषि फार्म खोले हैं। क्या ये फार्म घाटे में नहीं चल रहे हैं? अगर सारे खर्च जोड़ दिए जाएँ, बड़े-बड़े अधिकारियों के वेतन जोड़ दिए जाएँ तो पता चलेगा कि सारे ये कृषि फार्म घाटे में चल रहे हैं। क्या इसी तरह से आप सारे किसानों को घाटे पर खेती करने के लिए मजबूर करेंगे? जिस क्षेत्र से मैं आता हूँ वहाँ एक पुल बना है। मैंने दस वर्ष तक अपनी विधान सभा में इस पुल के लिए कोशिश की है। जिस दिन से मैं यहाँ आया हूँ बराबर उसकी चर्चा करता आ रहा हूँ बराबर कोशिश कर रहा हूँ। मैं कहता हूँ कि गंगा पर वह पुल बने, उस पुल को बनाने का आश्वासन भी मिला था। एक प्रश्न के लिखित उत्तर में यह जवाब दिया गया था। यह कहा गया था कि इसको हाथ में लिया जाएगा। अब मालूम हुआ है कि उस योजना को उठाकर ताक पर रख दिया गया है और यह पुल नहीं बनेगा। इन लोगों ने क्या कसर किया है? यह मैं आपसे जानना चाहता हूँ। हमारे क्षेत्र के लोगों ने पाकिस्तान की लड़ाई में सरकार को हर तरह का सहयोग दिया था, हर तरह की सहायता दी थी। हमारे यहाँ के नौजवान भी मोर्चे पर जाकर डटे। जिस समय पाकिस्तान के साथ हमारा युद्ध चल रहा था तो कहीं कोई बात नहीं थी। अन्न की कमी भी हमारे विरोधी साथी पैदा करते हैं जो यह चाहते हैं कि सरकार असफल हो जाए। ये लोग जो कहते हैं उसको आप समझें। एक तरफ तो हमारे मित्र की बात है जो देश के बड़े-बड़े शहरों में दंगे करवाते हैं, दूसरी तरफ हम हैं जो कि इनकी बातों को नहीं समझ पाते। इनको सभी वे लोग मिल जाते हैं जो बेकार होते हैं या जो दंगे करवाने के लिए उत्सुक हैं। इसलिए सरकार को इन सारी चीजों की तरफ ध्यान जाना चाहिए और उसको सोचना चाहिए कि क्या तरीका इन सबसे बचने का हो सकता है। एक ही तरीका हो सकता है कि इस देश में हर आदमी को काम मिले। देहात में लोगों को करने के लिए काम मिले और खादि कमीशन की जो योजना है और जो कि एक अच्छी योजना है वह ठीक तरह से चले। सौभाग्य से मैं आर्यसमाज संगठन से संबंध रखता हूँ।"},
  { name: "संख्या 5", text: "उपाध्यक्ष महोदय, वित्तमंत्री को देश की आर्थिक स्थिति और निर्धनता के संबंध में जितनी जानकारी प्राप्त होती है उतनी किसी अन्य मंत्री को संभव नहीं होती। बजट बनाते समय वैसे तो बजट में आय-व्यय का ब्यौरा होता ही है, लेकिन मूल रूप में देश की आर्थिक नीतियों में किस प्रकार का परिवर्तन हो तथा किस मार्ग पर वह देश को चलाना चाहते हैं, सरकार का लक्ष्य क्या है, इन सब नीतियों का बजट में विवरण होता है। हमारे वित्त मंत्री चाहे जिस पद पर भी रहे हों, चाहे वे मुख्यमंत्री रहे हों या केंद्रीय सरकार में रहे हों, उन्होंने शानदार काम किया। जिस समय उन्होंने बजट प्रस्तुत किया उस समय देश को और विशेष रूप से गरीबों को उनसे बहुत-सी आशाएँ थीं। देश में लगभग 6 लाख गाँव हैं, उनमें जो बेरोजगारी है, गरीबी है, उसके संबंध में देश की जनता को उनसे बड़ी आशाएँ थीं और जनता देखना चाहती थी कि इस अवसर पर सरकारी नीतियों के द्वारा देश को वे क्या मार्गदर्शन देना चाहते हैं। इस दृष्टि से तीन महत्वपूर्ण बातें इस समय देश के सामने थीं—देश का आर्थिक विकास तेजी से हो, अधिक लोगों को काम मिल सके और मूल्यों में स्थिरता आए। जहाँ तक इन तीन उद्देश्यों का संबंध है हमने देखा कि उस ओर कुछ प्रयत्न हुए हैं। विशेष रूप से गरीबी हटाओ के संबंध में इस देश में जो चर्चा चल रही है, इस बजट में कुछ सीमा तक उसका उल्लेख मिलता है, क्योंकि जितने भी प्रत्यक्ष कर लगे हैं वे ज्यादातर धनी लोगों पर और विशेष रूप से शहर के लोगों पर लगाए गए हैं। इस तरह से जो एक प्रकार की आर्थिक असमानता हमारे देश में चल रही है, उसको दूर करने का प्रयत्न अवश्य किया गया है। लगभग पाँच दशक पूर्व जब हमारा देश स्वतंत्र हुआ था, उस समय देश में जितने सरकारी कर्मचारी थे, वे ऐसा समझ बैठे थे कि अब तक देश में जिस तरह से अंग्रेजों का प्रशासन चल रहा था उस तरह से काम नहीं चलेगा, क्योंकि कांग्रेस के जो नए लोग आए थे, जो मंत्री बने थे, वे लोग धन के मामले में त्यागी आदमी हैं, धन से उनको मोह नहीं है। लेकिन बाद में उन्होंने देखा कि हमारे मंत्री लोग भी उसी तरह से शानदार जीवन पसंद करने लग गए, जिस तरह से अंग्रेज करते थे।"},
  { name: "संख्या 6", text: "उपाध्यक्ष महोदय, तब उन लोगों को कुछ आशा हुई कि हम लोग भी उसी तरह चल सकते हैं, जिस तरह से पहले चल रहे थे। लेकिन अभी हाल में जो चुनाव हुआ उससे देश के धनिकों के मन में बड़ा संदेह पैदा हुआ कि इस चुनाव के बाद उनकी स्थिति वैसी नहीं रहेगी जो अब तक चली आती रही है। गरीबों और अमीरों के बीच में अब तक जो बहुत बड़ा अंतर चला आ रहा था, उसको अब तेजी से दूर करने का प्रयत्न किया जाएगा। श्रीमान्, मैं आपका बहुत ही आभारी हूँ जो आपने सदन में चालू वर्ष के बजट पर अपने विचार प्रकट करने का अवसर दिया है। मैं इस बजट का समर्थन करना चाहता हूँ। श्रीमान्, मैं सबसे पहले अपने दल के नेता, प्रधानमंत्री को इस बात के लिए बधाई देना चाहता हूँ कि उनके नेतृत्व में देश में कांग्रेस दल को स्पष्ट बहुमत मिला और इसके फलस्वरूप यहाँ पर केंद्र में एक ऐसी सरकार का गठन हुआ जो कि देश में वास्तव में समाजवाद लाना चाहती है। मैं वित्तमंत्री जी को इस बात के लिए बधाई देना चाहता हूँ कि लोकसभा के मध्यावधि चुनाव में जनता द्वारा कांग्रेस दल को जो आदेश दिया गया था, उन्हें स्मरण है और वह तन-मन-धन से उसका पालन करना चाहते हैं। वह आदेश था देश में सामाजिक और आर्थिक विषमता दूर करने का, देश से गरीबी, बेकारी और बेरोज़गारी को हटाने का और देश के जो पिछड़े हुए हिस्से हैं उनका पूरा विकास करने का। साथ ही साथ इस बात का भी आदेश था कि देश के अंदर इस प्रकार की सामाजिक और आर्थिक व्यवस्था पैदा की जाए जिसके अंतर्गत जनता शोषण से मुक्त हो सके। श्रीमान्, यह ठीक है कि देश में कृषि के क्षेत्र में उत्पादन में वृद्धि हुई है। परंतु इसके साथ ही साथ यह भी दृष्टि में रखना चाहिए कि लागत में भी पूरी वृद्धि हुई है। इसके लिए आवश्यक है कि सिंचाई के साधन बढ़ाए जाएँ और अधिक उन्नत बीजों का प्रयोग किया जाए। आज कृषकों को कृषि के यंत्र मिलने में बहुत कठिनाई हो रही है, जैसे छोटे-छोटे ट्रैक्टरों का देश में बड़ा अभाव है। उनके बनाने के लिए शीघ्र नए कारखाने खोले जाएँ, जिससे कृषकों को जल्द से जल्द ट्रैक्टर मिल सकें। देश तभी प्रगति करेगा हमारा ऐसा विश्वास है।" },
  { name: "संख्या 7", text: "अध्यक्ष महोदय, दसवीं पंचवर्षीय योजना पर विचार करते समय सदन के दोनों पक्षों के सदस्यों ने जो महत्वपूर्ण प्रश्न उठाए हैं उन पर विचार किया जाना बहुत आवश्यक है। अध्यक्ष महोदय, नौवीं पंचवर्षीय योजना का अब अंतिम वर्ष चल रहा है और इस योजना के अंदर जो चीजें कही गई हैं, ऐसा लगता है कि उसके अंदर परिवर्तन करना कठिन है। बदला भी नहीं जा सकता। अध्यक्ष महोदय, कुछ चीजें की जा सकती हैं। उसके अंदर आज भी कुल कितना खर्च है, यह तय नहीं किया गया। केवल कटौती ही निश्चित की गई है। शुरू में मैं यह कहना चाहता हूँ कि यहाँ पर कुछ सदस्यों ने जो यह प्रश्न उठाया था कि इस पंचवर्षीय योजना का आशय कुछ सरकारी पक्ष से भी बताया है। इसके अंदर कमियाँ हैं और बहुत-सी कमियाँ हैं जिनके ऊपर मैं यहाँ कुछ दोषारोपण नहीं करना चाहता हूँ। मैं चाहता भी हूँ कि इस तरह से प्रश्न न उठाए जाएँ तो ज्यादा अच्छा है। यह योजना सरकार ने बनाई है। यह योजना मंत्रिमंडल ने पहले बनाई और अनुमोदन होने के बाद भी इसमें कुछ कमियाँ रह गई हैं। तो यह कमी रहने का दोष किसके ऊपर है? मैं समझता हूँ सदन के सभी सदस्य इसको जानते हैं। बहुत-से लोगों ने दिल्ली के प्रश्न उठाए, जो दिल्ली के साथ अन्याय किया गया है। तो मैं समझता हूँ इस बारे में सब आवाज उठाएँ, इस बात की आज ज्यादा जरूरत है। मैं यह कहना चाहता हूँ भारत सरकार से या जिन्होंने ये सारी योजनाएँ बनाईं, उन्होंने वास्तव में यहाँ के साथ बड़ा बुरा किया, यहाँ के साथ अन्याय किया क्योंकि उन्होंने इस पंचवर्षीय योजना को बनाते समय ध्यान नहीं दिया कि क्या योजना बना रहे हैं। गलत बना रहे हैं या सही बना रहे हैं। इनसे क्या लाभ-हानि होगा इन सब बातों पर उन्होंने विचार नहीं किया। तो मैं समझता हूँ ऐसी परिस्थितियों के अंदर यह बात ठीक नहीं है। ऐसी दशा में यहाँ पर पाँच वर्षों में आने वाली योजनाएँ बेकार बनकर रह जाएँगी। जो कटौती निश्चित की गई है उसको समाप्त करना चाहिए ताकि दिल्ली को हम अंतर्राष्ट्रीय स्तर का एक आदर्श नगर बना सकें। यह बहुत ही आवश्यक है यदि हम इस स्थान की उन्नति चाहते हैं। इसलिए अब मैं अपना कथन इन शब्दों के साथ ही समाप्त करता हूँ।" },
  { name: "संख्या 8", text: "अध्यक्ष महोदय, आपने मुझे दसवीं पंचवर्षीय योजना पर बोलने का अवसर दिया, इसके लिए मैं आपका आभारी हूँ। आपने मुझे कम समय दिया, इसके लिए भी आभारी हूँ। अभी मेरे से पूर्व कुछ सदस्यों ने हम पर यह आरोप भी लगाया कि हम योजना में विश्वास नहीं रखते। उन्होंने तो यह भी कहा कि हमारे चुनाव घोषणा-पत्र में भी उनको इस बारे में कुछ नजर नहीं आया। मैं इस बारे में यह निवेदन करना चाहता हूँ कि उन्होंने कोई दूसरा घोषणा-पत्र देखा, गलत घोषणा-पत्र पढ़ा और उसी को हमारा घोषणा-पत्र समझ बैठे। लेकिन मैं यह कहना चाहता हूँ कि हमारा घोषणा-पत्र इस समय मेरे पास है। इस घोषणा-पत्र में हमारी घोषणा में योजना के बारे में स्पष्ट रूप से कहा गया है कि हम योजना पर विश्वास रखते हैं। लेकिन ऐसी योजना पर विश्वास नहीं रखते जो जनता के दुखों को दूर नहीं कर सकती, जो जनता के कष्ट दूर नहीं कर सकती। आज तक जितनी भी योजनाएँ बनाई गई हैं, जिन्हें हम पहली पंचवर्षीय योजना, दूसरी पंचवर्षीय योजना और दसवीं पंचवर्षीय योजना आदि कहते हैं और उन योजनाओं में हमने जो कुछ निर्धारित किया उनसे हम जनता के दुखों को दूर नहीं कर सके और जनता के कष्ट दूर नहीं हुए। इन योजनाओं के परिणाम भी हमारे सामने हैं। बड़े-बड़े अनुभवी बैठे, उन्होंने योजनाएँ बनाईं लेकिन योजनाएँ ठीक प्रकार से कार्यान्वित नहीं की गईं। उन योजनाओं में काफी दोष थे जिसके कारण ये योजनाएँ लोगों के दुखों को दूर नहीं कर सकीं। लोग दुखी ही रहे। मैं यहाँ पर कहना चाहता हूँ कि जो हमारी योजना थी उसका परिणाम क्या निकला? उसका परिणाम यही निकला कि हमें रुपए का मूल्य कम करना पड़ा। जो योजना होती है वह राष्ट्र धन को ऊँचा करने के लिए बनाई जाती है। लेकिन हमारे सामने आँकड़े हैं, इसका परिणाम हमारे सामने है। हमने अब तक नौ पंचवर्षीय योजनाएँ कार्यान्वित की हैं लेकिन हमारी प्रति व्यक्ति आय में और जीवनस्तर में अपेक्षित वृद्धि नहीं हुई है। यह दुख की बात है। मैं यह कहना चाहता हूँ कि हमारा ऐसी योजना में विश्वास नहीं है जो जनता के कष्टों को, जनता के दुखों को दूर न कर सके। हम ऐसी योजनाओं पर विश्वास करते हैं जो उनकी आयु बढ़ा सकें, उनका आर्थिक विकास कर सकें, उन्हें उन्नत कर सकें।" },
  { name: "संख्या 9", text: "सभापति महोदय, ये शब्द मेरे नहीं हैं बल्कि राष्ट्रपिता के हैं। जो लोग आज सरकार में बैठे हुए हैं। क्या वे अपने दिल में सोचेंगे कि यह देशद्रोह शब्द बालकों को अंग्रेजी पढ़ाने के लिए राष्ट्रपिता का कहा हुआ है। आज 54 वर्ष देश को स्वतंत्र हुए हो गए हैं लेकिन राष्ट्रपिता की इस बात पर आज तक ध्यान नहीं दिया गया है। अंग्रेजी भाषा को पढ़ाना क्यों बंद नहीं किया गया और उसको दैनिक कार्यों में क्यों प्रयोग में लाया जाता है? मैं इस बात को कई बार इस सदन में कह चुका हूँ और मैंने इस विधान परिषद की नियमावली में एक वर्ष पहले एक संशोधन भी रखा था लेकिन मेरा दुर्भाग्य है कि वह संशोधन वर्ष भर से इस सदन में प्रस्तुत नहीं हो सका। मेरी अपनी राय है कि कम से कम दैनिक कार्यों के लिए यदि सरकार अंग्रेजी भाषा पर बंधन लगा दे तो बहुत अच्छा हो और जो यह अनुशासनहीनता है वह भी समाप्त हो जाए। सभापति महोदय, जैसा कि मेरे मित्र ने कहा, लड़कों के माता-पिता अंग्रेजी का प्रयोग करते हैं और उनके शिक्षक भी उसका प्रयोग करते हैं फिर बालकों पर उसका प्रभाव क्यों नहीं पड़ेगा? मैं उनसे सहमत हूँ कि बालकों में नकल करने की आदत होती है। जैसा वे अपने बड़ों को करते देखते हैं वैसा ही वे करते हैं। अगर हम कोई बुरा काम करेंगे तो उसका प्रभाव बालकों पर अवश्य पड़ेगा। आप देखेंगे कि जिस मनोवृत्ति के माता-पिता और शिक्षक होते हैं उसी प्रकार के बालक भी होते हैं। हम दूसरों को तो परामर्श दे देते हैं लेकिन स्वयं उस पर अनुपालन नहीं करते। इसके साथ ही साथ हमको शिक्षा-प्रणाली की ओर भी ध्यान देना है। शिक्षा के जिन तरीकों को आजकल अपनाया जा रहा है वे वास्तव में लाभकारी नहीं हैं। सरकार की ओर से इस प्रकार का आदेश होना चाहिए कि चौदह वर्ष तक बालकों को अपनी मातृभाषा में ही शिक्षा दी जाएगी और दैनिक कार्यों में भी अंग्रेजी का प्रयोग नहीं होगा। इस प्रस्ताव में अनेक महत्वपूर्ण बातों की ओर ध्यान दिलाया गया है। मैं समझता हूँ कि जब माननीय मंत्री जी इस का उत्तर देंगे तो कह देंगे कि हम बहुत-सी बातों पर कार्यान्वयन कर रहे हैं। लेकिन मैं समझता हूँ कि उन पर कोई कार्यान्वयन नहीं हो रहा है।" },
  { name: "संख्या 10", text: "सभापति महोदय, आज हमारे देश में जो ऊपर से लेकर नीचे तक शिक्षा दी जा रही है उसमें व्यवस्था ही एक कारण है जिसकी वजह से शिक्षा का स्तर गिरता जा रहा है। मेरा अपना विचार है कि जो शिक्षा प्रणाली है और जिस रूप में शिक्षा दी जा रही है, वही अनुशासनहीनता का भी कारण है। अपने देश और प्रदेश में हर एक की अपनी-अपनी भाषा है और वह बालक जो इस देश में पैदा हुआ है, जो अपनी मातृभाषा की गोद में पला है, उसको यदि ठीक हो सकता है। जो सबसे बड़ी भूल और कमी सरकार के द्वारा दी जाने वाली शिक्षा के संबंध में हो रही है, वह यह है कि बालक की मातृभाषा में शिक्षा न देकर, उसको उस भाषा में शिक्षा देने की व्यवस्था की गई है जो हमारे देश या प्रदेश की भाषा कभी रही ही नहीं। मेरा अभिप्राय विदेशी भाषा अंग्रेजी से है। मैं यह मानकर चलता हूँ कि जब से यह भाषा इस देश में आई है, चाहे वह किसी कारण से आई हो, इसे आप भी और इस माननीय सदन के सदस्य भी जानते हैं कि उस से बुरे परिणाम ही निकले हैं, कोई भलाई नहीं हुई है। इस देश को जो हानि हुई है वह किसी से छिपी नहीं है। हम देख रहे हैं कि हमारे यहाँ जितना फैशन बढ़ रहा है और जितनी वेशभूषा बिगड़ रही है वह सब अंग्रेजी भाषा के ही कारण है। जिस समय यहाँ पर अंग्रेजों का राज्य था, प्रायः यह देखने को मिलता था कि वे लोग जो विशेष कर के किसी न किसी तरह से सरकारी पक्ष के ही होते थे अंग्रेजों से मिलने के लिए जाते समय अंग्रेजी वेशभूषा का ही प्रयोग करते थे। परंतु यह इस प्रदेश और इस देश का दुर्भाग्य है कि अंग्रेजों का राज्य समाप्त हो जाने के बाद भी लोग उनकी वेशभूषा को पहनते चले जा रहे हैं। इससे जो प्रभाव हमारे देश के फैशन पर पड़ा उससे लाभ के बजाय हानि ही हुई है और हो भी रही है। मेरा ऐसा विचार है कि अंग्रेजी वेश-भूषा से इस देश को बहुत हानि हुई है। भारत की गौरवपूर्ण सभ्यता और संस्कृति के संरक्षण पर पर्याप्त ध्यान देने की आवश्यकता है।" },
  { name: "संख्या 11", text: "अध्यक्ष महोदय, मैं आपको एक और बात बतलाना चाहती हूँ और वह यह है कि कृषि विभाग को योजना आयोग ने बहुत गलत रास्ते में बिठा दिया है। उन लोगों के पास लड़ने के लिए दम नहीं है और देश में खाद्यान्न का उत्पादन बढ़ाने के लिए जो योजनाएँ चाहिए और उनके लिए जो धनराशि चाहिए वे उनको पूरी तरह संस्वीकृत नहीं करा पाते हैं। कृषि विभाग तो जमीन की तरह आधार होता है और उसी पर देश के लिए पर्याप्त अन्न पैदा करने का महान भार है। इसलिए यह बहुत आवश्यक है कि अधिक अन्न उपजाने के मार्ग में जो भी आवश्यक कदम यह विभाग उठाना चाहे उसमें किसी तरह की रुकावट न हो। बहुत-सी हड़तालें हो सकती हैं। मजदूर काम से बरी हो सकते हैं लेकिन किसी भी हालत में वे खाने से बरी नहीं हो सकते। अब हम देखते हैं कि मिलों और कारखानों में हड़तालें हो जाती हैं। छुट्टी हो जाती है तो आम काम के दिनों की अपेक्षा लोग उन दिनों में ज्यादा खाना खाते हैं ज्यादा दावतें करते हैं। आज यह हमारे लिए यह सर्वाधिक महत्व का विषय है कि हमारा अन्न का उत्पादन उस गति से बढ़े ताकि हम अपनी खपत से अधिक उत्पादन कर उसका निर्यात कर सकें। सरकार तथा इस मंत्रालय के लिए यह समस्या एक बड़ा सिरदर्द पैदा कर रही है। हर एक विभाग में बड़े-बड़े अधिकारी बैठे हैं और हजारों रुपए के बड़े-बड़े वेतन ले रहे हैं। लेकिन मुझे दुख के साथ कहना पड़ता है कि उनका दिमाग कार्यालय की मिसिलों और कागजों में लगा रहता है। इस विभाग का काम बहुत ही महत्वपूर्ण है। प्राकृतिक कोप के कारण जो समय-समय पर हमारी फसलों को नुकसान होता है इससे भी अपनी फसलों की रक्षा करने के लिए आवश्यक कदम उठाना इसके जिम्मे है। आज मेरे पास लखनऊ से कुछ लोग आए थे और वे लोग बोल रहे थे कि यहाँ दिल्ली में इस अवसर पर ठंडी हवा चल रही है और आप यहाँ दरवाजे बंद करके बैठे हैं या आराम से लेटे हैं लेकिन हमारी तो जान खतरे में है। वहाँ ओले गिर रहे हैं और हमारी गेहूँ की फसल खतरे में है। अब यह इस विभाग का काम है कि चूँकि हवा में पानी ज्यादा होता है इसलिए फसल के बचाव के लिए उस पर नियंत्रण किया जाए जिससे फसल की हानि न हो।" },
  { name: "संख्या 12", text: "अध्यक्ष महोदय, जिस भावना से मैंने यह बिल पेश किया है उसको विरोधी पक्ष के लगभग सभी सदस्यों ने एकमत से महसूस किया है कि देश में बेकारी की जो समस्या है वह एक भयंकर समस्या है और उसके कारण हमारे देश का विकास चाहे वह सामाजिक हो, आर्थिक हो या सांस्कृतिक रुका हुआ है और ऐसी स्थिति में हम आगे बढ़ नहीं सकते हैं। इसी प्रकार से इस परिस्थिति का निर्माण हम पिछले 54 वर्षों से देख रहे हैं। मंत्री महोदय ने यहाँ पर अभी कहा कि राष्ट्रपति इस काम को नहीं कर सकते हैं क्योंकि वह उनके अधिकार के बाहर है। आप राज्यों में राज्यपाल-शासन स्थापित करते हैं जब यह देखते हैं कि किसी राज्य में वहाँ की व्यवस्था, वहाँ का विकास ठीक नहीं हो रहा है। जब किसी राज्य में गड़बड़ी फैल रही हो विकास का काम समाप्त हो गया हो और जिम्मेदारी से लोग काम न करते हों तो वहाँ पर राज्यपाल-शासन स्थापित किया जाता है। ऐसे बहुत-से उदाहरण हमारे देश में मौजूद हैं। उसी प्रकार से हमारे राष्ट्रपति हैं और अगर देश में इस तरह की स्थिति वर्षों तक चले तो कोई कारण नहीं है आपात के रूप में राष्ट्रपति इस देश की सुरक्षा के लिए, इस देश की उन्नति के लिए जिम्मेदारी अपने हाथ में न ले सकें। हमारे भाइयों ने बहुत-से उदाहरण दिए हैं कि राज्यों में संयुक्त सरकारें नहीं चलीं लेकिन उसके पीछे राजनीतिक हथकंडे थे। अगर कोई राजनीतिक पार्टी जिम्मेदारी से काम नहीं करती तो विधान में यह स्पष्ट है कि राष्ट्रपति शासन अपने हाथ में लें। मैं एक उदाहरण देता हूँ कि संविधान में आदिवासी हरिजनों के उत्थान के लिए प्रण किया गया था कि दस वर्ष में उनकी सामाजिक तथा आर्थिक स्थिति को सुधार देंगे। लेकिन यह सरकार उसमें भी असफल रही। उसको एक बार दस वर्ष के लिए बढ़ाया गया और दुबारा फिर दस वर्ष के लिए बढ़ाया गया। इसी तरह से उसको बढ़ाते जा रहे हैं लेकिन उनकी आर्थिक और सामाजिक उन्नति आप नहीं कर पाए हैं। इस काम में सरकार बिल्कुल असफल हुई है। पिछली बार सरकार पर अविश्वास का प्रस्ताव भी आया था और वह पास होने वाला था। इसलिए मेरा कहना है कि हमारे देश में यह जो बेकारी की समस्या है वह एक बहुत ही भयंकर समस्या है।" },
  { name: "संख्या 13", text: "महोदय, यह भी विचार किया गया है कि जो व्यक्ति समाज में काम करता है चाहे आविष्कार का काम करे चाहे दूसरा कोई काम करे उसको उस काम में तब तक सफलता नहीं मिल सकती है जब तक कि समाज का सहयोग या समाज ने जो परिश्रम किया है या कुछ आविष्कार किया है उसका उपयोग उसको प्राप्त न हो, उसका उपयोग वह न कर सके। इसलिए जब भी कोई व्यक्ति किसी वस्तु का आविष्कार करता है तो आविष्कार करने में न केवल उसका अपना परिश्रम रहता है लेकिन साथ ही साथ समाज ने जो काम किया होता है चाहे विज्ञान के क्षेत्र में या प्रौद्योगिकी के क्षेत्र में या किसी अन्य क्षेत्र में उस सबसे भी वह लाभान्वित होता है। इसलिए जब हम किसी आविष्कारक के किसी आविष्कार के अधिकार की रक्षा करना चाहते हैं तो उसके साथ-साथ यह भी विचार हमारे दिमाग में आता है जिस व्यक्ति ने समाज की सहायता से आविष्कार किया है, उस समाज को भी उसका फल अधिक से अधिक मिलना चाहिए। माननीय मंत्री जी ने भी कहा है कि पेटेन्ट ला इस सिद्धांत पर आधारित होना चाहिए। मैं समझता हूँ कि पेटेन्ट ला के पीछे दो सिद्धांत निश्चित हैं। पहला सिद्धांत तो यह है कि जो व्यक्ति परिश्रम करके, धन लगाकर, अपना दिमाग लगाकर के किसी वस्तु का आविष्कार करता है, उसके तथा अपने परिवार के लोगों के अधिकारों की जहाँ रक्षा होनी चाहिए उसके साथ ही साथ जैसा मैंने अभी कहा है कोई व्यक्ति समाज में व्यर्थ में काम नहीं करता है वरन् पिछले समाज के लोगों ने जो-जो काम किए होते हैं चाहे विज्ञान के क्षेत्र में या प्रौद्योगिकी के क्षेत्र में या किसी अन्य क्षेत्र में और जिनके आधार पर वह कोई आविष्कार करता है उसको उस का प्रतिफल तो मिले लेकिन जो परिणाम हो, उसका प्रतिफल समाज को भी मिलना चाहिए। मंत्री महोदय ने कहा है कि जो यह सिद्धांत है वह भी इस विधेयक के पीछे स्थापित किया गया है और इस बात का ध्यान रखा गया है कि जहाँ हम किसी व्यक्ति के आविष्कार के जो अधिकार है चाहे धन के उपार्जन का अधिकार हो, या प्रतिष्ठा प्राप्त करने का अधिकार हो, उसे प्रतिष्ठा का और चाहे धन का, दोनों का लाभ व्यक्ति विशेष को भी मिले।" },
  { name: "संख्या 14", text: "महोदय, देश में जो उद्योग धंधा चल रहा है या देश की उन्नति करने का देश में समृद्धि लाने का जो वैज्ञानिक या प्रौद्योगिकीय आविष्कार हो रहा है उसमें भी उसका उपयोग पूरा-पूरा हो। यदि ऐसा हो तभी मैं समझता हूँ कि हमारी पेटेन्ट प्रणाली सफल सिद्ध हो सकती है। यह प्रश्न उठ सकता है कि किस सीमा तक व्यक्ति के अधिकार की रक्षा की जाए और किस सीमा तक उसके अधिकार का हनन किया जाए ताकि समाज का अधिक से अधिक लाभ हो, समाज उसका अधिक से अधिक उपयोग कर सके। एक दृष्टिकोण जो इसके पीछे है। हमें इस बात का अभिमान है कि हम 101 करोड़ हैं। हमारी कई जातियाँ, कई धर्म, कई भाषाएँ और कई प्रकार के रीति-रिवाज़ हैं। इस विविधता से हमें लाभ उठाना चाहिए, किंतु आज भेदभाव का भूत हमारे सिर पर चढ़ रहा है। भारत को स्वतंत्रता मिली है, इसका अर्थ यह होना चाहिए कि गरीबों की सेवा के लिए आज तक हमें जो सुविधाएँ उपलब्ध नहीं थीं, वे मिली हैं। जिस प्रकार भरत ने अयोध्या के राज्य को राम का समझकर सेवक-वृत्ति से राज्य का काम संभाला था उसी प्रकार हमें समझना चाहिए कि राज्य गरीब जनता का है और उसके नाम पर, उसके संरक्षक बनकर, हमें उसको चलाना है। अब गरीब को ऐसा अनुभव होना चाहिए कि हर एक उसकी सेवा में लग रहा है। सूर्य के उदय होने पर धनी, गरीब सब के घरों में प्रकाश पहुँचता है। ठीक उसी प्रकार स्वराज्य का लाभ सब को एक समान मिलना चाहिए। इसका सुख धनी-निर्धन सबको बराबर मिलना चाहिए। जनता को हमने वचन दिया था कि स्वराज्य मिलने पर हम आपके दुख दूर करेंगे, अब वह समय आ गया है जब कि हमें अपने उस दिए हुए वचन को सार्थक करना है। इतने बड़े देश में विचार-भेद होना स्वाभाविक है। देखना यह है कि हम लोगों के विचारों में कुछ समान अंश भी हैं या नहीं। यदि हैं तो समान कार्यक्रम बनाइए। इस प्रकार कार्य करने से हमारे भेदभाव कम होते-होते एक दिन मिट जाएँगे और अच्छी बातों का अपने आप उदय होने लगेगा। अगर उसी प्रकार भेद स्थापित करने का प्रयत्न किया गया तो लोग सत्ता के पीछे पड़ जाएँगे और स्वराज्य प्राप्त होने का आनंद हम लोगों को नहीं मिल सकेगा।" },
  { name: "संख्या 15", text: "अध्यक्ष जी, किसी भी देश की विदेश नीति अपने में कोई स्वतंत्र नीति नहीं होती है वरन, वह किसी देश की आंतरिक नीति को स्पष्ट करती है। उदाहरण के लिए हम अमरीका को ले सकते हैं। उसने अपने यहाँ अधिक अन्न पैदा किया और जब उसके पास अनाज फालतू बच गया तब वह अपने बकाया अनाज की बिक्री के लिए ऐसे देशों की तलाश करने लगा, जो उधार पर माल ले सकते हों। किंतु हमारी आंतरिक नीति ने यह तय किया कि खर्चीले ढँग से सरकार चलाएँगे और स्वदेशी मुद्रा की कोई राशि हमारे पास नहीं बचेगी। हमने कर भी लगा दिए और मुद्रा प्रसार भी कर दिया। कुछ संकट पड़ने के बाद इस बात की आवश्यकता को नहीं समझा कि उस पैसे का कहीं अन्यत्र उपयोग कर सकें। श्रीमान, मुझे माननीय प्रधानमंत्री जी के इस कथन पर दुख होता है कि दुनिया के अमीर और गरीब देशों का अंतर लगातार बढ़ता जा रहा है। मैं उनसे यह पूछना चाहती हूँ कि भारत की विदेश नीति ने उस अंतर को घटाने की क्या कोशिश की है? क्या भारत सरकार ने कभी दुनिया की पंचायत में यह कहने की हिम्मत की है कि बालिग मताधिकार के आधार पर यूएन०ओ० का चुनाव होकर एक संसद बनाई जाए? और क्या आप में यह देखने की हिम्मत है कि फौज के हिसाब से कर लगा कर एक विकास का खाता खोल दिया जाए? जो देश विकसित हैं उनके मजदूरों का एक घंटा हमारे देश के मजदूरों के 100 घंटों के बराबर माना जाता है, क्योंकि उनके पास साधन है। इसीलिए यह अंतर और भी बढ़ता चला जा रहा है। किसी देश के अंदर आंतरिक नीति में अमीरी और गरीबी का अंतर बढ़ता चला जा रहा हो और वह दुनिया के देशों में विद्यमान अमीरी और गरीबी के इस अभिशाप को समाप्त करेगा, यह समझ में आने वाली बात नहीं है। अब मैं आपका ध्यान एक और बात की ओर दिलाना चाहती हूँ। पूर्वी जर्मनी को मान्यता देते हमें परेशानी होती है इसलिए कि शायद परिचमी जर्मनी को बुरा लगे। लेकिन परिचमी जर्मनी ने तो अपनी रक्षा का भार दूसरों पर छोड़ दिया है। उसने अपनी पूरी शक्ति इस बात पर लगा दी है कि अधिक से अधिक उत्पादन किया जाए? आपने जो समय दिया उसके लिए मैं आभार प्रदर्शन करता हूँ और आपका धन्यवाद करता हूँ।" },
  { name: "संख्या 16", text: "अध्यक्ष जी, जिस समय पाकिस्तान ने भारत पर हमला किया था उस समय उन्होंने देश की रक्षा के लिए महत्वपूर्ण कार्य किया था। इसके साथ ही मैं मंत्री महोदय को यह भी स्मरण दिलाना चाहता हूँ कि शायद उन्होंने इस पर ध्यान नहीं दिया कि इस बार जो राष्ट्रीय पुरस्कार मिले हैं उनमें रेलवे प्रशासन को केवल दो ही प्राप्त हुए हैं जबकि मैं ऐसा मानता हूँ कि हमारी सेना के बाद अगर किसी ने युद्धकाल में सराहनीय कार्य किया है तो वह रेलवे प्रशासन अथवा रेलवे कर्मचारी और अधिकारी हैं। इसलिए उनके मनोबल को बनाए रखने के लिए और उनको प्रोत्साहित करने के लिए रेल मंत्री को इस बात पर भी ध्यान रखना चाहिए और इसका प्रयास करना चाहिए कि जो भी इस तरह के प्रोत्साहन मिलें उनमें रेलवे का विशेष ध्यान रखा जाए। रेल मंत्री महोदय ने अपने वक्तव्य में भी रेलवे कर्मचारियों की प्रशंसा की है या उनको प्रोत्साहन दिलाया है। लेकिन यह प्रोत्साहन शांति-काल में भी बना रहना चाहिए। रेलवे ने युद्धकाल में जो काम किया वह तो देश की रक्षा का महान उद्देश्य था लेकिन उसके बाद देश के निर्माण में या गरीबी मिटाने के लिए जो युद्ध होता है उसमें भी प्रत्येक रेलवे कर्मचारी का मनोबल उसी तरीके से बना रहे इसके लिए भी रेल मंत्री महोदय को कुछ कदम उठाने की आवश्यकता है। मैं ऐसा मानता हूँ कि वे किसी भी तरीके से करें उनका तरीका कुछ भी हो लेकिन उनको यह करना चाहिए कि जितने भी रेलवे कर्मचारी हैं जो भी रेलवे को मुनाफा हो उसमें वे साझीदार हों। चाहे आप उनको बोनस के रूप में कुछ दें चाहे किसी और तरीके से दें लेकिन हर वर्ग के रेलवे कर्मचारी को मालूम होना चाहिए कि यदि वह देश के निर्माण के संबंध में ठीक तरह से काम करेगा तो उसको पुरस्कार के रूप में या वेतन के अंश के रूप में अपने वेतन के अलावा पैसा मिलेगा। इसी प्रकार इस संबंध में और सुझाव देना चाहता हूँ। स्वतंत्रता के बाद रेल प्रशासन भारत सरकार का प्रशासन हो गया लेकिन यह लोकसभा एक विशेष उद्देश्य को लेकर बनी गई है। यह उस कार्यक्रम का एक नमूना ही है। गांधी जी ने जीवन के सभी पहलुओं पर प्रकाश डाला था। धन को वे संयम से व्यय करने के हक में थे।" },
  { name: "संख्या 17", text: "उपाध्यक्ष महोदय, मैं समझता हूँ कि अब तक इस वैदेशिक नीति पर न केवल इस ओर के सदस्यों ने ही, बल्कि दूसरी ओर के सदस्यों ने भी प्रधानमंत्री जी को धन्यवाद दिया है। इसलिए मैं अपनी तरफ से धन्यवाद देकर उनका बोझ बढ़ाना नहीं चाहता। इसमें कोई संदेह नहीं कि इस सदन के सभी सदस्य, चाहे वे किसी भी पार्टी से संबंध रखते हों, इस बात से पूरी तरह सहमत हैं कि हमारी विदेश नीति ने संसार में हमारा सिर ऊँचा उठा दिया है। हमने पंचशील के सिद्धांत को संसार के सामने रखा है। यदि हम उसके आधारभूत सिद्धांत पर दृष्टिपात करें, तो हमें पता चलता है कि हमने संसार में एक सबसे बड़ा काम यह किया है कि हमने तनाव को कम करने का प्रयत्न किया है। जिस समय हमने नई-नई स्वतंत्रता प्राप्त की, तो हमारे सामने बहुत-से प्रश्न थे। उनके साथ ही हमारे दो बड़े गुट थे, जो एटम बम और दूसरे बम लिए हुए हमें चुनौती दे रहे थे कि अगर हम उनमें से किसी एक गुट में सम्मिलित नहीं हुए, तो हमें बड़ी कठिनाई होगी। उस समय भी हमारे प्रधानमंत्री ने हमारे देश की वैदेशिक नीति को इसी स्तर पर रखा, जिसके कारण आज हम संसार में अपना सिर ऊँचा उठा सकते हैं। हमने जो संसार के सामने पंचशील के सिद्धांत को रखा, उसका सबसे बड़ा फल यह हुआ कि एक सम्मेलन हुआ, जिसकी ओर मैं आपका ध्यान दिलाना चाहता हूँ। इस सम्मेलन में बड़े उत्साह के साथ संसार के 29 राष्ट्रों ने, जो एशिया और अफ्रीका से संबंध रखते थे, यह घोषणा की कि हम संसार में तनाव कम करना चाहते हैं और साथ ही यह चाहते हैं कि संसार में जो विभिन्न सामाजिक और आर्थिक नीतियाँ हैं, वे साथ-साथ चल सकें। हमारी वैदेशिक नीति में जो सबसे महत्वपूर्ण चीज है, वह है सह-अस्तित्व की भावना। उसी भावना के फलस्वरूप हम देखते हैं कि आज कोरिया का युद्ध नहीं हुआ, जो कि तीसरे विश्व युद्ध के रूप में परिवर्तित हो सकता था। हमारी इस नीति के कारण हमारे अमेरिकी मित्र हमसे कुछ अप्रसन्न भी हो गए। लेकिन यदि हम ऐसा न करते, तो आज संसार को तीसरा युद्ध देखना पड़ता। मैं बहुत ज्यादा समय नहीं लूँगा, थोड़ा ही लूँगा।" },
  { name: "संख्या 18", text: "उपाध्यक्ष महोदय, मैं निवेदन कर रहा था कि जब हम कोई प्रश्न उठाएँ तो यह देखें कि हम इसमें से कहाँ तक बढ़ा सकते हैं। किसी चीज का मूल्य क्या हो, महँगी पड़े या सस्ती पड़े, इसको हमें विशेष नहीं देखना है। गाँधी जी ने कितनी ही बार हम लोगों को यह बात समझाई कि मूल्य किसी चीज का रुपए-पैसे में क्या है, यह कोई महत्व की बात नहीं है। आप जानते होंगे कि एक वस्तु जो कि हमारे देश में बहुत सस्ती मिलती है, वही वस्तु दूसरे देश में महँगी मिलती है। इतना निवेदन करने के बाद अब मैं श्रम विभाग की जो रिपोर्ट है, उसकी एक मद की ओर तुरंत आ जाता हूँ। जैसा कि पहले मैंने कहा मैं समझता हूँ कि हमारे इस श्रम विभाग का महत्व दिन-प्रतिदिन बढ़ेगा। बहुत-से प्रश्न हैं जिनकी तरफ आपका ध्यान भी नहीं है, उन प्रश्नों को आपको लेना पड़ेगा। आज आपका श्रम विभाग अधिकांश औद्योगिक श्रमिकों की ओर ध्यान दे रहा है। अभी हमारे माननीय सदस्य ने जो खेतिहर मजदूरों की दशा सुधारने की ओर भी आपका ध्यान दिलाया था और बताया था कि आज उनकी कैसी खराब हालत हो रही है, मैं उनसे पूरी तरह सहमत हूँ। हमारी सरकार का ध्यान देहाती श्रमिकों की ओर नहीं गया है। उनकी बड़ी बुरी हालत है। आपने उनकी दशा सुधारने के लिए क्या किया है? मैं पूछना चाहता हूँ कि जो लाखों और करोड़ों आदमी देहातों में बेकार बैठे हुए हैं उनको मजदूरी और काम दिलाने के लिए आप क्या कर रहे हैं? करीब सात लाख आदमी नौकरियों के लिए प्रार्थी हैं जैसा कि रिपोर्ट में लिखा है। इनके अतिरिक्त कितने ही लाखों और करोड़ों आदमी देहातों में बेकार बैठे हुए हैं और कितने ही आधी बेकारी की हालत में हैं और श्रम विभाग उन बेकारों और आधे बेकारों की संख्या पता लगाने में असमर्थ है। उनकी संख्या हमको कहीं नहीं मिलती है। मेरा निवेदन यह है कि हमारे देश में बेकारी बहुत अधिक है। जितना अधिक हम बेकारी को दूर कर सकेंगे उतना ही अधिक हम अपने देश और समाज को सुखी बनाएँगे। इस कार्य में आपका और आपके विभाग का दायित्व बहुत अधिक है। जो भी नया काम आरंभ होता है, उसका दायित्व श्रम विभाग पर रहता है। धन जनता की भलाई के लिए खर्च होना चाहिए।" },
  { name: "संख्या 19", text: "महोदय, जब तक अहिंदी-भाषी हिंदी को हृदय से स्वीकार नहीं करते तब तक वह राष्ट्रभाषा का स्थान नहीं पा सकती। और यह तभी हो सकता है जब वे यह समझें कि इसमें उनका भी योगदान है और उन्होंने इससे केवल लिया ही नहीं बल्कि इसे कुछ दिया भी है और उन पर कोई दूसरी भाषा लादी नहीं गई है बल्कि यह उनकी ही भाषा है। मेरे कहने का अर्थ यह नहीं कि आप उनकी ही व्याकरण अपना लें। इसका अर्थ यही है कि आप उदारतापूर्वक जितना ले सकते हैं ले लें। भाषा इसी प्रकार बन सकती है। यह भी आवश्यक नहीं है कि उसको स्वीकार करने पर आप वही लिखना आरंभ कर दें। परंतु जो वे लिखें, उसको आप गलत न समझें। आज किसी भी भाषा का रूप वही नहीं है जो उसके प्रारंभिक काल में था। उसमें परिवर्तन होता रहता है। हिंदी के इतिहास में भी आपको यही बात मिलेगी। मैं हिंदी का कोई विद्वान नहीं हूँ पर मैं अपने अनुभव से कह सकता हूँ कि उसमें भी पिछले पाँच-छह सौ वर्षों में बहुत अंतर पड़ा है तथा पहले की और आज की हिंदी में काफी अंतर है। इसलिए नवयुग में जब वह देश की भाषा बनने जा रही है तो उसमें थोड़ा अंतर करना भी पड़े तो वह स्वीकार कर लेना चाहिए जिससे उसका अन्य प्रदेशों के लोगों के साथ मेल बैठ जाए। कई अहिंदी-भाषी लोगों ने भी हिंदी की काफी सेवा की है। आपके राज्यपाल महोदय अहिंदी-भाषी हैं और इन्होंने अपनी भाषा की बड़ी सेवा की है। यह भी हिंदी के पक्ष में थे और इन्होंने बड़ा योग दिया जिसके कारण हम संविधान सभा में सफल हो सके। इनका भी यही विचार है जो मेरा है। मैं चाहता हूँ कि इनको भी हिंदी की सेवा करने का अवसर दिया जाना चाहिए। उसका फल हिंदी के लिए और देश के लिए अच्छा ही होगा। मानपत्र में आपने संस्कृत के संबंध में कहा है। मैं मानता हूँ कि हमारे देश में संस्कृत का अध्ययन आवश्यक है क्योंकि देश की सभी भाषाओं का स्रोत वही भाषा है। संस्कृत से हमारा संबंध अटूट है। इसकी पढ़ाई-लिखाई कम हो गई है, यह हमारे लिए दुख की बात है। मैं आशा करता हूँ कि इसकी उन्नति होगी।" },
  { name: "संख्या 20", text: "महोदय, मैं अपने बारे में कहता हूँ। जब मैं छोटा था और कॉलेज में पढ़ रहा था तब रूस और जापान के बीच युद्ध छिड़ा। उस समय समाचार पत्रों में जापान के संबंध में बहुत-सी बातें छपा करती थीं। उनमें एक बात यह भी थी कि जापान में समुरिया जाति के लोगों ने अपने सब अधिकार वहाँ के राजा को दे दिए थे। उसके बाद जापान बड़ी उन्नति कर सका। हम लोग यह पढ़कर आश्चर्य और सराहना करते थे। उससे बढ़कर हमारे यहाँ के लोगों ने स्वराज्य स्थापित होने के बाद एक-दो वर्ष में एक उदाहरण उपस्थित करके दिखाया। हम भी अपने हजारों वर्षों के इतिहास को नहीं भूलेंगे। जो रियासतें अलग-अलग स्थापित हो गई थीं और एक प्रकार से भारत कई टुकड़ों में बँटा हुआ था, वे सब टुकड़े एक हो गए। आज ब्रिटिश भारत और देशी रियासतें मिलकर एक हो गई हैं। उसके बाद हमारे सामने यह प्रश्न आया कि भारत के लोग केवल स्वराज्य से ही सुखी नहीं हो सकते। उनको किसी न किसी प्रकार सुखी बनाना है। इस संबंध में सरकार ने अपनी ओर से प्रायः सभी राज्यों में जमींदारी और जागीरदारी उन्मूलन के कानून उपस्थित किए और वे कानून पास हुए। प्रसन्नता की बात तो यह है कि बहुत-से स्थानों में कानून उन लोगों की स्वीकृति से तथा उन लोगों की सलाह से पास किए जिनकी जमींदारी और जागीरदारी समाप्त हो जानी थी। यह भी देश-प्रेम का उदाहरण है। उन लोगों ने अपनी संपत्ति का त्याग इसलिए किया कि उससे सारे देश को लाभ पहुँचे। वह काम भी लगभग पूरा हो गया और पूरा होता जा रहा है। हमारे सामने मार्ग प्रशस्त है और अब हमें इस पर चलने की शक्ति चाहिए। हममें परस्पर कभी-कभी इस प्रकार की संकुचित धार्मिक अथवा सामाजिक भावना देखने में आती है जिसके कारण कभी-कभी लड़ाई-झगड़े हो जाते हैं। हम इस चीज को भी दूर करने का प्रयत्न कर रहे हैं। हमारे संविधान में स्पष्ट बता दिया गया है कि कोई चाहे किसी भी धर्म का क्यों न हो, किसी भी जाति का क्यों न हो, इस देश में सबको समान अधिकार है। गरीब से गरीब आदमी को भी वही एक वोट देने का अधिकार है जो कि राजा साहब को है या मुझे। धर्म के नाम पर किसी प्रकार का भेदभाव नहीं किया जाता है।" },
  { name: "संख्या 21", text: "अध्यक्ष महोदय, मैं आपका आभारी हूँ कि आपने मुझे बोलने का अवसर दिया। इस देश के वर्तमान भारी संकट के समय में और विशेष रूप से उस समय जबकि हम लड़ाई से अभी निवृत्त हुए हैं और आकाश में लड़ाई के बादल दूसरी तरफ से आने शुरू हुए हैं हमारे वित्त मंत्री ने जो बजट पेश किया है, वे इसके लिए बधाई के पात्र हैं। यद्यपि भिन्न-भिन्न पहलुओं को लेकर आलोचनाएँ की गई हैं लेकिन यदि उनकी कठिनाइयों को भी देखा होता कि राष्ट्र को किन-किन संकटों का सामना करना पड़ रहा है इस बात पर भी अगर मेरे से पहले बोलने वाले वक्ताओं ने विचार किया होता तो मेरा विश्वास है कि उनकी आलोचनाओं का आधार कुछ दूसरा होता। उन्होंने ऐसे कठिन अवसर पर यह एक संतुलित बजट पेश किया है उसके लिए मैं उन्हें बार-बार बधाई देता हूँ लेकिन साथ ही साथ मैं अपना यह कर्तव्य समझता हूँ कि कुछ ऐसे विचार भी उनके सामने प्रस्तुत करूँ जिससे उनकी कठिनाइयाँ कुछ हल हो जाएँ। उदाहरण के रूप में विगत दो वर्षों में लेखा-जोखा कमेटी में बैठने के समय मुझे ऐसा अनुभव हुआ है कि इस देश में दो, तीन इस प्रकार की त्रुटियाँ मौजूद हैं जिनको दूर करने के लिए, जिनकी जाँच करने के लिए यदि कोई एक कमेटी या आयोग बिठा दिया जाए तो राष्ट्र को, राष्ट्र की सरकार को, राष्ट्र के विकास कार्यों को और राष्ट्र की रक्षा व्यवस्था के लिए करोड़ों नहीं अरबों की व्यवस्था फौरन हो सकती है। केवल शासन को जागरूक होकर कुछ कदम उठाने की आवश्यकता है। अभी कुछ छिपे हुए धन का जिक्र किया गया। सरकार ने भी समय-समय पर ऐसा आभास दिया है कि इस देश में लगभग 30000 करोड़ रुपए का छिपा धन मौजूद है। स्वयं मैं समझ नहीं पाता हूँ कि जब सरकार ऐसा अनुभव करती है तो इसकी व्यवस्था करने में उसको दिक्कत क्या आ रही है। ऐसा मालूम होता है कि कहीं इच्छा शक्ति की कमी है। भारत की इस सरकार ने अपनी शक्ति का ठीक से उपयोग करके उस दुश्मन के दाँत खट्टे किए जिसके कि ऊपर विश्व की शक्तिशाली और इंग्लैंड जैसी शक्तियों का अटूट सहारा था और जिसकी कि उन्होंने हमारे विरुद्ध उकसा कर खड़ा किया था और अपना पूर्ण सहयोग दिया था।" },

const list = document.getElementById('mattersList');
const searchInput = document.getElementById('matterSearch');

function renderMatters(query = '') {
  const search = query.trim().toLowerCase();
  list.replaceChildren();

  const matches = RAMDHARI_MATTERS.filter((matter) => {
    const number = matter.name.match(/\d+/)?.[0] || '';
    return !search || matter.name.toLowerCase().includes(search) || number.includes(search);
  });

  matches.forEach((matter) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'matter-item';
    button.textContent = matter.name;
    button.onclick = () => selectMatter(matter.text, matter.name);
    list.appendChild(button);
  });

  if (!matches.length) {
    const empty = document.createElement('p');
    empty.textContent = 'No matching transcriptions found.';
    list.appendChild(empty);
  }
}

searchInput.addEventListener('input', () => renderMatters(searchInput.value));
renderMatters();

// Apply the same saved dark-mode preference used by KC Matters.
if (localStorage.getItem('darkMode') === 'on') document.body.classList.add('dark');
